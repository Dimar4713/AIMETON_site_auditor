name: Persist Krasnoyarsk Dentistry Three-Provider Evidence Once

on:
  push:
    branches:
      - docs/krasnoyarsk-dentistry-three-provider-evidence
    paths:
      - .github/workflows/persist-krasnoyarsk-dentistry-three-provider-evidence-once.yml

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout clean evidence branch
        uses: actions/checkout@v4
        with:
          ref: docs/krasnoyarsk-dentistry-three-provider-evidence
          fetch-depth: 0

      - name: Download exact Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          target='docs/evidence/search-benchmarks/2026-08-09-krasnoyarsk-dentistry-three-provider'
          mkdir -p "$target" /tmp/three-provider-replay

          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/9032734706/zip" > "$target/yandex-snapshot.zip"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/9032735693/zip" > "$target/tavily-snapshot.zip"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/9032734734/zip" > "$target/searxng-snapshot.zip"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/9032787062/zip" > "$target/three-provider-replay.zip"

      - name: Verify exact artifact SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          target='docs/evidence/search-benchmarks/2026-08-09-krasnoyarsk-dentistry-three-provider'
          cd "$target"
          echo 'fc91dbbc4818c6654b534b42902063c6a0a3758b8ce7fe2a74d62f1c00a9da04  yandex-snapshot.zip' | sha256sum -c -
          echo 'b2e39fa3ea4ac8bae2ac40d2d4606f9bd37b97cb679caa088cd4ac0806ff9f5d  tavily-snapshot.zip' | sha256sum -c -
          echo '44ad03bc66510b976c31226ef3a6524be3a37963746bd2be8bc621798921de90  searxng-snapshot.zip' | sha256sum -c -
          echo 'c08e061e1e3473579940537ffecb2db47c9c1f7276af285ef332f2fe12b4bb31  three-provider-replay.zip' | sha256sum -c -

      - name: Extract structured benchmark results
        shell: bash
        run: |
          set -Eeuo pipefail
          target='docs/evidence/search-benchmarks/2026-08-09-krasnoyarsk-dentistry-three-provider'
          rm -rf /tmp/three-provider-replay
          mkdir -p /tmp/three-provider-replay
          unzip -q "$target/three-provider-replay.zip" -d /tmp/three-provider-replay
          test -f /tmp/three-provider-replay/benchmark.json
          test -f /tmp/three-provider-replay/summary.md
          test -f /tmp/three-provider-replay/replay.log
          cp /tmp/three-provider-replay/benchmark.json "$target/benchmark.json"
          cp /tmp/three-provider-replay/summary.md "$target/summary.md"
          cp /tmp/three-provider-replay/replay.log "$target/replay.log"
          (
            cd "$target"
            sha256sum benchmark.json summary.md replay.log yandex-snapshot.zip tavily-snapshot.zip searxng-snapshot.zip three-provider-replay.zip > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Commit evidence and remove one-shot transport workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/persist-krasnoyarsk-dentistry-three-provider-evidence-once.yml
          git add docs/evidence/search-benchmarks/2026-08-09-krasnoyarsk-dentistry-three-provider
          git commit -m 'Persist three-provider Krasnoyarsk dentistry benchmark evidence'
          git push origin HEAD:docs/krasnoyarsk-dentistry-three-provider-evidence
