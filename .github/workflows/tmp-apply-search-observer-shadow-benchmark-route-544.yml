name: Temporary apply Search Observer shadow benchmark route 544

on:
  push:
    branches:
      - feat/search-observer-shadow-benchmark-stage-544

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-observer-shadow-benchmark-stage-544
          fetch-depth: 0
      - name: Apply command router patch
        run: python scripts/patch_search_observer_shadow_benchmark_route_544.py
      - name: Validate workflow text
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/aimeton-command-router.yml').read_text(encoding='utf-8')
          assert 'benchmark-search-observer-shadow-stage' in text
          assert 'issue_number: 544' in text
          assert "workflow_id: 'benchmark-search-observer-shadow-stage.yml'" in text
          PY
      - name: Commit router change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/aimeton-command-router.yml
          git diff --cached --quiet && exit 0
          git commit -m "Route owner-gated Search Observer shadow benchmark"
          git push origin HEAD:feat/search-observer-shadow-benchmark-stage-544
