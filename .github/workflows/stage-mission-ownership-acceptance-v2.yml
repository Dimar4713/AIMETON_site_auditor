name: Stage Mission Ownership Acceptance V2

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-stage-mission-ownership-acceptance
  cancel-in-progress: false

jobs:
  accept:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 177 &&
       github.event.comment.body == '/accept-mission-stage-v2' &&
       github.event.comment.user.login == 'Dimar4713')
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 25
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      STAGE_URL: https://stage-auditor.aimeton.ru

    steps:
      - name: Verify ownership, recovery and persistence
        id: acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          report="$RUNNER_TEMP/stage-mission-ownership-v2.md"
          suffix="${GITHUB_RUN_ID}-$(date -u +%s)-$RANDOM"
          alice="accept-alice-$suffix"
          bob="accept-bob-$suffix"
          admin="accept-admin-$suffix"
          turn_id="turn-$suffix"
          udp_id="udp-$suffix"
          alice_token=""; bob_token=""; admin_token=""; mission_id=""
          csrf="csrf-$suffix"
          current_step="initialization"
          echo "report=$report" >> "$GITHUB_OUTPUT"

          write_failure() {
            local code="$1" line="$2"
            {
              echo "## Independent stage mission ownership acceptance V2"
              echo
              echo "- workflow run: $GITHUB_RUN_ID"
              echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "- verdict: ❌ failed"
              echo "- failed step: \`$current_step\`"
              echo "- shell line: \`$line\`"
              echo "- exit code: \`$code\`"
              echo "- credentials/session tokens/internal payloads: not recorded"
            } > "$report"
          }
          trap 'code=$?; line=$LINENO; if [[ $code -ne 0 ]]; then write_failure "$code" "$line"; fi' ERR

          cleanup() {
            set +e
            docker exec -i \
              -e TEST_ALICE="$alice" -e TEST_BOB="$bob" -e TEST_ADMIN="$admin" \
              -e TEST_MISSION_ID="$mission_id" "$CONTAINER" python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          auth = Path(os.environ.get("AIMETON_AUTH_DB", "/app/data/auth.sqlite3"))
          missions = Path(os.environ.get("AIMETON_MISSION_DB", "/app/data/missions.sqlite3"))
          if missions.exists() and os.environ.get("TEST_MISSION_ID"):
              with sqlite3.connect(missions) as db:
                  db.execute("DELETE FROM mission_records WHERE mission_id = ?", (os.environ["TEST_MISSION_ID"],))
                  db.execute("DELETE FROM missions WHERE id = ?", (os.environ["TEST_MISSION_ID"],))
          if auth.exists():
              with sqlite3.connect(auth) as db:
                  for username in (os.environ["TEST_ALICE"], os.environ["TEST_BOB"], os.environ["TEST_ADMIN"]):
                      row = db.execute("SELECT id FROM users WHERE username = ?", (username,)).fetchone()
                      if row:
                          db.execute("DELETE FROM sessions WHERE user_id = ?", (row[0],))
                          db.execute("DELETE FROM users WHERE id = ?", (row[0],))
          PY
          }
          trap cleanup EXIT

          wait_healthy() {
            local deadline=$((SECONDS + 240)) status=""
            while (( SECONDS < deadline )); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER" 2>/dev/null || true)"
              [[ "$status" == healthy ]] && return 0
              [[ "$status" == unhealthy || "$status" == exited || "$status" == dead ]] && return 1
              sleep 5
            done
            return 1
          }

          current_step="runtime readiness"
          docker ps --format '{{.Names}}' | grep -Fxq "$CONTAINER"
          wait_healthy
          docker exec -i "$CONTAINER" python - <<'PY'
          from app.admin_users import AdminSQLiteUserRepository
          from app.auth import PasswordHasher, UserRole
          from app.session_resolution import TypedLocalAuthProvider
          from app.mission_sqlite import SQLiteMissionRepository
          from app.mission_recovery import recovery_decision
          from app.mission_api import router
          assert all((AdminSQLiteUserRepository, PasswordHasher, UserRole, TypedLocalAuthProvider, SQLiteMissionRepository, recovery_decision, router))
          PY

          current_step="temporary identities"
          mapfile -t credentials < <(docker exec -i \
            -e TEST_ALICE="$alice" -e TEST_BOB="$bob" -e TEST_ADMIN="$admin" \
            "$CONTAINER" python - <<'PY'
          import os, secrets
          from datetime import timedelta
          from pathlib import Path
          from app.admin_users import AdminSQLiteUserRepository
          from app.auth import PasswordHasher, UserRole
          from app.session_resolution import TypedLocalAuthProvider
          repo = AdminSQLiteUserRepository(Path(os.environ.get("AIMETON_AUTH_DB", "/app/data/auth.sqlite3")))
          provider = TypedLocalAuthProvider(repo, session_ttl=timedelta(minutes=30))
          for env_name, role in (("TEST_ALICE", UserRole.USER), ("TEST_BOB", UserRole.USER), ("TEST_ADMIN", UserRole.ADMIN)):
              user = repo.create_user(os.environ[env_name], PasswordHasher().hash(secrets.token_urlsafe(48)), role)
              print(f"{user.id}|{provider.create_session(user).token}")
          PY
          )
          [[ ${#credentials[@]} -eq 3 ]]
          alice_id="${credentials[0]%%|*}"; alice_token="${credentials[0]#*|}"
          bob_token="${credentials[1]#*|}"; admin_token="${credentials[2]#*|}"
          echo "::add-mask::$alice_token"; echo "::add-mask::$bob_token"; echo "::add-mask::$admin_token"
          cookie_alice="aimeton_session=$alice_token; aimeton_csrf=$csrf"
          cookie_bob="aimeton_session=$bob_token; aimeton_csrf=$csrf"
          cookie_admin="aimeton_session=$admin_token; aimeton_csrf=$csrf"

          current_step="owner mission creation"
          created="$(curl -fsS -X POST "$STAGE_URL/api/user/missions" \
            --cookie "$cookie_alice" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' \
            --data '{"title":"Stage ownership acceptance V2","target_ref":"https://example.org","input_snapshot":{"secret_seed":"must-not-leak"},"correlation_id":"stage-ownership-v2","owner_id":999999}')"
          mission_id="$(python3 -c 'import json,sys; p=json.loads(sys.argv[1]); assert "owner_id" not in p and "input_snapshot" not in p and "technical_snapshot" not in p; print(p["id"])' "$created")"

          current_step="stable mission records"
          docker exec -i -e TEST_MISSION_ID="$mission_id" -e TEST_TURN_ID="$turn_id" -e TEST_UDP_ID="$udp_id" "$CONTAINER" python - <<'PY'
          import os
          from app.mission_sqlite import SQLiteMissionRepository
          repo = SQLiteMissionRepository()
          mid = os.environ["TEST_MISSION_ID"]
          repo.append_record(mid, "turn", {"turn": 1, "result": "observed"}, record_id=os.environ["TEST_TURN_ID"])
          repo.append_record(mid, "sufficiency", {"decision": "continue", "deficits": ["ownership-proof"]}, record_id=os.environ["TEST_UDP_ID"])
          PY

          current_step="cross-user isolation"
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --cookie "$cookie_bob" "$STAGE_URL/api/user/missions/$mission_id")" == 404 ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH --cookie "$cookie_bob" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' --data '{"state":"completed"}' "$STAGE_URL/api/user/missions/$mission_id/state")" == 404 ]]

          current_step="admin policy boundary"
          admin_view="$(curl -fsS --cookie "$cookie_admin" "$STAGE_URL/api/admin/missions/$mission_id")"
          python3 -c 'import json,sys; p=json.loads(sys.argv[1]); assert p["id"]==sys.argv[2] and p["owner_id"]==int(sys.argv[3])' "$admin_view" "$mission_id" "$alice_id"

          current_step="degraded state"
          curl -fsS -X PATCH "$STAGE_URL/api/user/missions/$mission_id/state" --cookie "$cookie_alice" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' --data '{"state":"degraded"}' | python3 -c 'import json,sys; assert json.load(sys.stdin)["state"]=="degraded"'

          verify_persisted() {
            docker exec -i -e TEST_MISSION_ID="$mission_id" -e TEST_OWNER_ID="$alice_id" -e TEST_TURN_ID="$turn_id" -e TEST_UDP_ID="$udp_id" "$CONTAINER" python - <<'PY'
          import os
          from app.mission_sqlite import SQLiteMissionRepository
          from app.mission_recovery import RecoveryDisposition, recovery_decision
          repo = SQLiteMissionRepository()
          mission = repo.get_for_admin(os.environ["TEST_MISSION_ID"])
          assert mission and mission.owner_id == int(os.environ["TEST_OWNER_ID"]) and mission.state.value == "degraded"
          records = repo.records_for_owner(mission.owner_id, mission.id)
          expected = {(os.environ["TEST_TURN_ID"], "turn"), (os.environ["TEST_UDP_ID"], "sufficiency")}
          assert {(r["id"], r["kind"]) for r in records} == expected
          decision = recovery_decision(mission)
          assert decision.disposition is RecoveryDisposition.REVIEW_DEGRADED and decision.state.value == "degraded"
          PY
          }

          current_step="pre-restart persistence"
          verify_persisted
          current_step="container restart persistence"
          docker restart "$CONTAINER" >/dev/null; wait_healthy; verify_persisted
          current_step="compose recreate persistence"
          docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.runtime-secrets.yml up -d --force-recreate auditor
          wait_healthy; verify_persisted

          current_step="database integrity"
          integrity="$(docker exec -i "$CONTAINER" python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          path = Path(os.environ.get("AIMETON_MISSION_DB", "/app/data/missions.sqlite3"))
          with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as db:
              print(db.execute("PRAGMA integrity_check").fetchone()[0])
          PY
          )"
          [[ "$integrity" == ok ]]
          deployed_sha="$(cat "$STACK_DIR/app-source-sha.txt" 2>/dev/null || echo unavailable)"
          {
            echo "## Independent stage mission ownership acceptance V2"
            echo
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- deployed source SHA: \`$deployed_sha\`"
            echo "- server-derived ownership: ✅"
            echo "- cross-user read/write: ✅ 404/404"
            echo "- admin policy boundary: ✅"
            echo "- unique stable turn and УДП records: ✅"
            echo "- degraded recovery remains review_degraded: ✅"
            echo "- persistence after restart and force-recreate: ✅"
            echo "- SQLite integrity: \`$integrity\`"
            echo "- credentials/session tokens/internal payloads: not recorded"
            echo
            echo "### Verdict"
            echo "✅ Stage mission ownership V2 acceptance passed."
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-mission-ownership-v2-${{ github.run_id }}
          path: ${{ steps.acceptance.outputs.report }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence to SA-MVP-01C
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.acceptance.outputs.report }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 177,
              body: report.slice(0, 60000),
            });
