name: MCP Security Acceptance

on:
  workflow_dispatch:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-mcp-security-acceptance
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      run_acceptance: ${{ steps.route.outputs.run_acceptance }}
    steps:
      - id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          run_acceptance=true
          if [[ "$EVENT_NAME" == "issues" && ( "$ISSUE_NUMBER" != "39" || "$LABEL_NAME" != "mcp-security-check" ) ]]; then
            run_acceptance=false
          fi
          echo "run_acceptance=$run_acceptance" >> "$GITHUB_OUTPUT"
          printf 'event=%s ref=%s sha=%s decision=%s\n' "$EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA" "$run_acceptance"

  accept:
    needs: route
    if: needs.route.outputs.run_acceptance == 'true'
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 15
    env:
      STAGE_URL: https://stage-auditor.aimeton.ru
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact deployed SHA
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p security-evidence
          deployed_sha="$(tr -d '[:space:]' < "$STACK_DIR/app-source-sha.txt")"
          [[ "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$deployed_sha" >> "$GITHUB_OUTPUT"
          printf '{"deployed_sha":"%s","workflow_sha":"%s"}\n' "$deployed_sha" "$GITHUB_SHA" > security-evidence/identity.json

      - name: Run security regression suite at deployed SHA
        shell: bash
        env:
          DEPLOYED_SHA: ${{ steps.deploy.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --depth=1 origin "$DEPLOYED_SHA"
          git worktree add --detach /tmp/aimeton-security-"$GITHUB_RUN_ID" "$DEPLOYED_SHA"
          cd /tmp/aimeton-security-"$GITHUB_RUN_ID"
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -q -r requirements.txt
          pytest -q tests/test_mcp_security.py | tee "$GITHUB_WORKSPACE/security-evidence/security-tests.txt"

      - name: Diagnose admin token chain without disclosure
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p security-evidence
          diag_key="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          docker exec -i -e DIAG_KEY="$diag_key" "$CONTAINER" python - <<'PY' > /tmp/token-process-meta.json
          import hashlib, hmac, json, os
          name="AIMETON_MCP_ADMIN_TOKEN"
          key=bytes.fromhex(os.environ["DIAG_KEY"])
          shell_value=os.environ.get(name)
          pid_value=None
          try:
              prefix=(name+"=").encode()
              item=next((x for x in open("/proc/1/environ","rb").read().split(b"\0") if x.startswith(prefix)),None)
              if item is not None:
                  pid_value=item[len(prefix):].decode("utf-8","surrogateescape")
          except OSError:
              pass
          def meta(value):
              if value is None:
                  return {"present":False,"hmac":None}
              trimmed=value.strip()
              return {
                  "present":True,"nonempty":bool(value),"length":len(value),
                  "trimmed_length":len(trimmed),"raw_eq_trimmed":value==trimmed,
                  "leading_whitespace":bool(value[:1].isspace()),
                  "trailing_whitespace":bool(value[-1:].isspace()),
                  "contains_cr":"\r" in value,"contains_lf":"\n" in value,
                  "hmac":hmac.new(key,value.encode("utf-8","surrogateescape"),hashlib.sha256).hexdigest(),
              }
          print(json.dumps({"exec_shell":meta(shell_value),"pid1_process":meta(pid_value)}))
          PY
          DIAG_KEY="$diag_key" STACK_DIR="$STACK_DIR" CONTAINER="$CONTAINER" python3 - <<'PY'
          import hashlib, hmac, json, os, re, subprocess
          from pathlib import Path
          name="AIMETON_MCP_ADMIN_TOKEN"
          key=bytes.fromhex(os.environ["DIAG_KEY"])
          inspect=json.loads(subprocess.check_output(["docker","inspect",os.environ["CONTAINER"]],text=True))[0]
          values={}
          for item in inspect.get("Config",{}).get("Env",[]):
              key_name,sep,value=item.partition("=")
              if sep:
                  values[key_name]=value
          configured=values.get(name)
          inner=json.loads(Path("/tmp/token-process-meta.json").read_text())
          def digest(value):
              return hmac.new(key,value.encode("utf-8","surrogateescape"),hashlib.sha256).hexdigest() if value is not None else None
          configured_hmac=digest(configured)
          shell_hmac=inner["exec_shell"].pop("hmac",None)
          pid_hmac=inner["pid1_process"].pop("hmac",None)
          stack=Path(os.environ["STACK_DIR"])
          compose=stack/"docker-compose.yml"
          compose_text=compose.read_text(encoding="utf-8",errors="replace") if compose.is_file() else ""
          env_candidates=0
          for candidate in stack.glob(".env*"):
              if candidate.is_file() and re.search(r"(?m)^\s*(?:export\s+)?"+re.escape(name)+r"\s*=",candidate.read_text(encoding="utf-8",errors="replace")):
                  env_candidates+=1
          trimmed=configured.strip() if configured is not None else None
          result={
              "source":{"compose_file_present":compose.is_file(),"compose_mentions_key":name in compose_text,"env_file_candidates":env_candidates},
              "docker_config":{"present":configured is not None,"nonempty":bool(configured),"length":len(configured) if configured is not None else None,"trimmed_length":len(trimmed) if trimmed is not None else None,"raw_eq_trimmed":configured==trimmed if configured is not None else None},
              "exec_shell":inner["exec_shell"],
              "pid1_process":inner["pid1_process"],
              "comparisons":{"docker_config_eq_exec_shell":configured_hmac is not None and configured_hmac==shell_hmac,"exec_shell_eq_pid1":shell_hmac is not None and shell_hmac==pid_hmac},
              "secret_disclosed":False,
          }
          Path("security-evidence/token-chain.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          unset diag_key
      - name: Live public and admin boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"sa-03-3-acceptance","version":"1"}}}'
          public_status="$(curl -sS -o /tmp/mcp-public.out -w '%{http_code}' --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data "$init" "$STAGE_URL/mcp/")"
          missing_status="$(curl -sS -o /tmp/mcp-admin-missing.out -w '%{http_code}' --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data "$init" "$STAGE_URL/mcp-admin/")"
          wrong_status="$(curl -sS -o /tmp/mcp-admin-wrong.out -w '%{http_code}' --max-time 30 -H 'Authorization: Bearer deliberately-invalid-acceptance-token' -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data "$init" "$STAGE_URL/mcp-admin/")"
          [[ "$public_status" == "200" ]]
          [[ "$missing_status" == "401" ]]
          [[ "$wrong_status" == "401" ]]

          correct_status="$(docker exec "$CONTAINER" sh -c '
            token="$AIMETON_MCP_ADMIN_TOKEN"
            test -n "$token"
            python - "$token" <<'"'"'PY'"'"'
          import json, sys, urllib.request
          token=sys.argv[1]
          payload={"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"sa-03-3-internal","version":"1"}}}
          req=urllib.request.Request("http://127.0.0.1:5000/mcp-admin/",data=json.dumps(payload).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json, text/event-stream","Host":"stage-auditor.aimeton.ru"})
          try:
              with urllib.request.urlopen(req,timeout=30) as response:
                  print(response.status)
          except urllib.error.HTTPError as exc:
              print(exc.code)
          PY
          ')"
          python3 - "$public_status" "$missing_status" "$wrong_status" "$correct_status" <<'PY'
          import json, sys
          keys=("public_without_credentials","admin_missing_token","admin_wrong_token","admin_correct_token")
          print(json.dumps(dict(zip(keys,sys.argv[1:])),indent=2,sort_keys=True))
          open("security-evidence/live-boundary.json","w",encoding="utf-8").write(json.dumps(dict(zip(keys,sys.argv[1:])),indent=2,sort_keys=True)+"\n")
          PY
          [[ "$public_status" == "200" ]]
          [[ "$missing_status" == "401" ]]
          [[ "$wrong_status" == "401" ]]
          [[ "$correct_status" == "200" ]]

      - name: Verify sanitized audit
        shell: bash
        run: |
          set -Eeuo pipefail
          docker logs --since 10m "$CONTAINER" > /tmp/container.log 2>&1
          grep -F 'mcp_security ' /tmp/container.log > /tmp/mcp-security-audit.log
          token="$(docker exec "$CONTAINER" printenv AIMETON_MCP_ADMIN_TOKEN)"
          test -n "$token"
          if grep -Fq -- "$token" /tmp/mcp-security-audit.log; then
            echo "Admin token leaked into MCP security audit output" >&2
            exit 1
          fi
          if grep -Eqi 'deliberately-invalid-acceptance-token|jsonrpc|clientInfo|protocolVersion|Authorization:|127\.0\.0\.1|172\.[0-9]+\.' /tmp/mcp-security-audit.log; then
            echo "Request content or internal address leaked into MCP security audit output" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          lines=Path("/tmp/mcp-security-audit.log").read_text(errors="replace").splitlines()
          if not lines:
              raise SystemExit("No MCP security audit events captured")
          Path("security-evidence/audit-summary.json").write_text(json.dumps({"security_events":len(lines),"sanitized":True},indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-security-acceptance-${{ github.run_id }}
          path: security-evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Publish result to Issue 39
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOY_SHA: ${{ steps.deploy.outputs.sha }}
          ACCEPTANCE_RESULT: ${{ job.status }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              '## SA-03.3 MCP security acceptance',
              '',
              `- workflow run: ${context.runId}`,
              `- deploy SHA: ${process.env.DEPLOY_SHA || 'unavailable'}`,
              `- result: ${process.env.ACCEPTANCE_RESULT || 'unknown'}`,
              '- evidence: sanitized artifact; no tokens or request payloads',
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:39,body});
