name: Temporary Patch SearXNG Partial Degradation 441

on:
  push:
    branches:
      - fix/searxng-partial-degradation-441

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/searxng-partial-degradation-441
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply guarded diagnostics patch and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:180]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/search_gateway/models.py',
              '''    reason: FallbackReason | None = None\n    cost_amount: Decimal = Field(default=Decimal("0"), ge=0)\n''',
              '''    reason: FallbackReason | None = None\n    degraded_upstreams: list[str] = Field(default_factory=list, max_length=16)\n    cost_amount: Decimal = Field(default=Decimal("0"), ge=0)\n''',
          )

          replace_once(
              'app/search_gateway/providers.py',
              'from abc import ABC, abstractmethod\nfrom decimal import Decimal\n',
              'from abc import ABC, abstractmethod\nfrom dataclasses import dataclass\nfrom decimal import Decimal\n',
          )
          replace_once(
              'app/search_gateway/providers.py',
              '''class SearchProvider(ABC):\n''',
              '''@dataclass(frozen=True)\nclass ProviderDegradation:\n    reason: FallbackReason\n    upstreams: tuple[str, ...]\n\n\nclass SearchProvider(ABC):\n''',
          )
          replace_once(
              'app/search_gateway/providers.py',
              '''    @abstractmethod\n    async def search(\n        self,\n        request: SearchRequest,\n        *,\n        timeout_seconds: float,\n    ) -> list[SearchItem]: ...\n\n\nclass HttpSearchProvider(SearchProvider):\n''',
              '''    def consume_degradation(self, request: SearchRequest) -> ProviderDegradation | None:\n        return None\n\n    @abstractmethod\n    async def search(\n        self,\n        request: SearchRequest,\n        *,\n        timeout_seconds: float,\n    ) -> list[SearchItem]: ...\n\n\nclass HttpSearchProvider(SearchProvider):\n''',
          )
          replace_once(
              'app/search_gateway/providers.py',
              '''        self._engines = tuple(item.strip() for item in engines if item.strip())\n        self._engine_fanout = max(1, int(engine_fanout)) if engine_fanout is not None else None\n\n    @property\n''',
              '''        self._engines = tuple(item.strip() for item in engines if item.strip())\n        self._engine_fanout = max(1, int(engine_fanout)) if engine_fanout is not None else None\n        self._degradations: dict[int, ProviderDegradation] = {}\n\n    @property\n''',
          )
          replace_once(
              'app/search_gateway/providers.py',
              '''    async def search(self, request: SearchRequest, *, timeout_seconds: float) -> list[SearchItem]:\n        params: dict[str, str | int] = {\n''',
              '''    def consume_degradation(self, request: SearchRequest) -> ProviderDegradation | None:\n        return self._degradations.pop(id(request), None)\n\n    @staticmethod\n    def _classify_unresponsive(unresponsive: object) -> ProviderDegradation | None:\n        if not isinstance(unresponsive, list) or not unresponsive:\n            return None\n        failed_names: list[str] = []\n        failure_text: list[str] = []\n        for item in unresponsive[:16]:\n            if isinstance(item, (list, tuple)) and item:\n                name = str(item[0]).strip()\n                if name and name not in failed_names:\n                    failed_names.append(name)\n                failure_text.extend(str(part) for part in item[1:])\n            elif isinstance(item, str):\n                name = item.strip()\n                if name and name not in failed_names:\n                    failed_names.append(name)\n                failure_text.append(item)\n        diagnostic = " ".join(failure_text).casefold()\n        if "captcha" in diagnostic or "recaptcha" in diagnostic:\n            reason = FallbackReason.CAPTCHA\n        elif "too many" in diagnostic or "429" in diagnostic or "rate" in diagnostic:\n            reason = FallbackReason.RATE_LIMITED\n        elif "access denied" in diagnostic or "403" in diagnostic or "forbidden" in diagnostic:\n            reason = FallbackReason.PROVIDER_BLOCKED\n        elif "protocol" in diagnostic or "parse" in diagnostic:\n            reason = FallbackReason.PROTOCOL_ERROR\n        else:\n            reason = FallbackReason.PROVIDER_ERROR\n        return ProviderDegradation(reason=reason, upstreams=tuple(failed_names))\n\n    async def search(self, request: SearchRequest, *, timeout_seconds: float) -> list[SearchItem]:\n        self._degradations.pop(id(request), None)\n        params: dict[str, str | int] = {\n''',
          )
          old = '''        unresponsive = payload.get("unresponsive_engines") or []\n        if not results and isinstance(unresponsive, list) and unresponsive:\n            failed_names: list[str] = []\n            failure_text: list[str] = []\n            for item in unresponsive[:8]:\n                if isinstance(item, (list, tuple)) and item:\n                    failed_names.append(str(item[0]))\n                    failure_text.extend(str(part) for part in item[1:])\n                elif isinstance(item, str):\n                    failed_names.append(item)\n                    failure_text.append(item)\n            diagnostic = " ".join(failure_text).casefold()\n            if "captcha" in diagnostic or "recaptcha" in diagnostic:\n                reason = FallbackReason.CAPTCHA\n            elif "too many" in diagnostic or "429" in diagnostic or "rate" in diagnostic:\n                reason = FallbackReason.RATE_LIMITED\n            elif "access denied" in diagnostic or "403" in diagnostic or "forbidden" in diagnostic:\n                reason = FallbackReason.PROVIDER_BLOCKED\n            elif "protocol" in diagnostic or "parse" in diagnostic:\n                reason = FallbackReason.PROTOCOL_ERROR\n            else:\n                reason = FallbackReason.PROVIDER_ERROR\n            suffix = f" ({', '.join(failed_names)})" if failed_names else ""\n            raise ProviderError(\n                f"searxng upstream engines unavailable{suffix}",\n                retryable=reason is FallbackReason.PROVIDER_ERROR,\n                reason=reason,\n            )\n        return results\n'''
          new = '''        degradation = self._classify_unresponsive(payload.get("unresponsive_engines") or [])\n        if degradation is not None:\n            if results:\n                self._degradations[id(request)] = degradation\n            else:\n                suffix = f" ({', '.join(degradation.upstreams)})" if degradation.upstreams else ""\n                raise ProviderError(\n                    f"searxng upstream engines unavailable{suffix}",\n                    retryable=degradation.reason is FallbackReason.PROVIDER_ERROR,\n                    reason=degradation.reason,\n                )\n        return results\n'''
          replace_once('app/search_gateway/providers.py', old, new)

          replace_once(
              'app/search_gateway/scheduler.py',
              'from app.search_gateway.providers import SearchProvider\n',
              'from app.search_gateway.providers import ProviderDegradation, SearchProvider\n',
          )
          replace_once(
              'app/search_gateway/scheduler.py',
              '''    async def search(\n        self,\n        request: SearchRequest,\n''',
              '''    def consume_degradation(self, request: SearchRequest) -> ProviderDegradation | None:\n        return self._provider.consume_degradation(request)\n\n    async def search(\n        self,\n        request: SearchRequest,\n''',
          )

          replace_once(
              'app/search_gateway/gateway.py',
              '''        error_reason: FallbackReason | None = None\n        results: list[SearchItem] = []\n        calls_made = 0\n''',
              '''        error_reason: FallbackReason | None = None\n        degradation = None\n        results: list[SearchItem] = []\n        calls_made = 0\n''',
          )
          replace_once(
              'app/search_gateway/gateway.py',
              '''                results = await provider.search(request, timeout_seconds=policy.timeout_seconds)\n                error_reason = None\n                break\n''',
              '''                results = await provider.search(request, timeout_seconds=policy.timeout_seconds)\n                degradation = provider.consume_degradation(request)\n                error_reason = None\n                break\n''',
          )
          replace_once(
              'app/search_gateway/gateway.py',
              '''                reason=None if results else FallbackReason.EMPTY_RESULTS,\n                cost_amount=charged,\n''',
              '''                reason=(\n                    degradation.reason\n                    if degradation is not None\n                    else (None if results else FallbackReason.EMPTY_RESULTS)\n                ),\n                degraded_upstreams=list(degradation.upstreams) if degradation is not None else [],\n                cost_amount=charged,\n''',
          )
          replace_once(
              'app/search_gateway/gateway.py',
              '''        if not has_results or any(attempt.state == AttemptState.FAILED for attempt in attempts):\n            return GatewayState.DEGRADED\n        return GatewayState.SUCCESS\n''',
              '''        if (\n            not has_results\n            or any(attempt.state == AttemptState.FAILED for attempt in attempts)\n            or any(attempt.degraded_upstreams for attempt in attempts)\n        ):\n            return GatewayState.DEGRADED\n        return GatewayState.SUCCESS\n''',
          )
          replace_once(
              'app/search_gateway/gateway.py',
              '''        return SearchResponse(\n            results=results,\n            diagnostics=SearchDiagnostics(\n                state=state or self._diagnostic_state(attempts, has_results=bool(results)),\n''',
              '''        diagnostic_state = self._diagnostic_state(attempts, has_results=bool(results))\n        effective_state = state or diagnostic_state\n        if state is GatewayState.SUCCESS and diagnostic_state is not GatewayState.SUCCESS:\n            effective_state = diagnostic_state\n        return SearchResponse(\n            results=results,\n            diagnostics=SearchDiagnostics(\n                state=effective_state,\n''',
          )

          replace_once(
              'app/search_gateway/trace_projection.py',
              '''                "reason": attempt.reason.value if attempt.reason else None,\n                "latency_ms": attempt.latency_ms,\n''',
              '''                "reason": attempt.reason.value if attempt.reason else None,\n                "degraded_upstreams": list(attempt.degraded_upstreams),\n                "latency_ms": attempt.latency_ms,\n''',
          )
          replace_once(
              'app/search_gateway/trace_bridge.py',
              '''    if state == AttemptState.SUCCEEDED.value and results_received > 0:\n        return "results_received"\n''',
              '''    if state == AttemptState.SUCCEEDED.value and results_received > 0:\n        if row.get("degraded_upstreams"):\n            return f"partial_{row.get('reason') or 'upstream_degraded'}"\n        return "results_received"\n''',
          )
          replace_once(
              'app/search_gateway/trace_bridge.py',
              '''        final_state = _STATE_MAP[row["state"]]\n        reason_code = _terminal_reason(row)\n        common_metadata = {\n''',
              '''        final_state = _STATE_MAP[row["state"]]\n        if row.get("degraded_upstreams") and row["state"] == AttemptState.SUCCEEDED.value:\n            final_state = TraceState.DEGRADED\n        reason_code = _terminal_reason(row)\n        common_metadata = {\n''',
          )
          replace_once(
              'app/search_gateway/trace_bridge.py',
              '''            "cost_currency": row["cost"]["currency"],\n        }\n''',
              '''            "cost_currency": row["cost"]["currency"],\n            "degraded_upstreams": row.get("degraded_upstreams", []),\n            "partial_degradation_reason": row.get("reason") if row.get("degraded_upstreams") else None,\n        }\n''',
          )
          PY

          python scripts/export_identity_evidence_schemas.py
          python -m py_compile \
            app/search_gateway/models.py \
            app/search_gateway/providers.py \
            app/search_gateway/scheduler.py \
            app/search_gateway/gateway.py \
            app/search_gateway/trace_projection.py \
            app/search_gateway/trace_bridge.py \
            tests/test_searxng_partial_degradation.py
          pytest -q \
            tests/test_searxng_partial_degradation.py \
            tests/test_searxng_resilience.py \
            tests/test_search_provider_gateway.py \
            tests/test_search_scheduler.py \
            tests/test_search_trace_bridge.py \
            tests/test_search_trace_projection.py \
            tests/test_identity_evidence.py

          git config user.name 'AIMETON Search Hardening'
          git config user.email '127470701+Dimar4713@users.noreply.github.com'
          git add \
            app/search_gateway/models.py \
            app/search_gateway/providers.py \
            app/search_gateway/scheduler.py \
            app/search_gateway/gateway.py \
            app/search_gateway/trace_projection.py \
            app/search_gateway/trace_bridge.py \
            schemas/identity-search-v0.1.schema.json \
            schemas/identity-evidence-v0.1.schema.json
          git commit -m 'Expose partial SearXNG engine degradation [partial-degradation-patched]'
          git push origin HEAD:fix/searxng-partial-degradation-441
