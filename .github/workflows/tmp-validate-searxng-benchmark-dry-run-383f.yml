name: Temporary Validate SearXNG Benchmark Dry Run 383F

on:
  push:
    branches:
      - diag/validate-searxng-benchmark-dry-run-383f

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate permanent benchmark zero-call plan
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/benchmark_searxng_concurrency.py --output /tmp/plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/plan.json').read_text(encoding='utf-8'))
          assert plan['mode'] == 'dry_run'
          assert plan['matrix'] == [1, 2, 3, 6]
          assert plan['query_count_per_concurrency'] == 6
          assert plan['planned_searxng_calls'] == 24
          assert plan['engine_fanout'] == 2
          assert plan['planned_upstream_engine_invocations_ceiling'] == 48
          assert plan['external_provider_calls'] == 0
          assert plan['live_calls_authorized'] is False
          assert 'precision_proxy' in plan['metrics']
          print(json.dumps({
              'matrix': plan['matrix'],
              'planned_searxng_calls': plan['planned_searxng_calls'],
              'planned_upstream_engine_invocations_ceiling': plan['planned_upstream_engine_invocations_ceiling'],
              'external_provider_calls': plan['external_provider_calls'],
              'live_calls_authorized': plan['live_calls_authorized'],
              'validation': 'ok',
          }, sort_keys=True))
          PY
