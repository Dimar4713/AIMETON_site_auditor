name: Temporary Hunter Lead Fit Stage Replay

on:
  push:
    branches:
      - diag/hunter-lead-fit-stage-replay

permissions:
  contents: read
  issues: write

jobs:
  replay:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EXPECTED_SHA: 5a1d5143c4d004018bfef37ac066f81dcdb685a6
      REPORT: /tmp/hunter-lead-fit-stage-replay-${{ github.run_id }}.md
    steps:
      - name: Checkout diagnostic harness only
        uses: actions/checkout@v4
        with:
          ref: diag/hunter-lead-fit-stage-replay
          fetch-depth: 1

      - name: Verify exact deployed SHA and healthy Stage
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$EXPECTED_SHA" ]]
          [[ "$status" == healthy ]]
          echo "deployed_sha=$deployed"
          echo "container_status=$status"

      - name: Replay saved honest E2E through deployed lead-fit classifier
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER" python - < scripts/diag_hunter_lead_fit_replay.py | tee "$REPORT"
          grep -Fq 'provider calls during replay: `0`' "$REPORT"
          grep -Fq '✅ Saved real Stage E2E candidates replay successfully' "$REPORT"

      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: hunter-lead-fit-stage-replay-${{ github.run_id }}
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence to P1-519
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ env.REPORT }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 519,
              body: report.slice(0, 60000),
            });
