name: Reconcile Search Observer Steering Enabled Zero Cost Stage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-search-observer-steering-enabled-zero-cost-stage.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: search-observer-steering-enabled-zero-cost-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 15
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: Wait for exact deployed SHA and healthy runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$STACK_DIR"
          deadline=$((SECONDS + 600))
          observed_sha='missing'
          status='missing'
          while (( SECONDS < deadline )); do
            [[ -f app-source-sha.txt ]] && observed_sha="$(tr -d '[:space:]' < app-source-sha.txt)" || observed_sha='missing'
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER" 2>/dev/null || true)"
            if [[ "$observed_sha" == "$EXPECTED_SHA" && ( "$status" == healthy || "$status" == running ) ]]; then
              echo "validated_sha=$EXPECTED_SHA"
              echo "container_status=$status"
              exit 0
            fi
            echo "waiting_for_exact_stage expected=$EXPECTED_SHA observed=$observed_sha status=${status:-missing}"
            sleep 5
          done
          echo "exact Stage SHA did not converge" >&2
          echo "expected=$EXPECTED_SHA observed=$observed_sha status=${status:-missing}" >&2
          exit 1

      - name: Prove production steering remains disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          value="$(docker inspect "$CONTAINER" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="HUNTER_SEARCH_OBSERVER_STEERING_ENABLED" {print $2}' | tail -n1)"
          normalized="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
          case "$normalized" in
            1|true|yes|on)
              echo 'production steering gate is unexpectedly enabled' >&2
              exit 1
              ;;
          esac
          echo 'production_steering_gate=disabled'

      - name: Prove OFF then process-local enabled steering with fakes only
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i \
            -w /app \
            -e PYTHONPATH=/app \
            -e AIMETON_RUNTIME_DB=/tmp/search-observer-steering-reconcile.sqlite3 \
            -e HUNTER_SEARCH_OBSERVER_SHADOW_ENABLED=false \
            "$CONTAINER" python - <<'PY'
          import asyncio
          import os
          from app import discovery
          from app.hunter_search_policy_authority import HunterSearchPolicyAuthority, ResolvedHunterSearchPolicy
          from app.models import HuntRequest
          from app.search_gateway.models import GatewayState, SearchDiagnostics, SearchPolicy, SearchResponse
          from app.search_observer_llm import DirectionRecommendation, ObserverAction, SearchObserverRecommendation

          queries = [
              "стоматология красноярск официальный сайт",
              "металлообработка красноярск завод",
              "металлообработка завод красноярск оборудование",
              "стоматология клиника красноярск",
          ]
          events = []

          class FakeGateway:
              async def search(self, request, _policy):
                  events.append(f"search:{request.query}")
                  return SearchResponse(
                      results=[],
                      diagnostics=SearchDiagnostics(
                          state=GatewayState.SUCCESS,
                          selected_provider="offline-fake",
                      ),
                  )

          async def no_llm_plan(**_kwargs):
              return None

          discovery.generate_hunter_query_plan = no_llm_plan
          discovery._build_queries = lambda _req: list(queries)
          discovery.get_search_gateway = lambda: FakeGateway()
          discovery.resolve_hunter_search_policy = lambda: ResolvedHunterSearchPolicy(
              policy=SearchPolicy(),
              authority=HunterSearchPolicyAuthority.ADMIN,
              selected_policy_fingerprint="sha256:offline-admin",
              env_policy_fingerprint="sha256:offline-env",
              admin_projection_fingerprint="sha256:offline-admin",
              policy_equivalent=False,
              admin_policy_persisted=True,
          )

          def request():
              return HuntRequest(
                  region="Красноярск",
                  industries=["Стоматология"],
                  max_queries=4,
                  results_per_query=1,
                  max_candidates=10,
                  output_limit=10,
                  concurrency=1,
              )

          async def main():
              os.environ["HUNTER_SEARCH_OBSERVER_STEERING_ENABLED"] = "false"
              os.environ["HUNTER_SEARCH_OBSERVER_STEERING_REGIME"] = "auto"
              os.environ["HUNTER_SEARCH_OBSERVER_RESERVE_QUERIES"] = "2"

              async def forbidden_observer(_telemetry):
                  raise AssertionError("OFF path must not invoke Search Observer")

              discovery.evaluate_search_wave_shadow = forbidden_observer
              off = await discovery.run_hunt(request())
              assert events == [f"search:{q}" for q in queries], events
              assert off.queries == queries
              print("off_path=passed")
              print("off_observer_calls=0")

              events.clear()
              os.environ["HUNTER_SEARCH_OBSERVER_STEERING_ENABLED"] = "true"
              os.environ["HUNTER_SEARCH_OBSERVER_STEERING_REGIME"] = "balanced"

              async def observer(_telemetry):
                  events.append("observer")
                  return SearchObserverRecommendation(
                      sufficient_evidence=True,
                      recommendations=[
                          DirectionRecommendation(
                              direction_index=0,
                              action=ObserverAction.CONTINUE,
                              confidence=0.9,
                              rationale="productive continuation",
                          )
                      ],
                      summary="continue productive direction",
                  )

              discovery.evaluate_search_wave_shadow = observer
              enabled = await discovery.run_hunt(request())
              assert events[:2] == [f"search:{queries[0]}", f"search:{queries[1]}"]
              assert events[2] == "observer"
              searched = [e.removeprefix("search:") for e in events if e.startswith("search:")]
              assert searched == [queries[0], queries[1], queries[3], queries[2]], searched
              assert len(searched) == len(queries)
              assert set(searched) == set(queries)
              assert len(set(searched)) == len(queries)
              assert enabled.queries == searched
              print("enabled_path=passed")
              print("enabled_observer_calls=1_fake_only")
              print("reserve_reordered=true")
              print("all_original_queries_once=true")
              print("query_budget_increase=0")
              print("external_provider_calls=0")
              print("external_llm_calls=0")
              print("paid_calls=0")

          asyncio.run(main())
          PY

      - name: Remove synthetic reconciliation state
        if: always()
        shell: bash
        run: |
          docker exec "$CONTAINER" sh -lc 'rm -f /tmp/search-observer-steering-reconcile.sqlite3 /tmp/search-observer-steering-reconcile.sqlite3-wal /tmp/search-observer-steering-reconcile.sqlite3-shm'

      - name: Publish terminal evidence to issue 753
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const status = process.env.JOB_STATUS || 'unknown';
            const passed = status === 'success';
            const body = [
              '## Search Observer OFF → enabled zero-cost Stage reconciliation',
              '',
              `- exact SHA: \`${context.sha}\``,
              `- workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- terminal job status: ${status}`,
              '- production steering gate: **disabled**',
              '- OFF deployed `run_hunt`: **fake-only, Observer forbidden**',
              '- enabled canary: **process-local only, balanced regime**',
              '- enabled Observer: **1 fake call**',
              '- external provider/search calls: **0 by construction**',
              '- external LLM calls: **0 by construction**',
              '- paid calls: **0**',
              '- total query budget increase: **0**',
              '',
              `### Verdict\n${passed ? '✅ OFF → enabled zero-cost Stage reconciliation passed.' : '❌ OFF → enabled zero-cost Stage reconciliation did not pass.'}`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 753,
              body,
            });
