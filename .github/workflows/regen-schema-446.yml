name: Regen Schema 446

on:
  push:
    branches:
      - feat/search-typed-upstream-failures-441
    paths:
      - .github/workflows/regen-schema-446.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-typed-upstream-failures-441
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Regenerate canonical schemas and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/export_identity_evidence_schemas.py
          git rm .github/workflows/regen-schema-446.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/identity-search-v0.1.schema.json schemas/identity-evidence-v0.1.schema.json
          git commit -m "chore(schema): regenerate typed search diagnostics"
          git push origin HEAD:feat/search-typed-upstream-failures-441
