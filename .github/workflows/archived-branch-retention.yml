name: Archived Branch Retention

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "review or apply"
        required: true
        default: review
        type: choice
        options:
          - review
          - apply
      quarantine_days:
        description: "Minimum quarantine in days"
        required: true
        default: "30"
      confirmation:
        description: "Exact DELETE ARCHIVED BRANCHES <digest> for apply"
        required: false
        default: ""
      issue_number:
        description: "Issue receiving evidence"
        required: false
        default: "151"

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  LEDGER_PATH: docs/governance/branch-archive-ledger.json
  PLAN_PATH: artifacts/archived-branch-plan.json
  RESULT_PATH: artifacts/archived-branch-result.json

jobs:
  review:
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' && 'branch-governance' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "mode=review" >> "$GITHUB_OUTPUT"
            echo "quarantine_days=30" >> "$GITHUB_OUTPUT"
            echo "confirmation=" >> "$GITHUB_OUTPUT"
            echo "issue_number=151" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "quarantine_days=${{ inputs.quarantine_days }}" >> "$GITHUB_OUTPUT"
            echo "confirmation=${{ inputs.confirmation }}" >> "$GITHUB_OUTPUT"
            echo "issue_number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate apply boundary
        if: steps.inputs.outputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == "refs/heads/main" ]] || {
            echo "Apply is allowed only from main" >&2
            exit 1
          }

      - name: Collect open PR heads
        id: prs
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            core.setOutput('heads', JSON.stringify(pulls.map(pr => pr.head.ref)));

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Review or apply retention plan
        id: retention
        shell: bash
        env:
          OPEN_PR_HEADS: ${{ steps.prs.outputs.heads }}
          MODE: ${{ steps.inputs.outputs.mode }}
          QUARANTINE_DAYS: ${{ steps.inputs.outputs.quarantine_days }}
          CONFIRMATION: ${{ steps.inputs.outputs.confirmation }}
        run: |
          set -euo pipefail
          python scripts/archived_branch_retention.py \
            --mode "$MODE" \
            --quarantine-days "$QUARANTINE_DAYS" \
            --open-pr-heads-json "$OPEN_PR_HEADS" \
            --confirmation "$CONFIRMATION"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("artifacts/archived-branch-plan.json", encoding="utf-8"))
          print(f"candidate_count={p['candidate_count']}")
          print(f"manifest_digest={p['manifest_digest']}")
          PY

      - name: Persist first-seen ledger
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$LEDGER_PATH"; then
            echo "Ledger unchanged"
            exit 0
          fi
          git add "$LEDGER_PATH"
          git commit -m "chore(governance): update archived branch ledger"
          git push origin HEAD:main

      - name: Upload retention evidence
        uses: actions/upload-artifact@v4
        with:
          name: archived-branch-retention-${{ github.run_id }}
          path: |
            ${{ env.LEDGER_PATH }}
            ${{ env.PLAN_PATH }}
            ${{ env.RESULT_PATH }}
          retention-days: 90

      - name: Publish evidence to issue
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.inputs.outputs.issue_number }}
          MODE: ${{ steps.inputs.outputs.mode }}
          CANDIDATE_COUNT: ${{ steps.retention.outputs.candidate_count }}
          MANIFEST_DIGEST: ${{ steps.retention.outputs.manifest_digest }}
        with:
          script: |
            const issue = Number(process.env.ISSUE_NUMBER || 151);
            const body = [
              '## Archived Branch Retention evidence',
              '',
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- mode: \`${process.env.MODE}\``,
              `- status: \`${{ toJSON(job.status) }}\``,
              `- candidates: \`${process.env.CANDIDATE_COUNT || 'unknown'}\``,
              `- manifest digest: \`${process.env.MANIFEST_DIGEST || 'unavailable'}\``,
              '',
              process.env.MODE === 'review' && process.env.MANIFEST_DIGEST
                ? `Apply requires exact confirmation: \`DELETE ARCHIVED BRANCHES ${process.env.MANIFEST_DIGEST}\``
                : 'See workflow artifact for the complete manifest and read-back result.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body,
            });
