name: Open Regime Calibration PR

on:
  push:
    branches:
      - feat/search-regime-calibration-segmentation

permissions:
  contents: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open pull request
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! gh pr view --head "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf '%s\n' '## Summary' '- segment offline Observer hindsight by effective search regime' '' '## Acceptance criteria affected' '- offline evidence is segmented by effective regime' '- incomplete discovery utility remains explicit' '- no provider/search/LLM calls are required' '- no active steering or premium escalation is enabled' '' '## Safety' 'Read-only/offline calibration only; no SearchGateway execution or steering changes.' '' 'Part of #612 and #587.' > /tmp/pr-body.md
            gh pr create --base main --head "$GITHUB_REF_NAME" --title "Segment Search Observer calibration by effective regime" --body-file /tmp/pr-body.md
          fi
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/open-regime-calibration-pr.yml
          git config user.name "AIMETON Agent"
          git config user.email "127470701+Dimar4713@users.noreply.github.com"
          git add .github/workflows/open-regime-calibration-pr.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot PR workflow"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
