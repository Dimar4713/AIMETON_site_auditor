name: RouterAI Input Metrics Observe

on:
  push:
    branches:
      - ops/routerai-input-observe-20260816
    paths:
      - .github/workflows/routerai-input-observe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 3
    steps:
      - name: Read allowlisted split-synthesis failure metadata from live Runtime Core
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i aimeton-auditor python - <<'PY'
          import json
          import sqlite3

          mission_id = "mission_346568fc2b114073825af07fd3740306"
          db = sqlite3.connect("/app/data/runtime-core.sqlite3")
          row = db.execute(
              """
              SELECT mission_id, attempt_id, operation, state, reason_code,
                     duration_ms, metadata_json, created_at
              FROM mission_trace_events
              WHERE mission_id = ?
                AND operation IN ('llm_finished', 'llm_timeout')
              ORDER BY created_at DESC
              LIMIT 1
              """,
              (mission_id,),
          ).fetchone()
          if row is None:
              raise SystemExit("llm_terminal_trace_not_found")
          metadata = json.loads(row[6])
          allowed = [
              "model",
              "budget_seconds",
              "synthesis_mode",
              "failed_phase",
              "phase_error_type",
              "error_type",
              "official_text_chars",
              "external_context_chars",
              "external_source_count",
              "schema_chars",
              "dynamic_input_chars",
          ]
          metrics = {key: metadata.get(key) for key in allowed}
          print(json.dumps({
              "mission_id": row[0],
              "operation": row[2],
              "state": row[3],
              "reason_code": row[4],
              "duration_ms": row[5],
              "created_at": row[7],
              "metadata": metrics,
          }, ensure_ascii=False, sort_keys=True))
          PY
