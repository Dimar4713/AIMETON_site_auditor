name: Temporary Search Runtime Pressure Audit 441

on:
  push:
    branches:
      - diag/search-runtime-pressure-441

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 5
    steps:
      - name: Inspect non-secret search runtime without provider calls
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i aimeton-auditor python - <<'PY'
          import json
          import os
          from app.search_gateway.factory import DEFAULT_SEARXNG_ENGINES

          keys = (
              'SEARXNG_ENGINES',
              'SEARCH_CONCURRENCY_SEARXNG',
              'SEARCH_JITTER_SEARXNG_MIN_SECONDS',
              'SEARCH_JITTER_SEARXNG_MAX_SECONDS',
              'SEARCH_CACHE_DB_PATH',
              'SEARCH_CACHE_TTL_SECONDS',
              'SEARCH_CACHE_MAX_ENTRIES',
          )
          raw = {key: os.getenv(key) for key in keys}
          engines = tuple(
              item.strip()
              for item in (raw['SEARXNG_ENGINES'] or ','.join(DEFAULT_SEARXNG_ENGINES)).split(',')
              if item.strip()
          )
          safe = {
              'searxng_engines': engines,
              'searxng_engine_count': len(engines),
              'searxng_concurrency_env': raw['SEARCH_CONCURRENCY_SEARXNG'],
              'searxng_jitter_min_env': raw['SEARCH_JITTER_SEARXNG_MIN_SECONDS'],
              'searxng_jitter_max_env': raw['SEARCH_JITTER_SEARXNG_MAX_SECONDS'],
              'cache_db_configured': bool((raw['SEARCH_CACHE_DB_PATH'] or '').strip()),
              'cache_db_path': (raw['SEARCH_CACHE_DB_PATH'] or '').strip() or None,
              'cache_ttl_env': raw['SEARCH_CACHE_TTL_SECONDS'],
              'cache_max_entries_env': raw['SEARCH_CACHE_MAX_ENTRIES'],
              'provider_calls': 0,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY
