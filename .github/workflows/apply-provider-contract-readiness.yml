name: Apply Provider Contract Readiness Patch

on:
  push:
    branches:
      - feat/provider-contract-readiness
    paths:
      - .github/workflows/apply-provider-contract-readiness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-contract-readiness
          fetch-depth: 0
      - name: Apply exact gateway and test patches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/search_gateway/gateway.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''            provider = self._providers.get(name)\n            if provider is None or not provider.configured:\n                continue\n            if self._circuit_state(name) == "open":\n''',
                  '''            provider = self._providers.get(name)\n            if provider is None or not provider.configured:\n                continue\n            if not provider.execution_allowed:\n                continue\n            if self._circuit_state(name) == "open":\n''',
              ),
              (
                  '''        provider = self._providers.get(provider_name)\n        policy_blocked = policy.allowed_providers is not None and provider_name not in policy.allowed_providers\n        if provider is None or policy_blocked or not provider.configured:\n            reason = FallbackReason.POLICY_BLOCKED if policy_blocked else FallbackReason.NOT_CONFIGURED\n            return _Execution(\n''',
                  '''        provider = self._providers.get(provider_name)\n        policy_blocked = policy.allowed_providers is not None and provider_name not in policy.allowed_providers\n        if provider is None or policy_blocked or not provider.configured or not provider.execution_allowed:\n            if policy_blocked:\n                reason = FallbackReason.POLICY_BLOCKED\n            elif provider is not None and provider.configured and not provider.execution_allowed:\n                reason = provider.execution_block_reason or FallbackReason.POLICY_BLOCKED\n            else:\n                reason = FallbackReason.NOT_CONFIGURED\n            return _Execution(\n''',
              ),
              (
                  '''            if policy_blocked:\n                state = ProviderReadiness.POLICY_BLOCKED\n            elif not provider.configured:\n                state = ProviderReadiness.NOT_CONFIGURED\n            elif circuit_state == "open":\n''',
                  '''            if policy_blocked:\n                state = ProviderReadiness.POLICY_BLOCKED\n            elif not provider.configured:\n                state = ProviderReadiness.NOT_CONFIGURED\n            elif not provider.execution_allowed:\n                state = (\n                    ProviderReadiness.CONTRACT_BLOCKED\n                    if provider.execution_block_reason == FallbackReason.CONTRACT_BLOCKED\n                    else ProviderReadiness.POLICY_BLOCKED\n                )\n            elif circuit_state == "open":\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'gateway patch cardinality error: expected 1, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_tavily_provider_egress.py')
          t = test.read_text(encoding='utf-8')
          t = t.replace(
              'from app.search_gateway.models import AttemptState, FallbackReason, SearchPolicy, SearchRequest\n',
              'from app.search_gateway.models import AttemptState, FallbackReason, ProviderReadiness, SearchPolicy, SearchRequest\n',
          )
          old = '''    assert provider.technical_configured is True\n    assert provider.contract_allowed is False\n    assert provider.configured is False\n\n    response = await gateway.search(\n'''
          new = '''    assert provider.technical_configured is True\n    assert provider.contract_allowed is False\n    assert provider.configured is True\n    assert provider.execution_allowed is False\n\n    health = gateway.health(\n        SearchPolicy(\n            provider_order=("tavily",),\n            allowed_providers=frozenset({"tavily"}),\n            max_cost_by_currency={"USD": Decimal("100")},\n        )\n    )\n    assert health[0].state == ProviderReadiness.CONTRACT_BLOCKED\n    assert health[0].configured is True\n    assert health[0].ready is False\n\n    response = await gateway.search(\n'''
          if t.count(old) != 1:
              raise SystemExit('test configured block not found exactly once')
          t = t.replace(old, new, 1)
          t = t.replace(
              'assert response.diagnostics.attempts[0].reason == FallbackReason.NOT_CONFIGURED',
              'assert response.diagnostics.attempts[0].reason == FallbackReason.CONTRACT_BLOCKED',
          )
          t = t.replace(
              'assert exc_info.value.reason == FallbackReason.POLICY_BLOCKED',
              'assert exc_info.value.reason == FallbackReason.CONTRACT_BLOCKED',
          )
          test.write_text(t, encoding='utf-8')
          PY
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/apply-provider-contract-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/search_gateway/gateway.py tests/test_tavily_provider_egress.py .github/workflows/apply-provider-contract-readiness.yml
          git commit -m 'Expose contract-blocked provider readiness in SearchGateway'
          git push origin HEAD:feat/provider-contract-readiness
