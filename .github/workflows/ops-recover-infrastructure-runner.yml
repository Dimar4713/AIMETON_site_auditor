name: Ops Recover Infrastructure Runner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-recover-infrastructure-runner.yml'

permissions:
  contents: read

jobs:
  verify-listener:
    if: github.actor == 'Dimar4713'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Verify infrastructure runner listener after recovery
        shell: bash
        run: |
          set -euo pipefail
          unit='actions.runner.Dimar4713-aimeton-infrastructure.aimeton-main-server.service'
          systemctl is-active --quiet "$unit"
          pid="$(systemctl show -p MainPID --value "$unit")"
          test -n "$pid"
          test "$pid" != '0'
          recent="$(sudo journalctl -u "$unit" --since '5 minutes ago' --no-pager -o cat | grep -E 'Connected to GitHub|Listening for Jobs|Runner connect error|Runner listener exit|Runner listener started' || true)"
          printf 'infrastructure_runner_service=active\nmain_pid=%s\n' "$pid"
          printf '%s\n' "$recent"
          printf '%s\n' "$recent" | grep -q 'Connected to GitHub'
          printf '%s\n' "$recent" | grep -q 'Listening for Jobs'
          echo 'infrastructure_runner_listener=connected-and-listening'
