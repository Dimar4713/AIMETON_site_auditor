name: Patch Auto Regime Runtime

on:
  push:
    branches: [feat/search-regime-auto-runtime-metadata]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          main = Path('app/main.py')
          text = main.read_text(encoding='utf-8')
          marker = 'from app.search_gateway import get_search_gateway, search_policy_from_env\n'
          if 'from app.search_regime_shadow import resolve_auto_search_regime\n' not in text:
              assert marker in text
              text = text.replace(marker, marker + 'from app.search_regime_shadow import resolve_auto_search_regime\n', 1)
          old = '''    payload["search_regime"] = {
              "requested": requested_regime,
              "effective": "balanced" if requested_regime == "auto" else requested_regime,
              "reason": "auto_balanced_default" if requested_regime == "auto" else "user_override",
              "routing_changed": False,
              "steering_enabled": False,
          }
'''
          new = '''    if requested_regime == "auto":
              funnel = payload.get("funnel")
              if isinstance(funnel, dict):
                  decision = resolve_auto_search_regime(
                      raw_results=int(funnel.get("raw_results") or 0),
                      unique_candidates=int(funnel.get("unique_candidates") or 0),
                      qualified_candidates=int(funnel.get("qualified_candidates") or 0),
                      duplicate_results=int(funnel.get("duplicate_results") or 0),
                      excluded_results=int(funnel.get("excluded_results") or 0),
                  )
                  effective_regime = decision.effective
                  regime_reason = decision.reason
              else:
                  effective_regime = "balanced"
                  regime_reason = "auto_balanced_default"
          else:
              effective_regime = requested_regime
              regime_reason = "user_override"
          payload["search_regime"] = {
              "requested": requested_regime,
              "effective": effective_regime,
              "reason": regime_reason,
              "routing_changed": False,
              "steering_enabled": False,
          }
'''
          assert old in text
          main.write_text(text.replace(old, new, 1), encoding='utf-8')
          tests = Path('tests/test_search_regime_shadow_api.py')
          test_text = tests.read_text(encoding='utf-8')
          addition = '''\n\n@pytest.mark.asyncio\nasync def test_hunt_search_regime_auto_uses_observed_sparse_funnel(monkeypatch):\n    async def sparse_run_hunt(_request):\n        return {\n            "region": "Красноярск", "candidates": [], "discovered": 2,\n            "funnel": {"raw_results": 3, "unique_candidates": 2, "qualified_candidates": 1, "duplicate_results": 0, "excluded_results": 0},\n        }\n    monkeypatch.setattr(main, "run_hunt", sparse_run_hunt)\n    result = await main.hunt(HuntRequest(region="Красноярск", industries=[]), _request())\n    metadata = result["search_regime"]\n    assert metadata["requested"] == "auto"\n    assert metadata["effective"] == "discovery"\n    assert metadata["reason"] == "rarity_or_sparsity"\n    assert metadata["routing_changed"] is False\n    assert metadata["steering_enabled"] is False\n'''
          if 'test_hunt_search_regime_auto_uses_observed_sparse_funnel' not in test_text:
              tests.write_text(test_text.rstrip() + addition + '\n', encoding='utf-8')
          PY
          rm -f .github/workflows/patch-auto-regime-runtime.yml
          git config user.name "AIMETON Agent"
          git config user.email "127470701+Dimar4713@users.noreply.github.com"
          git add app/main.py tests/test_search_regime_shadow_api.py .github/workflows/patch-auto-regime-runtime.yml
          git diff --cached --check
          git commit -m "feat: expose observed auto search regime metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
