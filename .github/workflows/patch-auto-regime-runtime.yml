name: Patch Auto Regime Runtime

on:
  push:
    branches:
      - feat/search-regime-auto-runtime-metadata

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch_auto_regime_runtime.py
      - name: Commit clean result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/patch-auto-regime-runtime.yml scripts/patch_auto_regime_runtime.py
          git config user.name "AIMETON Agent"
          git config user.email "127470701+Dimar4713@users.noreply.github.com"
          git add app/main.py tests/test_search_regime_shadow_api.py .github/workflows/patch-auto-regime-runtime.yml scripts/patch_auto_regime_runtime.py
          git diff --cached --check
          git commit -m "feat: expose observed auto search regime metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
