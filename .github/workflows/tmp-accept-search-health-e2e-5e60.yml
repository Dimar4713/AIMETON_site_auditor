name: Temporary Accept Search Health And Dispatch Hunter E2E 5E60

on:
  push:
    branches:
      - diag/accept-search-health-e2e-5e60
    paths:
      - .github/workflows/tmp-accept-search-health-e2e-5e60.yml

permissions:
  actions: write
  contents: read

jobs:
  accept-and-dispatch:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EXPECTED_SHA: 5e60c32b4f01021e627762bae9220174eaafdf1a

    steps:
      - name: Verify exact deployed SHA and healthy Stage
        shell: bash
        run: |
          set -Eeuo pipefail
          deployed="$(cat "$STACK_DIR/app-source-sha.txt")"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$EXPECTED_SHA" ]]
          [[ "$status" == "healthy" ]]

      - name: Inspect zero-call SearXNG health
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER" python - <<'PY'
          import json
          import httpx

          r = httpx.get('http://127.0.0.1:5000/api/search/health', timeout=30.0)
          r.raise_for_status()
          data = r.json()
          providers = data.get('providers') or []
          sx = next((row for row in providers if row.get('provider') == 'searxng'), None)
          assert sx is not None, data
          sched = sx.get('scheduling') or {}
          assert int(sched.get('max_concurrency', -1)) == 1, sched
          assert float(sched.get('jitter_min_seconds', -1)) == 0.2, sched
          assert float(sched.get('jitter_max_seconds', -1)) == 0.8, sched
          safe = {
              'health_status': data.get('status'),
              'searxng_state': sx.get('state'),
              'ready': sx.get('ready'),
              'reason': sx.get('reason'),
              'scheduling': sched,
              'upstream_cooldowns': sx.get('upstream_cooldowns'),
              'upstream_telemetry': sx.get('upstream_telemetry'),
              'provider_calls': 0,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY

      - name: Dispatch permanent owner-authorized Hunter real E2E
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.EXPECTED_SHA;
            const main = await github.rest.repos.getBranch({owner: context.repo.owner, repo: context.repo.repo, branch: 'main'});
            if (main.data.commit.sha !== sha) {
              core.setFailed(`main moved: expected ${sha}, actual ${main.data.commit.sha}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'accept-hunter-real-e2e-stage.yml',
              ref: 'main',
              inputs: {
                expected_sha: sha,
                region: 'Красноярск',
                industry: 'Стоматология',
                expected_providers: 'searxng,yandex',
                minimum_returned: '10',
                minimum_direct_returned: '10',
                allow_paid_calls: 'true',
              },
            });
            core.info(`Dispatched Hunter real E2E for exact SHA ${sha}`);
