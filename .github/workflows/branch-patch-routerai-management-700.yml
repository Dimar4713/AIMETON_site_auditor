name: One-shot RouterAI management truncation patch

on:
  pull_request:
    paths:
      - ".github/workflows/branch-patch-routerai-management-700.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact evidence-driven patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          prod = Path('app/routerai_profile_extraction.py')
          text = prod.read_text(encoding='utf-8')
          old = '''        management_request(\n            "profile_management",\n            ManagementSlice,\n            system="Возвращай только компактный валидный JSON по схеме.",\n            prompt=management_prompt,\n            max_tokens=600,\n            timeout_seconds=18.0,\n        ),'''
          new = old.replace('max_tokens=600', 'max_tokens=900')
          assert text.count(old) == 1
          prod.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_routerai_profile_extraction.py')
          text = tests.read_text(encoding='utf-8')
          assert text.count('calls["profile_management"]["max_tokens"] == 600') == 1
          assert text.count('phase_tokens["profile_management"] == 600') == 1
          text = text.replace(
              'calls["profile_management"]["max_tokens"] == 600',
              'calls["profile_management"]["max_tokens"] == 900',
          ).replace(
              'phase_tokens["profile_management"] == 600',
              'phase_tokens["profile_management"] == 900',
          )
          tests.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python3 -m compileall -q app/routerai_profile_extraction.py
          python3 -m pytest -q tests/test_routerai_profile_extraction.py tests/test_routerai_strict_request.py

      - name: Prove unchanged safety boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/routerai_profile_extraction.py').read_text(encoding='utf-8')
          tests = Path('tests/test_routerai_profile_extraction.py').read_text(encoding='utf-8')
          assert 'max_tokens=900' in source
          assert 'timeout_seconds=18.0' in source
          assert '_MANAGEMENT_OFFICIAL_TEXT_BUDGET = 5000' in source
          assert '_MANAGEMENT_SOURCE_CHAR_BUDGET = 5000' in source
          assert 'max_tokens=1100' in source
          assert 'calls["profile_management"]["max_tokens"] == 900' in tests
          assert 'phase_tokens["profile_management"] == 900' in tests
          assert 'max(phase_tokens.values()) <= 1100' in tests
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/branch-patch-routerai-management-700.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routerai_profile_extraction.py tests/test_routerai_profile_extraction.py
          git commit -m 'fix: raise bounded management output ceiling after live truncation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
