name: Temporary Accept Search Scheduler Health 9FF9

on:
  push:
    branches:
      - diag/accept-search-scheduler-health-9ff9

permissions:
  contents: read

jobs:
  accept:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 5
    steps:
      - name: Verify public scheduler health without search calls
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='9ff920711e7019fdb4a771f4bda6f9d169502bcb'
          deployed="$(cat /opt/aimeton/auditor-stack/app-source-sha.txt)"
          [[ "$deployed" == "$expected" ]]
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aimeton-auditor)"
          [[ "$status" == "healthy" ]]

          health_json="$(curl --fail --silent --show-error https://stage-auditor.aimeton.ru/api/search/health)"
          docker exec -e HEALTH_JSON="$health_json" -i aimeton-auditor python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['HEALTH_JSON'])
          assert payload['status'] in {'ok', 'degraded'}, payload['status']
          assert payload['secrets_exposed'] is False
          providers = {item['provider']: item for item in payload['providers']}
          searxng = providers['searxng']
          scheduling = searxng.get('scheduling')
          assert scheduling is not None, searxng
          assert scheduling['max_concurrency'] == 2, scheduling
          assert scheduling['jitter_min_seconds'] == 0.2, scheduling
          assert scheduling['jitter_max_seconds'] == 0.8, scheduling
          serialized = json.dumps(payload).lower()
          assert 'secret-' not in serialized
          print(json.dumps({
              'deployed_sha': '9ff920711e7019fdb4a771f4bda6f9d169502bcb',
              'health_status': payload['status'],
              'searxng_state': searxng['state'],
              'max_concurrency': scheduling['max_concurrency'],
              'jitter_min_seconds': scheduling['jitter_min_seconds'],
              'jitter_max_seconds': scheduling['jitter_max_seconds'],
              'active_cooldowns': len(searxng.get('upstream_cooldowns', [])),
              'external_provider_calls': 0,
          }, sort_keys=True))
          PY
