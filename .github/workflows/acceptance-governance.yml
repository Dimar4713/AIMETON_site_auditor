name: Acceptance Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR governance contract
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          python scripts/acceptance_governance.py pr --body-file /tmp/body.md

  publish-merge-evidence:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Publish evidence to explicitly linked Issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const heading = /^#{1,6}\s+Acceptance criteria affected\s*$/im;
            const match = heading.exec(body);
            if (!match) {
              core.setFailed('Missing Acceptance criteria affected section');
              return;
            }
            const tail = body.slice(match.index + match[0].length);
            const nextHeading = /^#{1,6}\s+/m.exec(tail);
            const criteria = (nextHeading ? tail.slice(0, nextHeading.index) : tail).trim();
            if (!criteria) {
              core.setFailed('Acceptance criteria affected section is empty');
              return;
            }
            const refs = [...body.matchAll(/\b(?:part\s+of|closes?|fixes?|resolves?)\s+#(\d+)\b/gi)]
              .map(x => Number(x[1]));
            const unique = [...new Set(refs)];
            if (!unique.length) {
              core.setFailed('No explicitly linked Issue');
              return;
            }
            const pr = context.payload.pull_request;
            const evidence = [
              '## Merge evidence',
              '',
              `- PR: #${pr.number}`,
              `- merge SHA: \`${pr.merge_commit_sha}\``,
              `- workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Acceptance criteria affected',
              '',
              criteria,
              '',
              '> Checklist was not changed automatically. Exact criterion matching remains manual unless a future rule proves an unambiguous mapping.'
            ].join('\n');
            for (const issue_number of unique) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: evidence
              });
            }

  guard-issue-closure:
    if: github.event_name == 'issues' && github.event.action == 'closed' && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate completed Issue
        id: guard
        continue-on-error: true
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > /tmp/body.md
          python scripts/acceptance_governance.py issue --body-file /tmp/body.md
      - name: Reopen invalid completion
        if: steps.guard.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'open'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '## Completion blocked\n\nIssue was reopened because mandatory checkboxes remain open and no `Debt transfer` section references a separate Issue. No checklist item was changed automatically.'
            });
            core.setFailed('Issue completion reverted by governance guard');
