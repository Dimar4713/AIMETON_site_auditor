name: Temporary Patch Persistent Search Cache 441

on:
  push:
    branches:
      - fix/persistent-search-cache-441

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/persistent-search-cache-441
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply guarded persistent-cache integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # SearchGateway: cache contract + fail-open access.
          replace_once(
              'app/search_gateway/gateway.py',
              'from app.search_gateway.cache import MemorySearchCache\n',
              'from app.search_gateway.cache import MemorySearchCache, SearchCache\n',
          )
          replace_once(
              'app/search_gateway/gateway.py',
              '        cache: MemorySearchCache | None = None,\n',
              '        cache: SearchCache | None = None,\n',
          )
          replace_once(
              'app/search_gateway/gateway.py',
              '        self._sleep = sleep\n        self._lock = asyncio.Lock()\n\n    def _circuit_state',
              '''        self._sleep = sleep\n        self._lock = asyncio.Lock()\n\n    async def _cache_get(self, key: str) -> list[SearchItem] | None:\n        try:\n            return await self._cache.get(key)\n        except Exception:\n            return None\n\n    async def _cache_set(\n        self, key: str, results: list[SearchItem], ttl_seconds: int\n    ) -> None:\n        try:\n            await self._cache.set(key, results, ttl_seconds)\n        except Exception:\n            return\n\n    def _circuit_state''',
          )

          gateway = Path('app/search_gateway/gateway.py')
          text = gateway.read_text(encoding='utf-8')
          get_count = text.count('cached = await self._cache.get(cache_key)')
          if get_count != 1:
              raise SystemExit(f'gateway cache get count drifted: {get_count}')
          text = text.replace(
              'cached = await self._cache.get(cache_key)',
              'cached = await self._cache_get(cache_key)',
              1,
          )
          set_count = text.count('await self._cache.set(cache_key, response.results, policy.cache_ttl_seconds)')
          if set_count < 2 or set_count > 12:
              raise SystemExit(f'gateway cache set count unexpected: {set_count}')
          text = text.replace(
              'await self._cache.set(cache_key, response.results, policy.cache_ttl_seconds)',
              'await self._cache_set(cache_key, response.results, policy.cache_ttl_seconds)',
          )
          gateway.write_text(text, encoding='utf-8')

          # Factory: opt-in durable backend selected by path.
          replace_once(
              'app/search_gateway/factory.py',
              'from app.search_gateway.factory_helpers import first_nonempty_env\n',
              'from app.search_gateway.cache import SQLiteSearchCache, SearchCache\nfrom app.search_gateway.factory_helpers import first_nonempty_env\n',
          )
          replace_once(
              'app/search_gateway/factory.py',
              '@lru_cache(maxsize=1)\ndef get_search_gateway() -> TracedSearchGateway:\n',
              '''def _search_cache_from_env() -> SearchCache | None:\n    path = os.getenv("SEARCH_CACHE_DB_PATH", "").strip()\n    if not path:\n        return None\n    return SQLiteSearchCache(\n        path,\n        max_entries=_int_env(\n            "SEARCH_CACHE_MAX_ENTRIES", 4096, minimum=128, maximum=100000\n        ),\n    )\n\n\n@lru_cache(maxsize=1)\ndef get_search_gateway() -> TracedSearchGateway:\n''',
          )
          replace_once(
              'app/search_gateway/factory.py',
              '    return TracedSearchGateway([yandex, searxng, tavily], global_quotas=quotas)\n',
              '    return TracedSearchGateway(\n        [yandex, searxng, tavily],\n        global_quotas=quotas,\n        cache=_search_cache_from_env(),\n    )\n',
          )

          # Stage: place cache on the already-verified persistent /app/data mount.
          replace_once(
              'scripts/deploy_stage.sh',
              '      SEARCH_EFFECTIVENESS_DEBUG: "$SEARCH_EFFECTIVENESS_DEBUG"\n      IDENTITY_SEARCH_PROVIDER_ORDER:',
              '      SEARCH_EFFECTIVENESS_DEBUG: "$SEARCH_EFFECTIVENESS_DEBUG"\n      SEARCH_CACHE_DB_PATH: "/app/data/search-cache.sqlite3"\n      SEARCH_CACHE_MAX_ENTRIES: "4096"\n      IDENTITY_SEARCH_PROVIDER_ORDER:',
          )

          replace_once(
              '.env.example',
              'SEARCH_CACHE_TTL_SECONDS=900\nSEARCH_ALLOW_PAID_FALLBACK=false\n',
              'SEARCH_CACHE_TTL_SECONDS=900\nSEARCH_CACHE_DB_PATH=\nSEARCH_CACHE_MAX_ENTRIES=4096\nSEARCH_ALLOW_PAID_FALLBACK=false\n',
          )
          PY

          python -m py_compile app/search_gateway/cache.py app/search_gateway/gateway.py app/search_gateway/factory.py tests/test_search_persistent_cache.py
          bash -n scripts/deploy_stage.sh
          pytest -q \
            tests/test_search_persistent_cache.py \
            tests/test_search_singleflight.py \
            tests/test_search_retry_backoff.py \
            tests/test_search_provider_gateway.py \
            tests/test_search_typed_failures.py \
            tests/test_stage_deploy_runtime_persistence.py

          git config user.name 'AIMETON Search Hardening'
          git config user.email '127470701+Dimar4713@users.noreply.github.com'
          git add app/search_gateway/gateway.py app/search_gateway/factory.py scripts/deploy_stage.sh .env.example
          git commit -m 'Enable fail-open persistent search cache on Stage [persistent-search-cache-patched]'
          git push origin HEAD:fix/persistent-search-cache-441
