name: Configure DaData Stage

on:
  workflow_run:
    workflows:
      - Deploy Stage
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aimeton-auditor-stage-dadata
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: DADATA
    timeout-minutes: 15
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      STAGE_URL: https://stage-auditor.aimeton.ru
      DADATA_API: ${{ secrets.DADATA_API }}
      DADATA_SECRET: ${{ secrets.DADATA_SECRET }}
      DADATA_SMOKE_QUERY: ${{ vars.DADATA_SMOKE_QUERY || '7707083893' }}
      DADATA_PUBLIC_READY_ATTEMPTS: 8

    steps:
      - name: Resolve exact deployed source SHA
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test -f app-source-sha.txt
          deployed="$(tr -d '[:space:]' < app-source-sha.txt)"
          [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$deployed" >> "$GITHUB_OUTPUT"
          echo "DaData deployed source SHA: $deployed"

      - name: Materialize exact DaData tooling without marketplace actions
        shell: bash
        env:
          TOOLING_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$TOOLING_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$TOOLING_SHA"
          git clean -ffdx
          [[ "$(git rev-parse HEAD)" == "$TOOLING_SHA" ]]
          test -f scripts/configure_dadata_stage.sh

      - name: Validate DaData secret contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DADATA_API DADATA_SECRET; do
            test -n "${!name:-}" || { echo "Missing required DADATA environment secret: $name" >&2; exit 1; }
            [[ "${!name}" != *$'\n'* ]] || { echo "Invalid newline in DADATA environment secret: $name" >&2; exit 1; }
          done

      - name: Configure runtime and run live smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          bash -n scripts/configure_dadata_stage.sh
          install -d -m 0700 "$STACK_DIR/deployment-evidence"
          chmod +x scripts/configure_dadata_stage.sh
          scripts/configure_dadata_stage.sh 2>&1 | tee "$STACK_DIR/deployment-evidence/dadata-stage-${GITHUB_RUN_ID}.log"
          chmod 0600 "$STACK_DIR/deployment-evidence/dadata-stage-${GITHUB_RUN_ID}.log"

      - name: Record redacted final state
        if: always()
        shell: bash
        run: |
          set +e
          cd "$STACK_DIR"
          install -d -m 0700 deployment-evidence
          evidence="deployment-evidence/dadata-final-state-${GITHUB_RUN_ID}.txt"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bundle_sha=$(cat app-source-sha.txt 2>/dev/null || echo unavailable)"
            echo "tooling_sha=${{ steps.source.outputs.sha }}"
            echo "marketplace_actions=disabled"
            echo "hosted_runner=disabled"
            curl -sS "$STAGE_URL/api/missions/registry-mirror/dadata/health" || true
          } | tee "$evidence"
          chmod 0600 "$evidence"
          cat "$evidence" >> "$GITHUB_STEP_SUMMARY"
