name: Configure DaData Stage

on:
  workflow_run:
    workflows:
      - Deploy Stage
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aimeton-auditor-stage-dadata
  cancel-in-progress: false

jobs:
  deployment-gate:
    runs-on: ubuntu-latest
    outputs:
      real_deploy: ${{ steps.gate.outputs.real_deploy }}
    steps:
      - name: Require a successful deploy job
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('real_deploy', 'true');
              return;
            }
            const runId = context.payload.workflow_run?.id;
            if (!runId || context.payload.workflow_run?.conclusion !== 'success') {
              core.setOutput('real_deploy', 'false');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const deploy = jobs.find(job => job.name === 'deploy');
            const realDeploy = Boolean(deploy && deploy.status === 'completed' && deploy.conclusion === 'success');
            core.info(`parent deploy job conclusion: ${deploy?.conclusion || 'missing'}`);
            core.setOutput('real_deploy', realDeploy ? 'true' : 'false');

  configure:
    needs: deployment-gate
    if: ${{ needs.deployment-gate.outputs.real_deploy == 'true' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - stage
      - auditor
    environment: DADATA
    timeout-minutes: 15
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      STAGE_URL: https://stage-auditor.aimeton.ru
      DADATA_API: ${{ secrets.DADATA_API }}
      DADATA_SECRET: ${{ secrets.DADATA_SECRET }}
      DADATA_SMOKE_QUERY: ${{ vars.DADATA_SMOKE_QUERY || '7707083893' }}

    steps:
      - name: Checkout main runtime tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate DaData secret contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DADATA_API DADATA_SECRET; do
            test -n "${!name:-}" || {
              echo "Missing required DADATA environment secret: $name" >&2
              exit 1
            }
            [[ "${!name}" != *$'\n'* ]] || {
              echo "Invalid newline in DADATA environment secret: $name" >&2
              exit 1
            }
          done
          echo "DaData environment secret contract present"

      - name: Align stage smoke with runtime contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/configure_dadata_stage.sh")
          text = path.read_text(encoding="utf-8")

          old_health = '''assert payload.get("configured") is True, payload
          assert "api_token_present" in payload, payload
          assert "secret_present" in payload, payload
          assert payload["api_token_present"] is True, payload
          assert payload["secret_present"] is True, payload
          print(json.dumps({"provider": "dadata", "configured": True}, ensure_ascii=False))'''
          new_health = '''assert payload.get("state") == "active", payload
          assert payload.get("api_token_configured") is True, payload
          assert payload.get("secret_configured") is True, payload
          assert payload.get("secrets_exposed") is False, payload
          print(json.dumps({"provider": "dadata", "state": "active", "secrets_exposed": False}, ensure_ascii=False, sort_keys=True))'''

          old_lookup = '''assert "document_digest" in payload or payload.get("state") == "unresolved", payload'''
          new_lookup = '''records = payload.get("records") or []
          if payload.get("state") != "unresolved":
              assert records, payload
              assert all(record.get("response_digest") for record in records), payload'''

          if old_health not in text:
              raise SystemExit("Expected legacy DaData health assertions not found")
          if old_lookup not in text:
              raise SystemExit("Expected legacy DaData lookup digest assertion not found")

          text = text.replace(old_health, new_health).replace(old_lookup, new_lookup)
          path.write_text(text, encoding="utf-8")
          PY
          bash -n scripts/configure_dadata_stage.sh

      - name: Configure runtime and run live smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-evidence
          chmod +x scripts/configure_dadata_stage.sh
          scripts/configure_dadata_stage.sh 2>&1 | tee deployment-evidence/dadata-stage.log

      - name: Record redacted final state
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p deployment-evidence
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "timestamp_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "bundle_sha=$(cat "$STACK_DIR/app-source-sha.txt" 2>/dev/null || echo unavailable)"
            docker ps --filter name=aimeton-auditor --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
            curl -sS "$STAGE_URL/api/missions/registry-mirror/dadata/health" || true
          } | tee deployment-evidence/dadata-final-state.txt

      - name: Upload DaData deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dadata-stage-${{ github.run_id }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 30
