name: Configure DaData Stage

on:
  workflow_run:
    workflows:
      - Deploy Stage
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: aimeton-auditor-stage-dadata
  cancel-in-progress: false

jobs:
  deployment-gate:
    runs-on: ubuntu-latest
    outputs:
      real_deploy: ${{ steps.gate.outputs.real_deploy }}
    steps:
      - name: Require a successful deploy job
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('real_deploy', 'true');
              return;
            }
            const runId = context.payload.workflow_run?.id;
            if (!runId || context.payload.workflow_run?.conclusion !== 'success') {
              core.setOutput('real_deploy', 'false');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100,
            });
            const deploy = jobs.find(job => job.name === 'deploy');
            const realDeploy = Boolean(deploy && deploy.status === 'completed' && deploy.conclusion === 'success');
            core.info(`parent deploy job conclusion: ${deploy?.conclusion || 'missing'}`);
            core.setOutput('real_deploy', realDeploy ? 'true' : 'false');

  configure:
    needs: deployment-gate
    if: ${{ needs.deployment-gate.outputs.real_deploy == 'true' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - stage
      - auditor
    environment: DADATA
    timeout-minutes: 15
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      STAGE_URL: https://stage-auditor.aimeton.ru
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      DADATA_API: ${{ secrets.DADATA_API }}
      DADATA_SECRET: ${{ secrets.DADATA_SECRET }}
      DADATA_SMOKE_QUERY: ${{ vars.DADATA_SMOKE_QUERY || '7707083893' }}
      DADATA_PUBLIC_READY_ATTEMPTS: 8

    steps:
      - name: Verify exact deployed runtime tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test -f app-source-sha.txt
          deployed="$(cat app-source-sha.txt)"
          if [[ -n "${EXPECTED_SHA:-}" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$deployed" == "$EXPECTED_SHA" ]]
          fi
          test -f scripts/configure_dadata_stage.sh
          echo "DaData tooling source SHA: $deployed"

      - name: Validate DaData secret contract
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in DADATA_API DADATA_SECRET; do
            test -n "${!name:-}" || {
              echo "Missing required DADATA environment secret: $name" >&2
              exit 1
            }
            [[ "${!name}" != *$'\n'* ]] || {
              echo "Invalid newline in DADATA environment secret: $name" >&2
              exit 1
            }
          done
          echo "DaData environment secret contract present"

      - name: Validate committed stage smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          bash -n scripts/configure_dadata_stage.sh

      - name: Configure runtime and run live smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          mkdir -p deployment-evidence
          chmod +x scripts/configure_dadata_stage.sh
          scripts/configure_dadata_stage.sh 2>&1 | tee deployment-evidence/dadata-stage.log

      - name: Record redacted final state
        if: always()
        shell: bash
        run: |
          set +e
          cd "$STACK_DIR"
          mkdir -p deployment-evidence
          chmod 700 deployment-evidence
          evidence="deployment-evidence/dadata-final-state-${GITHUB_RUN_ID}.txt"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bundle_sha=$(cat app-source-sha.txt 2>/dev/null || echo unavailable)"
            echo "marketplace_actions_on_stage_runner=disabled"
            docker ps --filter name=aimeton-auditor --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
            curl -sS "$STAGE_URL/api/missions/registry-mirror/dadata/health" || true
          } | tee "$evidence"
          chmod 600 "$evidence"
          find deployment-evidence -type f -name 'dadata-final-state-*.txt' -mtime +30 -delete 2>/dev/null || true
          {
            echo '## DaData Stage evidence'
            echo
            echo '```text'
            cat "$evidence"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
