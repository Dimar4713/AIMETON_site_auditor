name: Refresh Identity Schema Contract Readiness

on:
  push:
    branches:
      - feat/provider-contract-readiness
    paths:
      - .github/workflows/refresh-identity-schema-contract-readiness.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-contract-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and regenerate canonical schemas
        run: |
          set -Eeuo pipefail
          pip install -r requirements.txt >/dev/null
          python scripts/export_identity_evidence_schemas.py
      - name: Commit schema refresh and remove helper
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/refresh-identity-schema-contract-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add schemas/identity-search-v0.1.schema.json schemas/identity-evidence-v0.1.schema.json .github/workflows/refresh-identity-schema-contract-readiness.yml
          git commit -m 'Refresh identity evidence schemas for contract-blocked reason'
          git push origin HEAD:feat/provider-contract-readiness
