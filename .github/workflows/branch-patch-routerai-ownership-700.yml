name: One-shot RouterAI ownership truncation patch

on:
  pull_request:
    paths:
      - ".github/workflows/branch-patch-routerai-ownership-700.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .patch-venv
          . .patch-venv/bin/activate
          python -m pip install -q --disable-pip-version-check pytest pydantic httpx
      - name: Apply exact evidence-driven patch
        shell: bash
        run: |
          set -Eeuo pipefail
          . .patch-venv/bin/activate
          python3 - <<'PY'
          from pathlib import Path

          prod = Path('app/routerai_profile_extraction.py')
          text = prod.read_text(encoding='utf-8')
          old = '''        request_json(\n            "profile_ownership_network",\n            OwnershipNetworkSlice,\n            system="Возвращай только компактный валидный JSON по схеме.",\n            prompt=ownership_network_prompt,\n            max_tokens=700,\n            timeout_seconds=18.0,\n        ),'''
          new = old.replace('max_tokens=700', 'max_tokens=1000')
          assert text.count(old) == 1
          prod.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_routerai_profile_extraction.py')
          text = tests.read_text(encoding='utf-8')
          assert text.count('phase_tokens["profile_ownership_network"] == 700') == 1
          text = text.replace(
              'phase_tokens["profile_ownership_network"] == 700',
              'phase_tokens["profile_ownership_network"] == 1000',
          )
          tests.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python3 -m compileall -q app/routerai_profile_extraction.py
          python3 -m pytest -q tests/test_routerai_profile_extraction.py tests/test_routerai_strict_request.py
      - name: Prove unchanged safety boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/routerai_profile_extraction.py').read_text(encoding='utf-8')
          tests = Path('tests/test_routerai_profile_extraction.py').read_text(encoding='utf-8')
          assert 'max_tokens=1000' in source
          assert 'timeout_seconds=18.0' in source
          assert '_MANAGEMENT_OFFICIAL_TEXT_BUDGET = 5000' in source
          assert '_MANAGEMENT_SOURCE_CHAR_BUDGET = 5000' in source
          assert 'max_tokens=1100' in source
          assert 'phase_tokens["profile_management"] == 900' in tests
          assert 'phase_tokens["profile_ownership_network"] == 1000' in tests
          assert 'max(phase_tokens.values()) <= 1100' in tests
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .patch-venv
          git rm .github/workflows/branch-patch-routerai-ownership-700.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routerai_profile_extraction.py tests/test_routerai_profile_extraction.py
          git commit -m 'fix: raise bounded ownership output ceiling after live truncation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
