name: ACCB Layer B Dry Run

on:
  pull_request:
    paths:
      - 'scripts/accb_layer_b_dry_run.py'
      - 'tests/test_accb_layer_b_dry_run.py'
      - 'docs/research/accb_layer_b_snapshot/**'
      - 'docs/research/ACCB_LAYER_B_DRY_RUN_2026-08-23.md'
      - '.github/workflows/accb-layer-b-dry-run.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/accb_layer_b_dry_run.py'
      - 'tests/test_accb_layer_b_dry_run.py'
      - 'docs/research/accb_layer_b_snapshot/**'
      - 'docs/research/ACCB_LAYER_B_DRY_RUN_2026-08-23.md'
      - '.github/workflows/accb-layer-b-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: accb-layer-b-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate zero-spend Layer B assembly
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 15
    steps:
      - name: Materialize exact commit without Marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: /tmp/aimeton-accb-layer-b-dry-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compile dry-run harness
        shell: bash
        env:
          WORKDIR: /tmp/aimeton-accb-layer-b-dry-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          cd "$WORKDIR"
          python3 -m py_compile scripts/accb_layer_b_dry_run.py

      - name: Materialize and validate no-paid dry-run report
        shell: bash
        env:
          WORKDIR: /tmp/aimeton-accb-layer-b-dry-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          cd "$WORKDIR"
          python3 scripts/accb_layer_b_dry_run.py --output /tmp/accb-layer-b-dry-${GITHUB_RUN_ID}.json
          python3 - /tmp/accb-layer-b-dry-${GITHUB_RUN_ID}.json <<'PY'
          import json
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert payload['status'] == 'DRY_RUN_NO_MODEL_GENERATION'
          assert payload['network_calls_performed'] == 0
          assert payload['routerai_generation_calls_performed'] == 0
          assert payload['spend_authorized_rub'] == 0
          assert payload['planned_calls'] == 15
          assert payload['planning_cost_recomputed_rub'] == 1001.827382
          assert len(payload['context_manifests']) == 3
          assert all(row['provider_token_count'] is None for row in payload['context_manifests'])
          assert all(row['logical_whitespace_tokens'] == row['anchor_tokens'] for row in payload['context_manifests'])
          print(json.dumps({
              'ok': True,
              'status': payload['status'],
              'planned_calls': payload['planned_calls'],
              'planning_cost_recomputed_rub': payload['planning_cost_recomputed_rub'],
              'routerai_generation_calls_performed': payload['routerai_generation_calls_performed'],
              'spend_authorized_rub': payload['spend_authorized_rub'],
          }, sort_keys=True))
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/aimeton-accb-layer-b-dry-${{ github.run_id }}
          rm -f /tmp/accb-layer-b-dry-${GITHUB_RUN_ID}.json
