name: Project Governance Audit

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'project:audit-governance'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          test -n "${PROJECT_OWNER:-}"
          test -n "${PROJECT_NUMBER:-}"

      - name: Run read-only audit
        id: audit
        run: |
          set -o pipefail
          python -m scripts.project_governance_audit_v2 2>&1 | tee governance-audit.json

      - name: Publish audit evidence
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('governance-audit.json')
              ? fs.readFileSync('governance-audit.json', 'utf8').trim()
              : 'Audit produced no report.';
            const report = raw.length > 55000 ? `${raw.slice(0, 55000)}\n…truncated` : raw;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `## Read-only Project governance audit\n\n- mode: \`read_only\`\n- Project mutations: \`0\`\n- workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`json\n${report}\n\`\`\``
            });

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-governance-audit-${{ github.run_id }}
          path: governance-audit.json
          if-no-files-found: error
