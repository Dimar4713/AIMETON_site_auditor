name: ACCB OpenRouter Sol Generation Readback
on:
  workflow_dispatch:
    inputs:
      expected_sha: { required: true, type: string }
      evidence_issue: { required: true, default: "820", type: string }
      generation_id: { required: true, type: string }
permissions:
  contents: read
  issues: write
jobs:
  readback:
    environment: stage
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      GENERATION_ID: ${{ inputs.generation_id }}
      OPENROUTER_PROXY_URL: ${{ vars.OPENROUTER_PROXY_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Materialize exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GENERATION_ID" =~ ^gen-[A-Za-z0-9_-]+$ ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Read one explicitly supplied existing generation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.parse

          sys.path.insert(0, "scripts")
          import openrouter_proxy_client as client

          generation_id = os.environ["GENERATION_ID"]
          proxy = os.environ.get("OPENROUTER_PROXY_URL", "").strip()
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          receipt = {
              "status": "OPENROUTER_GENERATION_READBACK_FAILED",
              "generation_id": generation_id,
              "model_generation_requests": 0,
              "paid_spend_authorized_rub": 0,
              "raw_prompt_retained": False,
              "raw_completion_retained": False,
              "automatic_retries": 0,
          }
          try:
              client.validate_proxy_and_key(proxy, key)
              url = "https://openrouter.ai/api/v1/generation?id=" + urllib.parse.quote(
                  generation_id, safe=""
              )
              result = client.authenticated_get(
                  url=url,
                  proxy=proxy,
                  api_key=key,
                  total_timeout_seconds=90,
              )
              receipt.update(
                  {
                      "http_status": result.http_status,
                      "transport_metrics": result.metrics,
                      "diagnostic_headers": result.diagnostic_headers,
                  }
              )
              if result.http_status != 200:
                  raise RuntimeError(f"openrouter_http_{result.http_status}")
              data = json.loads(result.body.decode("utf-8"))
              data = data.get("data") if isinstance(data.get("data"), dict) else data
              receipt.update(
                  {
                      "status": "OPENROUTER_GENERATION_READBACK_COMPLETE",
                      "model": data.get("model"),
                      "provider_name": data.get("provider_name") or data.get("provider"),
                      "usage": data.get("usage") if isinstance(data.get("usage"), dict) else {},
                      "total_cost": data.get("total_cost") or data.get("cost"),
                      "native_tokens_prompt": data.get("native_tokens_prompt"),
                      "native_tokens_completion": data.get("native_tokens_completion"),
                  }
              )
          except client.CurlTransportError as exc:
              receipt["failure_class"] = exc.failure_class
              receipt["transport_metrics"] = exc.metrics
          except Exception as exc:
              receipt["failure_class"] = str(exc)[:160]

          pathlib.Path("/tmp/accb-openrouter-sol-generation-readback.json").write_text(
              json.dumps(receipt, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Publish sanitized readback
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path("/tmp/accb-openrouter-sol-generation-readback.json")
          receipt = json.loads(path.read_text()) if path.exists() else {"status": "READBACK_DID_NOT_EMIT_RECEIPT"}
          body = "\n".join(
              [
                  "## ACCB OpenRouter existing generation readback",
                  "",
                  f"- exact SHA: `{os.environ['EXPECTED_SHA']}`",
                  f"- generation ID: `{receipt.get('generation_id')}`",
                  f"- status: **{receipt.get('status')}**",
                  f"- HTTP status: `{receipt.get('http_status')}`",
                  f"- model: `{receipt.get('model')}`",
                  f"- provider: `{receipt.get('provider_name')}`",
                  f"- usage: `{json.dumps(receipt.get('usage') or {}, sort_keys=True)}`",
                  f"- total cost: `{receipt.get('total_cost')}`",
                  f"- native prompt tokens: `{receipt.get('native_tokens_prompt')}`",
                  f"- native completion tokens: `{receipt.get('native_tokens_completion')}`",
                  "- new generation requests: `0`",
                  "- new spend authorized: `0 RUB`",
                  "- raw prompt retained: `false`",
                  "- raw completion retained: `false`",
                  "- automatic retries: `0`",
                  f"- transport: `{json.dumps(receipt.get('transport_metrics') or {}, sort_keys=True)}`",
                  f"- failure class: `{receipt.get('failure_class')}`",
              ]
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY
      - name: Enforce read only
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          receipt = json.loads(pathlib.Path("/tmp/accb-openrouter-sol-generation-readback.json").read_text())
          assert receipt["model_generation_requests"] == 0
          assert receipt["paid_spend_authorized_rub"] == 0
          assert receipt["automatic_retries"] == 0
          if receipt["status"] != "OPENROUTER_GENERATION_READBACK_COMPLETE":
              raise SystemExit(receipt["status"])
          PY
