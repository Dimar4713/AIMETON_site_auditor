name: Temporary apply shadow observer wiring 544

on:
  push:
    branches:
      - feat/llm-search-observer-shadow-544

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llm-search-observer-shadow-544
          fetch-depth: 0
      - name: Apply shadow observer wiring patch
        run: python scripts/patch_shadow_observer_wiring_544.py
      - name: Validate syntax
        run: python -m compileall -q app/discovery.py app/search_observer_llm.py
      - name: Commit generated production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/discovery.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire Search Observer behind shadow feature flag"
          git push origin HEAD:feat/llm-search-observer-shadow-544
