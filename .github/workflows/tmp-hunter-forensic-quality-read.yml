name: Temporary Hunter Forensic Quality Read

on:
  push:
    branches:
      - chore/hunter-real-e2e-router

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EXPECTED_SHA: 10ad34b8fc2b9d1957f5b467999e738946fb2d6a
      MISSION_ID: hunt-39b88c7b-0a1c-4bee-a7f4-af9791560c60
      ATTEMPT_ID: corr-4b3fbbee-b990-4627-bbc6-373e0582f862
      REPORT: /tmp/hunter-quality-${{ github.run_id }}.md

    steps:
      - name: Verify same Stage and read forensic trace only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$EXPECTED_SHA" ]]
          [[ "$status" == healthy ]]
          result="$(docker exec -e MISSION_ID="$MISSION_ID" -e ATTEMPT_ID="$ATTEMPT_ID" -i "$CONTAINER" python - <<'PY'
          import json, os, sqlite3
          from collections import Counter

          db_path = os.getenv('AIMETON_RUNTIME_DB', 'data/runtime-core.sqlite3')
          db = sqlite3.connect(db_path, timeout=30)
          db.row_factory = sqlite3.Row
          rows = db.execute(
              '''SELECT sequence, operation, state, reason_code, counters_json, metadata_json
                 FROM mission_trace_events
                 WHERE mission_id=? AND attempt_id=? AND component='hunter'
                 ORDER BY sequence''',
              (os.environ['MISSION_ID'], os.environ['ATTEMPT_ID'])
          ).fetchall()
          db.close()
          assert rows, 'forensic hunter trace not found'

          events=[]
          for row in rows:
              events.append({
                  'sequence': row['sequence'],
                  'operation': row['operation'],
                  'state': row['state'],
                  'reason_code': row['reason_code'],
                  'counters': json.loads(row['counters_json'] or '{}'),
                  'metadata': json.loads(row['metadata_json'] or '{}'),
              })

          op_counts = Counter(e['operation'] for e in events)
          reason_counts = Counter(e['reason_code'] for e in events)
          pre = [e for e in events if e['operation']=='candidate_pre_scored']
          returned = [e for e in events if e['operation']=='candidate_returned']
          rejected = [e for e in events if e['operation']=='candidate_rejected']
          deep_done = [e for e in events if e['operation']=='candidate_deep_audit_completed']
          output_omitted = [e for e in events if e['operation']=='candidate_output_omitted']

          def pick(e):
              m=e['metadata']; c=e['counters']
              return {
                  'reason': e['reason_code'],
                  'url': m.get('candidate_url'),
                  'host': m.get('candidate_host'),
                  'title': m.get('candidate_title'),
                  'pre_score': c.get('pre_score'),
                  'minimum_pre_score': c.get('minimum_pre_score'),
                  'deep_score': c.get('deep_score') or c.get('audit_score'),
                  'industry_match': c.get('industry_match') if 'industry_match' in c else m.get('industry_match'),
                  'region_match': c.get('region_match') if 'region_match' in c else m.get('region_match'),
                  'metadata_keys': sorted(m.keys()),
                  'counter_keys': sorted(c.keys()),
              }

          pre_scores=[int(e['counters'].get('pre_score',0)) for e in pre]
          industry_yes=sum(1 for e in pre if int(e['counters'].get('industry_match',0) or 0)>0)
          region_yes=sum(1 for e in pre if int(e['counters'].get('region_match',0) or 0)>0)
          both_yes=sum(1 for e in pre if int(e['counters'].get('industry_match',0) or 0)>0 and int(e['counters'].get('region_match',0) or 0)>0)

          safe={
              'event_count': len(events),
              'operation_counts': dict(op_counts),
              'top_reason_counts': dict(reason_counts.most_common(20)),
              'pre_score_summary': {
                  'count': len(pre_scores),
                  'min': min(pre_scores) if pre_scores else None,
                  'max': max(pre_scores) if pre_scores else None,
                  'avg': round(sum(pre_scores)/len(pre_scores),2) if pre_scores else None,
                  'industry_match_positive': industry_yes,
                  'region_match_positive': region_yes,
                  'both_positive': both_yes,
              },
              'returned_sample': [pick(e) for e in returned[:30]],
              'rejected_sample': [pick(e) for e in rejected[:30]],
              'deep_audit_sample': [pick(e) for e in deep_done[:20]],
              'output_omitted_sample': [pick(e) for e in output_omitted[:20]],
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY
          )"
          {
            echo '## Hunter E2E forensic quality read'
            echo
            echo "- exact deployed SHA: \`$deployed\`"
            echo "- mission: \`$MISSION_ID\`"
            echo '- provider calls: `0`'
            echo
            echo '```json'
            echo "$result"
            echo '```'
          } | tee "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Upload quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: hunter-quality-${{ github.run_id }}
          path: ${{ env.REPORT }}
          retention-days: 30

      - name: Publish quality evidence to P1-501
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ env.REPORT }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 501, body: body.slice(0, 60000)});
