name: Stage Auto-Deploy Observer

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: stage-autodeploy-observer-${{ github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Observe Baseline to Deploy Stage chain for exact SHA
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.TARGET_SHA;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            async function runsFor(workflowId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                head_sha: sha,
                per_page: 20,
              });
              return response.data.workflow_runs || [];
            }

            let baseline = null;
            for (let i = 0; i < 30; i += 1) {
              const runs = await runsFor('baseline-ci.yml');
              baseline = runs.find(run => run.event === 'push' && run.head_branch === 'main') || null;
              if (baseline && baseline.status === 'completed') break;
              await sleep(10000);
            }

            let state = 'baseline_missing';
            let deploy = null;
            if (baseline) {
              if (baseline.conclusion !== 'success') {
                state = `baseline_${baseline.conclusion || 'unknown'}`;
              } else {
                state = 'deploy_not_dispatched';
                for (let i = 0; i < 30; i += 1) {
                  const runs = await runsFor('deploy-stage.yml');
                  deploy = runs.find(run => run.event === 'workflow_run') || null;
                  if (deploy && deploy.status === 'completed') break;
                  if (deploy) state = `deploy_seen_${deploy.status}`;
                  await sleep(10000);
                }
                if (deploy && deploy.status === 'completed') {
                  state = `deploy_seen_completed_${deploy.conclusion || 'unknown'}`;
                } else if (deploy) {
                  state = `deploy_seen_${deploy.status || 'unknown'}_timeout`;
                }
              }
            }

            const body = [
              '## Stage auto-deploy observer',
              '',
              `- exact SHA: \`${sha}\``,
              `- observer run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              `- state: **${state}**`,
              `- baseline run: ${baseline ? `https://github.com/${owner}/${repo}/actions/runs/${baseline.id}` : 'not observed'}`,
              `- baseline status/conclusion: ${baseline ? `${baseline.status}/${baseline.conclusion || 'none'}` : 'n/a'}`,
              `- deploy run: ${deploy ? `https://github.com/${owner}/${repo}/actions/runs/${deploy.id}` : 'not observed'}`,
              `- deploy status/conclusion: ${deploy ? `${deploy.status}/${deploy.conclusion || 'none'}` : 'n/a'}`,
              '',
              'Diagnostic only: this workflow never dispatches or performs a deployment.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 763,
              body,
            });

            if (state !== 'deploy_seen_completed_success') {
              core.setFailed(`Stage auto-deploy chain not proven for ${sha}: ${state}`);
            }
