name: Temporary apply Search Observer telemetry 544

on:
  push:
    branches:
      - feat/llm-search-observer-telemetry-544

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/llm-search-observer-telemetry-544
          fetch-depth: 0

      - name: Apply narrow Phase A telemetry integration
        run: python scripts/patch_search_observer_telemetry_544.py

      - name: Validate syntax
        run: python -m compileall -q app/discovery.py app/search_observer.py tests/test_search_observer_telemetry.py

      - name: Commit generated production integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/discovery.py
          git diff --cached --quiet && exit 0
          git commit -m "Instrument Hunter search-wave yield telemetry"
          git push origin HEAD:feat/llm-search-observer-telemetry-544
