name: Benchmark SearXNG Command Router

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: aimeton-benchmark-searxng-command-router-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.comment.user.login == 'Dimar4713' &&
      github.event.issue.number == 441 &&
      startsWith(github.event.comment.body, '/benchmark-searxng-concurrency-stage ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate owner command and dispatch live benchmark
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = (process.env.COMMENT_BODY || '').trim();
            const match = body.match(/^\/benchmark-searxng-concurrency-stage\s+([0-9a-f]{40})$/);
            if (!match) {
              core.setFailed('Invalid benchmark command syntax.');
              return;
            }

            const sha = match[1];
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (main.data.commit.sha !== sha) {
              core.setFailed(`Benchmark SHA ${sha} is not current main ${main.data.commit.sha}.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'benchmark-searxng-concurrency-stage.yml',
              ref: 'main',
              inputs: {
                expected_sha: sha,
                allow_live_calls: 'true',
              },
            });

            await core.summary
              .addHeading('Owner-authorized SearXNG benchmark dispatch')
              .addList([
                'issue: 441',
                `actor: ${context.actor}`,
                `exact_sha: ${sha}`,
                'matrix: 1,2,3,6',
                'queries_per_level: 6',
                'planned_searxng_http_calls: 24',
                'planned_upstream_engine_invocation_ceiling: 48',
                'allow_live_calls: true',
                'result: dispatched',
              ])
              .write();
