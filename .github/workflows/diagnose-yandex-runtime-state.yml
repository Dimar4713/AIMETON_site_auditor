name: Diagnose Yandex Runtime State

on:
  push:
    branches:
      - diag/stage-search-egress
    paths:
      - .github/workflows/diagnose-yandex-runtime-state.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: YANDEX_SEARCH
    timeout-minutes: 10
    env:
      YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
      YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
    steps:
      - name: Compare configured credentials without exposing secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_key_sha="$(printf '%s' "$YANDEX_SEARCH_API_KEY" | sha256sum | cut -d' ' -f1)"
          docker exec \
            -e EXPECTED_KEY_SHA="$expected_key_sha" \
            -e EXPECTED_FOLDER_ID="$YANDEX_CLOUD_FOLDER_ID" \
            aimeton-auditor python -c "import hashlib, os; key=os.getenv('YANDEX_SEARCH_API_KEY',''); folder=os.getenv('YANDEX_CLOUD_FOLDER_ID',''); expected=os.environ['EXPECTED_KEY_SHA']; expected_folder=os.environ['EXPECTED_FOLDER_ID']; print('container_api_key_matches_current=' + str(hashlib.sha256(key.encode()).hexdigest() == expected).lower()); print('container_folder_id_matches_current=' + str(folder == expected_folder).lower())"

      - name: Call legacy endpoint inside the container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec aimeton-auditor python - <<'PY'
          import json
          import urllib.request
          endpoint = 'http://127.0.0.1:5000/api/missions/search/yandex/web'
          body = json.dumps({'query':'Стоматология Красноярск официальный сайт компания'}, ensure_ascii=False).encode()
          request = urllib.request.Request(endpoint, data=body, method='POST', headers={'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read().decode('utf-8')
                  status = response.status
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode('utf-8')
              status = exc.code
          payload = json.loads(raw)
          print(json.dumps({'path':'container-localhost','http_status':status,'state':payload.get('state'),'records':len(payload.get('records') or []),'detail':str(payload.get('detail') or '')[:180]}, ensure_ascii=False))
          PY

      - name: Call legacy endpoint through public Caddy
        shell: bash
        run: |
          set -Eeuo pipefail
          payload='{"query":"Стоматология Красноярск официальный сайт компания"}'
          tmp="$(mktemp)"
          code="$(curl -sS -H 'Content-Type: application/json' --data "$payload" -o "$tmp" -w '%{http_code}' 'https://stage-auditor.aimeton.ru/api/missions/search/yandex/web')"
          python3 - "$code" "$tmp" <<'PY'
          import json, sys
          code, path = sys.argv[1:]
          payload = json.loads(open(path, encoding='utf-8').read())
          print(json.dumps({'path':'public-caddy','http_status':int(code),'state':payload.get('state'),'records':len(payload.get('records') or []),'detail':str(payload.get('detail') or '')[:180]}, ensure_ascii=False))
          PY
          rm -f "$tmp"
