name: Temporary Patch Search Singleflight 441

on:
  push:
    branches:
      - fix/search-singleflight-441

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-singleflight-441
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply guarded singleflight patch and regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app/search_gateway/models.py',
              '    cache_hit: bool = False\n    fallback_used: bool = False\n',
              '    cache_hit: bool = False\n    coalesced: bool = False\n    fallback_used: bool = False\n',
          )
          replace_once(
              'app/search_gateway/models.py',
              '            cache_hit=any(item.cache_hit for item in diagnostics),\n            fallback_used=any(item.fallback_used for item in diagnostics),\n',
              '            cache_hit=any(item.cache_hit for item in diagnostics),\n            coalesced=any(item.coalesced for item in diagnostics),\n            fallback_used=any(item.fallback_used for item in diagnostics),\n',
          )
          replace_once(
              'app/search_gateway/gateway.py',
              '        self._mission_costs: dict[str, dict[str, Decimal]] = {}\n        self._sleep = sleep\n        self._lock = asyncio.Lock()\n',
              '        self._mission_costs: dict[str, dict[str, Decimal]] = {}\n        self._inflight: dict[str, asyncio.Task[SearchResponse]] = {}\n        self._sleep = sleep\n        self._lock = asyncio.Lock()\n',
          )

          marker = '    async def search(self, request: SearchRequest, policy: SearchPolicy | None = None) -> SearchResponse:\n'
          wrapper = '''    async def _clear_inflight(\n        self,\n        cache_key: str,\n        task: asyncio.Task[SearchResponse],\n    ) -> None:\n        async with self._lock:\n            if self._inflight.get(cache_key) is task:\n                self._inflight.pop(cache_key, None)\n\n    async def search(self, request: SearchRequest, policy: SearchPolicy | None = None) -> SearchResponse:\n        policy = policy or SearchPolicy()\n        if policy.strategy is SearchStrategy.SHADOW_COMPARE:\n            return await self._search_impl(request, policy)\n\n        fingerprint = request_fingerprint(request)\n        cache_key = f"{fingerprint}:{policy_cache_suffix(policy)}"\n        async with self._lock:\n            task = self._inflight.get(cache_key)\n            if task is not None and task.done():\n                self._inflight.pop(cache_key, None)\n                task = None\n            coalesced = task is not None\n            if task is None:\n                task = asyncio.create_task(self._search_impl(request, policy))\n                self._inflight[cache_key] = task\n                task.add_done_callback(\n                    lambda finished, key=cache_key: asyncio.create_task(\n                        self._clear_inflight(key, finished)\n                    )\n                )\n\n        response = await asyncio.shield(task)\n        if not coalesced or response.diagnostics.cache_hit:\n            return response\n\n        shared_attempts = [\n            attempt.model_copy(update={"cost_amount": Decimal("0")})\n            for attempt in response.diagnostics.attempts\n        ]\n        diagnostics = response.diagnostics.model_copy(\n            update={\n                "coalesced": True,\n                "attempts": shared_attempts,\n                "total_cost_by_currency": {},\n            }\n        )\n        return response.model_copy(update={"diagnostics": diagnostics})\n\n    async def _search_impl(\n        self, request: SearchRequest, policy: SearchPolicy | None = None\n    ) -> SearchResponse:\n'''
          replace_once('app/search_gateway/gateway.py', marker, wrapper)
          PY

          python -m py_compile app/search_gateway/models.py app/search_gateway/gateway.py tests/test_search_singleflight.py
          pytest -q tests/test_search_singleflight.py tests/test_search_retry_backoff.py tests/test_search_typed_failures.py tests/test_search_provider_gateway.py tests/test_searxng_resilience.py

          git config user.name 'AIMETON Search Hardening'
          git config user.email '127470701+Dimar4713@users.noreply.github.com'
          git add app/search_gateway/models.py app/search_gateway/gateway.py
          git commit -m 'Coalesce identical in-flight search requests [search-singleflight-patched]'
          git push origin HEAD:fix/search-singleflight-441
