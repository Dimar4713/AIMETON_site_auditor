name: Deploy Stage

on:
  workflow_run:
    workflows:
      - Baseline CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to deploy; leave empty to deploy selected ref
        required: false
        type: string

permissions:
  contents: read

env:
  STACK_DIR: /opt/aimeton/auditor-stack
  STAGE_URL: https://stage-auditor.aimeton.ru

concurrency:
  group: aimeton-auditor-stage
  cancel-in-progress: false

jobs:
  deployment-gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Decide whether runtime changed
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_deploy', 'true');
              return;
            }
            const run = context.payload.workflow_run;
            if (!run || run.conclusion !== 'success' || run.head_branch !== 'main') {
              core.setOutput('should_deploy', 'false');
              return;
            }
            const {data: commit} = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: run.head_sha,
              per_page: 100,
            });
            const runtime = (commit.files || []).some(({filename}) =>
              filename.startsWith('app/') ||
              filename.startsWith('static/') ||
              filename === 'requirements.txt' ||
              filename === 'Dockerfile' ||
              filename === 'docker-compose.yml'
            );
            core.info(`Runtime deployment required: ${runtime}`);
            core.setOutput('should_deploy', runtime ? 'true' : 'false');

  deploy:
    needs: deployment-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       needs.deployment-gate.outputs.should_deploy == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - stage
      - auditor
    environment: stage
    timeout-minutes: 30
    env:
      BACKUP_KEEP: ${{ vars.STAGE_BACKUP_KEEP || '5' }}
      FAILED_KEEP: ${{ vars.STAGE_FAILED_KEEP || '2' }}
      TAVILY_SEARCH_COST_USD: ${{ vars.TAVILY_SEARCH_COST_USD || '0.008' }}
      SEARCH_MISSION_BUDGET_USD: ${{ vars.SEARCH_MISSION_BUDGET_USD || '0.008' }}
      SEARCH_QUOTA_TAVILY: ${{ vars.SEARCH_QUOTA_TAVILY || '10' }}
      IDENTITY_SEARCH_PROVIDER_ORDER: ${{ vars.IDENTITY_SEARCH_PROVIDER_ORDER || 'tavily,searxng' }}
      IDENTITY_AUTHORITY_HOSTS: ${{ vars.IDENTITY_AUTHORITY_HOSTS || 'egrul.nalog.ru,service.nalog.ru,bo.nalog.ru' }}

    steps:
      - name: Resolve exact deployment SHA
        id: target
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          sha="${WORKFLOW_RUN_SHA:-}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            sha="${MANUAL_SHA:-$FALLBACK_SHA}"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid deployment SHA: $sha" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $sha"

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Verify checkout identity
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          echo "Expected: $DEPLOY_SHA"
          echo "Actual:   $actual"
          [[ "$actual" == "$DEPLOY_SHA" ]]

      - name: Validate local stage runner contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "aimeton-main-server"
          test -d "$STACK_DIR"
          command -v docker >/dev/null
          docker info >/dev/null
          echo "Local stage runner contract OK"

      - name: Validate Tavily secret contract
        shell: bash
        env:
          TAVILY_TOKEN: ${{ secrets.TAVILY_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$TAVILY_TOKEN" || {
            echo "Missing required stage secret: TAVILY_TOKEN" >&2
            exit 1
          }

      - name: Deploy transactionally to stage
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          SOURCE_DIR: ${{ github.workspace }}
          TAVILY_TOKEN: ${{ secrets.TAVILY_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p deployment-evidence
          chmod +x scripts/deploy_stage.sh
          scripts/deploy_stage.sh 2>&1 | tee "deployment-evidence/deploy-${DEPLOY_SHA}.log"

      - name: Record final stage evidence
        if: always()
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          mkdir -p deployment-evidence
          {
            echo "requested_sha=$DEPLOY_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "actor=$GITHUB_ACTOR"
            echo "timestamp_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "bundle_sha=$(cat "$STACK_DIR/app-source-sha.txt" 2>/dev/null || echo unavailable)"
            echo "deployment_transport=self-hosted-local"
            echo "openstack_sdk_required=false"
            echo "pypi_access_required=false"
            echo "backup_keep=$BACKUP_KEEP"
            echo "failed_keep=$FAILED_KEEP"
            docker ps --filter name=aimeton-auditor --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
            curl -sS -D - -o /dev/null --max-redirs 0 "$STAGE_URL/mcp" || true
            curl -sS "$STAGE_URL/api/health" || true
          } | tee "deployment-evidence/final-state-${DEPLOY_SHA}.txt"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-deployment-${{ steps.target.outputs.sha }}-${{ github.run_id }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 30
