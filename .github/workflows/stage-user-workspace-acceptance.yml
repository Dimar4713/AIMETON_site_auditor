name: Stage User Workspace Acceptance

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-stage-user-workspace-acceptance
  cancel-in-progress: false

jobs:
  accept:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 192 &&
       github.event.comment.body == '/accept-user-workspace-stage' &&
       github.event.comment.user.login == 'Dimar4713')
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 20
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      STAGE_URL: https://stage-auditor.aimeton.ru

    steps:
      - name: Verify protected workspace and sanitized mission projection
        id: acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          report="$RUNNER_TEMP/stage-user-workspace.md"
          suffix="${GITHUB_RUN_ID}-$(date -u +%s)-$RANDOM"
          alice="workspace-alice-$suffix"
          bob="workspace-bob-$suffix"
          mission_id=""
          alice_id=""
          csrf="csrf-$suffix"
          current_step="initialization"
          echo "report=$report" >> "$GITHUB_OUTPUT"

          write_failure() {
            local code="$1" line="$2"
            {
              echo "## Independent stage user workspace acceptance"
              echo
              echo "- workflow run: $GITHUB_RUN_ID"
              echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "- verdict: ❌ failed"
              echo "- failed step: \`$current_step\`"
              echo "- shell line: \`$line\`"
              echo "- exit code: \`$code\`"
              echo "- credentials/session tokens/internal payloads: not recorded"
            } > "$report"
          }
          trap 'code=$?; line=$LINENO; if [[ $code -ne 0 ]]; then write_failure "$code" "$line"; fi' ERR

          cleanup() {
            set +e
            docker exec -i -e TEST_ALICE="$alice" -e TEST_BOB="$bob" -e TEST_MISSION_ID="$mission_id" "$CONTAINER" python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          auth = Path(os.environ.get("AIMETON_AUTH_DB", "/app/data/auth.sqlite3"))
          missions = Path(os.environ.get("AIMETON_MISSION_DB", "/app/data/missions.sqlite3"))
          if missions.exists() and os.environ.get("TEST_MISSION_ID"):
              with sqlite3.connect(missions) as db:
                  db.execute("DELETE FROM mission_records WHERE mission_id = ?", (os.environ["TEST_MISSION_ID"],))
                  db.execute("DELETE FROM missions WHERE id = ?", (os.environ["TEST_MISSION_ID"],))
          if auth.exists():
              with sqlite3.connect(auth) as db:
                  for username in (os.environ["TEST_ALICE"], os.environ["TEST_BOB"]):
                      row = db.execute("SELECT id FROM users WHERE username = ?", (username,)).fetchone()
                      if row:
                          db.execute("DELETE FROM sessions WHERE user_id = ?", (row[0],))
                          db.execute("DELETE FROM users WHERE id = ?", (row[0],))
          PY
          }
          trap cleanup EXIT

          current_step="runtime readiness"
          docker ps --format '{{.Names}}' | grep -Fxq "$CONTAINER"
          curl -fsS "$STAGE_URL/api/health" >/dev/null
          docker exec -i "$CONTAINER" python - <<'PY'
          from app.mission_api import MissionUserRecordsProjection, get_owned_mission_records
          from app.workspace_api import router
          assert all((MissionUserRecordsProjection, get_owned_mission_records, router))
          PY

          current_step="temporary identities and sessions"
          mapfile -t credentials < <(docker exec -i -e TEST_ALICE="$alice" -e TEST_BOB="$bob" "$CONTAINER" python - <<'PY'
          import os, secrets
          from datetime import timedelta
          from pathlib import Path
          from app.admin_users import AdminSQLiteUserRepository
          from app.auth import PasswordHasher, UserRole
          from app.session_resolution import TypedLocalAuthProvider
          repo = AdminSQLiteUserRepository(Path(os.environ.get("AIMETON_AUTH_DB", "/app/data/auth.sqlite3")))
          provider = TypedLocalAuthProvider(repo, session_ttl=timedelta(minutes=30))
          alice = repo.create_user(os.environ["TEST_ALICE"], PasswordHasher().hash(secrets.token_urlsafe(48)), UserRole.USER)
          bob = repo.create_user(os.environ["TEST_BOB"], PasswordHasher().hash(secrets.token_urlsafe(48)), UserRole.USER)
          print(f"{alice.id}|{provider.create_session(alice).token}|{provider.create_session(alice).token}")
          print(f"{bob.id}|{provider.create_session(bob).token}")
          PY
          )
          [[ ${#credentials[@]} -eq 2 ]]
          IFS='|' read -r alice_id alice_token alice_relogin_token <<< "${credentials[0]}"
          IFS='|' read -r bob_id bob_token <<< "${credentials[1]}"
          echo "::add-mask::$alice_token"; echo "::add-mask::$alice_relogin_token"; echo "::add-mask::$bob_token"
          cookie_alice="aimeton_session=$alice_token; aimeton_csrf=$csrf"
          cookie_alice_relogin="aimeton_session=$alice_relogin_token; aimeton_csrf=$csrf"
          cookie_bob="aimeton_session=$bob_token; aimeton_csrf=$csrf"

          current_step="anonymous and authenticated workspace boundary"
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' "$STAGE_URL/workspace")" == 401 ]]
          curl -fsS --cookie "$cookie_alice" "$STAGE_URL/workspace" | grep -Fq 'Мои миссии'
          curl -fsS --cookie "$cookie_alice" "$STAGE_URL/api/auth/me" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["username"]==sys.argv[1] and p["role"]=="user"' "$alice"

          current_step="owner mission creation and list"
          created="$(curl -fsS -X POST "$STAGE_URL/api/user/missions" --cookie "$cookie_alice" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' --data '{"title":"Stage user workspace acceptance","target_ref":"https://example.org","input_snapshot":{"secret_seed":"must-not-leak"},"correlation_id":"stage-user-workspace"}')"
          mission_id="$(python3 -c 'import json,sys; p=json.loads(sys.argv[1]); assert "owner_id" not in p and "input_snapshot" not in p and "technical_snapshot" not in p; print(p["id"])' "$created")"
          curl -fsS --cookie "$cookie_alice" "$STAGE_URL/api/user/missions" | python3 -c 'import json,sys; items=json.load(sys.stdin); assert any(x["id"]==sys.argv[1] for x in items); assert all("owner_id" not in x and "technical_snapshot" not in x for x in items)' "$mission_id"
          curl -fsS --cookie "$cookie_alice" "$STAGE_URL/workspace/missions/$mission_id" | grep -Fq '/static/mission-detail.js'

          current_step="sanitized evidence and report metadata"
          docker exec -i -e TEST_MISSION_ID="$mission_id" "$CONTAINER" python - <<'PY'
          import os
          from app.mission_sqlite import SQLiteMissionRepository
          repo = SQLiteMissionRepository()
          mid = os.environ["TEST_MISSION_ID"]
          repo.append_record(mid, "turn", {
              "turn_id": "turn-safe", "status": "completed", "summary": "safe summary", "source_count": 3,
              "provider_token": "SECRET-TOKEN", "internal_trace": "/app/private/trace.json"
          }, record_id="stage-workspace-turn")
          repo.append_record(mid, "sufficiency", {
              "record_id": "udp-safe", "level": "partial", "status": "degraded", "summary": "needs more evidence",
              "deficits": ["ownership"], "secret": "MUST-NOT-LEAK"
          }, record_id="stage-workspace-udp")
          repo.append_record(mid, "report_metadata", {
              "report_id": "report-safe", "status": "blocked", "format": "docx", "content_type": "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
              "available": False, "release_level": "reviewed", "blocked_reason": "report_release_blocked",
              "storage_path": "/app/private/report.docx", "signed_url": "https://secret.invalid/token"
          }, record_id="stage-workspace-report")
          PY
          records="$(curl -fsS --cookie "$cookie_alice" "$STAGE_URL/api/user/missions/$mission_id/records")"
          python3 - "$records" "$mission_id" <<'PY'
          import json, sys
          p = json.loads(sys.argv[1]); mid = sys.argv[2]
          assert p["mission_id"] == mid
          assert len(p["evidence"]) == 2
          assert p["report_reason"] == "report_release_blocked"
          report = p["report_metadata"]
          assert report["data"]["report_id"] == "report-safe" and report["data"]["available"] is False
          serialized = json.dumps(p, ensure_ascii=False)
          for forbidden in ("SECRET-TOKEN", "MUST-NOT-LEAK", "/app/private", "signed_url", "provider_token", "internal_trace", "storage_path"):
              assert forbidden not in serialized
          PY

          current_step="cross-user non-enumeration"
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --cookie "$cookie_bob" "$STAGE_URL/api/user/missions/$mission_id")" == 404 ]]
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' --cookie "$cookie_bob" "$STAGE_URL/api/user/missions/$mission_id/records")" == 404 ]]

          current_step="refresh and relogin continuity"
          curl -fsS --cookie "$cookie_alice_relogin" "$STAGE_URL/api/user/missions/$mission_id" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["id"]==sys.argv[1]' "$mission_id"
          curl -fsS --cookie "$cookie_alice_relogin" "$STAGE_URL/api/user/missions/$mission_id/records" | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["mission_id"]==sys.argv[1] and len(p["evidence"])==2' "$mission_id"

          deployed_sha="$(cat "$STACK_DIR/app-source-sha.txt" 2>/dev/null || echo unavailable)"
          {
            echo "## Independent stage user workspace acceptance"
            echo
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- deployed source SHA: \`$deployed_sha\`"
            echo "- protected workspace and session identity: ✅"
            echo "- owner create/list/detail and stable ID: ✅"
            echo "- refresh/relogin continuity: ✅"
            echo "- cross-user detail/records: ✅ 404/404"
            echo "- sanitized evidence and УДП allow-list: ✅"
            echo "- typed blocked report metadata: ✅"
            echo "- admin/internal fields and secrets absent: ✅"
            echo "- credentials/session tokens/internal payloads: not recorded"
            echo
            echo "### Verdict"
            echo "✅ Stage user workspace acceptance passed."
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-user-workspace-${{ github.run_id }}
          path: ${{ steps.acceptance.outputs.report }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence to SA-MVP-01D
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.acceptance.outputs.report }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 192,
              body: report.slice(0, 60000),
            });
