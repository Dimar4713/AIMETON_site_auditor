name: Site Auditor Burst Parallel Acceptance Command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

concurrency:
  group: site-auditor-burst-parallel-command
  cancel-in-progress: false

jobs:
  route:
    if: >-
      github.event.issue.number == 783 &&
      github.event.comment.user.login == 'Dimar4713' &&
      startsWith(github.event.comment.body, '/accept-burst-parallel-stage ')
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Parse exact SHA and dispatch provider-free parallel acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request
          body=os.environ['COMMENT_BODY'].strip()
          match=re.fullmatch(r'/accept-burst-parallel-stage ([0-9a-f]{40})', body)
          if not match:
              raise SystemExit('invalid burst parallel acceptance command')
          sha=match.group(1)
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'Content-Type':'application/json',
              'X-GitHub-Api-Version':'2022-11-28',
          }
          def api(method, path, payload=None):
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  data=None if payload is None else json.dumps(payload).encode('utf-8'),
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, (json.load(r) if r.status != 204 else None)
          _, commit=api('GET', f'commits/{sha}')
          _, main=api('GET', 'branches/main')
          current=main['commit']['sha']
          if sha != current:
              raise SystemExit(f'acceptance requires current main SHA {current}; requested {sha}')
          status,_=api(
              'POST',
              'actions/workflows/burst-runner-parallel-acceptance.yml/dispatches',
              {'ref':'main','inputs':{'expected_sha':sha,'evidence_issue':'783'}},
          )
          if status not in {200,204}:
              raise SystemExit(f'unexpected dispatch status {status}')
          print(f'dispatched burst parallel acceptance for exact main SHA {sha}')
          PY
