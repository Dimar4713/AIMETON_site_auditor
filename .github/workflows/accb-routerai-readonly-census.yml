name: ACCB RouterAI Read-Only Census

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact Site Auditor main SHA to census from
        required: true
        type: string
      evidence_issue:
        description: Issue receiving sanitized census evidence
        required: true
        default: "816"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: accb-routerai-readonly-census
  cancel-in-progress: false

jobs:
  census:
    name: Fresh GET-only RouterAI endpoint census
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    env:
      REQUESTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      GH_TOKEN: ${{ github.token }}
      WORKDIR: /tmp/aimeton-accb-readonly-census-${{ github.run_id }}
      RESULT_PATH: /tmp/aimeton-accb-readonly-census-${{ github.run_id }}.json

    steps:
      - name: Require exact main SHA and valid evidence issue
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ISSUE" =~ ^[0-9]+$ ]]
          test "$REQUESTED_SHA" = "$GITHUB_SHA"

      - name: Materialize exact commit without Marketplace actions
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$REQUESTED_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test -f scripts/accb_layer_b_no_paid_contract.py
          python3 -m py_compile \
            scripts/accb_layer_b_no_paid_contract.py \
            scripts/accb_routerai_readonly_census.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import accb_layer_b_no_paid_contract as contract
          assert contract.ARCHITECTURE_NO_PAID_MERGE_SHA == 'e8bdddf17cefad5304725567c2e4270aa5990442'
          print('token/seed no-paid prerequisite verified')
          PY

      - name: Execute fresh GET-only endpoint census
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$WORKDIR"
          env -u ROUTERAI_API_KEY python3 scripts/accb_routerai_readonly_census.py --output "$RESULT_PATH"

      - name: Enforce zero-generation census contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RESULT_PATH" "$REQUESTED_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          expected_sha = sys.argv[2]
          result = json.loads(path.read_text(encoding='utf-8'))
          assert result['status'] == 'FRESH_READ_ONLY_CENSUS'
          assert result['site_auditor_sha'] == expected_sha
          assert result['planned_cells'] == 15
          assert result['http_methods'] == ['GET']
          assert result['routerai_authorization_header_sent'] is False
          assert result['provider_generations_performed'] == 0
          assert result['paid_spend_authorized_rub'] == 0
          assert len(result['models']) == 5
          estimate = result['whole_tranche_conservative_estimate_rub']
          assert isinstance(estimate, (int, float)) and estimate > 0
          for row in result['models']:
              assert row['tag']
              assert row['transport'] in {'chat', 'responses'}
              assert row['context_length'] >= 524288 + 8192
              max_completion = row['max_completion_tokens']
              assert max_completion is None or max_completion >= 8192
              assert set(row['estimate']['anchors']) == {'32768', '131072', '524288'}
          print(json.dumps({'zero_generation_contract': 'PASS', 'whole_tranche_conservative_estimate_rub': estimate}, sort_keys=True))
          PY

      - name: Publish sanitized census evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RESULT_PATH" "$EVIDENCE_ISSUE" <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          issue = int(sys.argv[2])
          compact = {
              'schema_version': result['schema_version'],
              'status': result['status'],
              'timestamp': result['timestamp'],
              'site_auditor_sha': result['site_auditor_sha'],
              'architecture_prereg_merge_sha': result['architecture_prereg_merge_sha'],
              'architecture_no_paid_assembly_merge_sha': result['architecture_no_paid_assembly_merge_sha'],
              'anchors_tokens_nominal': result['anchors_tokens_nominal'],
              'max_output_tokens_per_cell': result['max_output_tokens_per_cell'],
              'planned_cells': result['planned_cells'],
              'whole_tranche_conservative_estimate_rub': result['whole_tranche_conservative_estimate_rub'],
              'pricing_policy': result['pricing_policy'],
              'http_methods': result['http_methods'],
              'routerai_authorization_header_sent': result['routerai_authorization_header_sent'],
              'provider_generations_performed': result['provider_generations_performed'],
              'paid_spend_authorized_rub': result['paid_spend_authorized_rub'],
              'models': [
                  {
                      'model': row['model'],
                      'provider_name': row['provider_name'],
                      'endpoint_tag': row['tag'],
                      'transport': row['transport'],
                      'context_length': row['context_length'],
                      'max_prompt_tokens': row['max_prompt_tokens'],
                      'max_completion_tokens': row['max_completion_tokens'],
                      'seed_advertised_fresh': row['seed_advertised_fresh'],
                      'estimate': row['estimate'],
                  }
                  for row in result['models']
              ],
              'scientific_boundary': result['scientific_boundary'],
          }
          body = (
              '## ACCB fresh read-only RouterAI census\n\n'
              f"- workflow run: `{os.environ.get('GITHUB_RUN_ID')}`\n"
              f"- exact Site Auditor SHA: `{result['site_auditor_sha']}`\n"
              '- RouterAI requests: `GET /models/.../endpoints` only\n'
              '- RouterAI Authorization header: `no`\n'
              '- provider generations: `0`\n'
              '- authorized spend: `0 RUB`\n'
              f"- fresh 15-cell conservative estimate: **{result['whole_tranche_conservative_estimate_rub']} RUB**\n\n"
              '```json\n' + json.dumps(compact, ensure_ascii=False, indent=2) + '\n```\n'
          )
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/issues/{issue}/comments'
          data = json.dumps({'body': body}, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              url,
              data=data,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              assert response.status in {200, 201}
          PY

      - name: Cleanup census workspace
        if: always()
        shell: bash
        run: rm -rf "$WORKDIR" "$RESULT_PATH"
