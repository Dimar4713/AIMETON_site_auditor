name: Normalize Operational Workflow Triggers

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: normalize-operational-workflow-triggers
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 164 && github.event.comment.body == '/normalize-operational-triggers' && github.event.comment.user.login == 'Dimar4713') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize approved operational workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/normalize_operational_workflow_triggers.py | tee normalization.txt

      - name: Validate trigger policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          deny = {
              'stage-retention.yml',
              'stage-observability.yml',
              'project-governance-audit.yml',
              'openstack-recovery-plan-auto.yml',
              'mcp-security-acceptance.yml',
              'project-actual-dates-apply.yml',
              'project-actual-dates-backfill.yml',
              'project-legacy-debt-transfer.yml',
              'project-historical-exceptions-apply.yml',
              'server-architecture-audit.yml',
              'provision-stage-mcp-token.yml',
          }
          for path in Path('.github/workflows').glob('*.yml'):
              if path.name not in deny:
                  continue
              head = path.read_text(encoding='utf-8').split('permissions:', 1)[0]
              assert '  issues:' not in head, f'broad issues trigger remains: {path}'
          print('trigger_policy=ok')
          PY

      - name: Commit normalized workflows
        id: commit
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'changed=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix: isolate operational workflows from issue lifecycle events'
          git push origin HEAD:main
          echo 'changed=yes' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized evidence
        if: always()
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              '## Operational workflow trigger normalization',
              '',
              `- workflow run: ${context.runId}`,
              `- repository changed: ${process.env.CHANGED || 'unknown'}`,
              `- commit: ${process.env.COMMIT_SHA || 'no-change'}`,
              '- policy: operational workflows no longer subscribe to broad issue lifecycle events',
              '- allowed lifecycle workflows remain separate',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 164,
              body,
            });
