name: Diagnose Netherlands Proxy Preflight

on:
  push:
    branches:
      - diag/stage-search-egress
    paths:
      - .github/workflows/diag-netherlands-proxy-preflight.yml

permissions:
  contents: read

jobs:
  proxy-preflight:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - stage
      - auditor
    timeout-minutes: 10
    steps:
      - name: Probe purchased proxy against neutral IP echo services
        shell: bash
        run: |
          set -Eeuo pipefail
          PROXY_IP='51.241.23.14'
          echo 'Testing common HTTP proxy ports without credentials.'
          found=0
          for port in 80 8080 3128 8000 8888; do
            echo "PROXY_PORT_TEST port=$port"
            out="$(curl -sS --connect-timeout 4 --max-time 10 -x "http://${PROXY_IP}:${port}" https://api.ipify.org 2>/dev/null || true)"
            if [[ "$out" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "PROXY_HTTP_OK port=$port egress_ip=$out"
              found=1
            else
              echo "PROXY_HTTP_FAIL port=$port"
            fi
          done

          echo 'Testing common SOCKS5 proxy port.'
          out="$(curl -sS --connect-timeout 4 --max-time 10 --socks5-hostname "${PROXY_IP}:1080" https://api.ipify.org 2>/dev/null || true)"
          if [[ "$out" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PROXY_SOCKS5_OK port=1080 egress_ip=$out"
            found=1
          else
            echo 'PROXY_SOCKS5_FAIL port=1080'
          fi

          if [[ "$found" -eq 0 ]]; then
            echo 'PROXY_PREFLIGHT_NO_STANDARD_PORT_FOUND'
            exit 2
          fi
