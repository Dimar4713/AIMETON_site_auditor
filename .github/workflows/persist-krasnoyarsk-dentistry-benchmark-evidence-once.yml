name: Persist Krasnoyarsk Dentistry Benchmark Evidence Once

on:
  push:
    branches:
      - docs/krasnoyarsk-dentistry-benchmark-evidence
    paths:
      - .github/workflows/persist-krasnoyarsk-dentistry-benchmark-evidence-once.yml

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVIDENCE_DIR: docs/evidence/search-benchmarks/2026-08-09-krasnoyarsk-dentistry
      TAVILY_ARTIFACT_ID: '9031753243'
      SEARXNG_ARTIFACT_ID: '9031751114'
      REPLAY_ARTIFACT_ID: '9031786153'
      WORKFLOW_PATH: .github/workflows/persist-krasnoyarsk-dentistry-benchmark-evidence-once.yml
    steps:
      - name: Checkout clean evidence branch
        uses: actions/checkout@v4
        with:
          ref: docs/krasnoyarsk-dentistry-benchmark-evidence
          fetch-depth: 0

      - name: Download exact Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$output"
          }
          download_artifact "$TAVILY_ARTIFACT_ID" "$EVIDENCE_DIR/tavily-snapshot.zip"
          download_artifact "$SEARXNG_ARTIFACT_ID" "$EVIDENCE_DIR/searxng-snapshot.zip"
          download_artifact "$REPLAY_ARTIFACT_ID" "$EVIDENCE_DIR/two-provider-replay.zip"

      - name: Extract structured benchmark results
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -q "$EVIDENCE_DIR/two-provider-replay.zip" -d "$tmp"
          cp "$tmp/benchmark.json" "$EVIDENCE_DIR/benchmark.json"
          cp "$tmp/replay.log" "$EVIDENCE_DIR/replay.log"
          cp "$tmp/summary.md" "$EVIDENCE_DIR/summary.md"

      - name: Verify exact evidence hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$EVIDENCE_DIR"
          sha256sum -c SHA256SUMS.txt

      - name: Commit evidence and remove one-shot transport workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EVIDENCE_DIR"
          git rm "$WORKFLOW_PATH"
          git commit -m "Persist Krasnoyarsk dentistry benchmark evidence"
          git push origin HEAD:docs/krasnoyarsk-dentistry-benchmark-evidence
