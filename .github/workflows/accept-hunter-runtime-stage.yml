name: Accept Hunter Runtime Stage

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA to inspect
        required: true
        type: string
      expected_tariff:
        description: Expected active Hunter tariff
        required: false
        default: max
        type: string
      expected_strategy:
        description: Expected configured admin-projected search strategy
        required: false
        default: exhaustive_coverage
        type: string
      expected_provider_order:
        description: Expected configured admin-projected provider order, comma separated
        required: false
        default: searxng,yandex
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-accept-hunter-runtime-stage
  cancel-in-progress: false

jobs:
  accept:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      REPORT: /tmp/hunter-runtime-stage-${{ github.run_id }}.md

    steps:
      - name: Verify exact deployed SHA and healthy auditor
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ inputs.expected_sha }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$expected" ]]
          [[ "$status" == healthy ]]
          {
            echo '## Hunter runtime Stage acceptance'
            echo
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' "- deployed source SHA: \`$deployed\`"
            printf '%s\n' "- stage auditor status: \`$status\`"
          } > "$REPORT"

      - name: Inspect configured projection and resolver execution authority without provider calls
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(docker exec \
            -e EXPECTED_TARIFF='${{ inputs.expected_tariff }}' \
            -e EXPECTED_STRATEGY='${{ inputs.expected_strategy }}' \
            -e EXPECTED_PROVIDER_ORDER='${{ inputs.expected_provider_order }}' \
            -i "$CONTAINER" python - <<'PY'
          import json
          import os

          from app.admin_search_strategy_api import _execution_policy_observation
          from app.hunter_search_policy_authority import resolve_hunter_search_policy
          from app.models import HuntRequest
          from app.search_gateway import search_policy_from_env
          from app.search_strategy_settings import get_search_strategy_settings_repository

          record = get_search_strategy_settings_repository().get()
          settings = record.settings
          global_settings = settings.global_settings
          profile = settings.active_profile()
          observation = _execution_policy_observation(record)
          projected = observation['projected_admin_gateway_policy']
          actual = observation['actual_gateway_policy']
          authority_resolution = resolve_hunter_search_policy(base_policy=search_policy_from_env())
          effective_hunt = settings.apply_hunt_request(
              HuntRequest(region='runtime-inspection', industries=['runtime-inspection'])
          )

          expected_tariff = os.environ['EXPECTED_TARIFF'].strip()
          expected_strategy = os.environ['EXPECTED_STRATEGY'].strip()
          expected_order = [
              item.strip()
              for item in os.environ['EXPECTED_PROVIDER_ORDER'].split(',')
              if item.strip()
          ]

          assert global_settings.active_tariff == expected_tariff, {
              'expected_tariff': expected_tariff,
              'actual_tariff': global_settings.active_tariff,
          }
          assert projected['strategy'] == expected_strategy, {
              'expected_projected_strategy': expected_strategy,
              'actual_projected_strategy': projected['strategy'],
          }
          assert projected['provider_order'] == expected_order, {
              'expected_projected_provider_order': expected_order,
              'actual_projected_provider_order': projected['provider_order'],
          }
          assert authority_resolution.authority.value == 'env', authority_resolution.authority
          assert authority_resolution.selected_policy_fingerprint == actual['fingerprint']
          assert authority_resolution.env_policy_fingerprint == actual['fingerprint']
          assert authority_resolution.admin_projection_fingerprint is None
          assert authority_resolution.admin_policy_persisted is False
          assert observation['runtime_callsite_uses_admin_projection'] is False
          assert observation['routing_changed_by_observation'] is False
          assert actual['fingerprint'].startswith('sha256:')
          assert projected['fingerprint'].startswith('sha256:')
          assert observation['configured_admin_policy_fingerprint'].startswith('sha256:')
          assert observation['quality_policy_fingerprint'].startswith('sha256:')

          safe = {
              'active_tariff': global_settings.active_tariff,
              'profile_strategy': str(profile.strategy) if profile.strategy is not None else None,
              'emergency_strategy_override': (
                  str(global_settings.emergency_strategy_override)
                  if global_settings.emergency_strategy_override is not None
                  else None
              ),
              'runtime_authority': authority_resolution.authority.value,
              'resolver_selected_policy_fingerprint': authority_resolution.selected_policy_fingerprint,
              'actual_gateway_policy': actual,
              'projected_admin_gateway_policy': projected,
              'policy_equivalent': observation['policy_equivalent'],
              'runtime_callsite_uses_admin_projection': observation['runtime_callsite_uses_admin_projection'],
              'routing_changed_by_observation': observation['routing_changed_by_observation'],
              'configured_admin_policy_fingerprint': observation['configured_admin_policy_fingerprint'],
              'quality_policy_fingerprint': observation['quality_policy_fingerprint'],
              'hunter_limits_after_admin_settings': {
                  'max_queries': effective_hunt.max_queries,
                  'results_per_query': effective_hunt.results_per_query,
                  'max_candidates': effective_hunt.max_candidates,
                  'output_limit': effective_hunt.output_limit,
                  'minimum_pre_score': effective_hunt.minimum_pre_score,
                  'deep_audit_score': effective_hunt.deep_audit_score,
                  'concurrency': effective_hunt.concurrency,
              },
              'settings_updated_at': record.updated_at,
              'settings_reason': record.reason,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY
          )"
          {
            echo
            echo '### Hunter policy provenance'
            echo
            echo '```json'
            echo "$result"
            echo '```'
            echo
            echo '- provider calls: `0`'
            echo '- configured admin projection checked against expected Stage product settings: ✅'
            echo '- canonical resolver runtime authority: `env` ✅'
            echo '- resolver selected fingerprint equals actual SearchGateway env policy: ✅'
            echo '- admin projection remains configured/observational and is not activated by this acceptance.'
            echo '- routing changed by acceptance: `false`'
            echo '- verdict: ✅ configured projection and resolver execution authority are distinguished without provider calls.'
          } | tee -a "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-runtime-stage-${{ github.run_id }}
          path: ${{ env.REPORT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish evidence to P1-501
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ env.REPORT }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const fs = require('fs');
            const path = process.env.REPORT_PATH;
            const body = path && fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `## Hunter runtime Stage acceptance\n\nWorkflow ${context.runId} failed before sanitized evidence was produced.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 501,
              body: body.slice(0, 60000),
            });
