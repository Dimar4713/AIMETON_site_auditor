name: Accept Hunter Runtime Stage

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA to inspect
        required: true
        type: string
      expected_tariff:
        description: Expected active Hunter tariff
        required: false
        default: max
        type: string
      expected_strategy:
        description: Expected canonical admin search strategy
        required: false
        default: exhaustive_coverage
        type: string
      expected_provider_order:
        description: Expected canonical admin provider order, comma separated
        required: false
        default: searxng,yandex
        type: string
      expected_effective_policy_fingerprint:
        description: Provider-effective policy fingerprint that must survive the authority migration
        required: false
        default: 'sha256:63151511b45bd2ba687dc12fa9a903485583671e45ff70ae3dff14beaf2bf285'
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-accept-hunter-runtime-stage
  cancel-in-progress: false

jobs:
  accept:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      REPORT: /tmp/hunter-runtime-stage-${{ github.run_id }}.md

    steps:
      - name: Verify exact deployed SHA and healthy auditor
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ inputs.expected_sha }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$expected" ]]
          [[ "$status" == healthy ]]
          {
            echo '## Hunter runtime Stage acceptance'
            echo
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' "- deployed source SHA: \`$deployed\`"
            printf '%s\n' "- stage auditor status: \`$status\`"
          } > "$REPORT"

      - name: Inspect single authority, effective policy, and provider lifecycle without provider calls
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(docker exec \
            -e EXPECTED_TARIFF='${{ inputs.expected_tariff }}' \
            -e EXPECTED_STRATEGY='${{ inputs.expected_strategy }}' \
            -e EXPECTED_PROVIDER_ORDER='${{ inputs.expected_provider_order }}' \
            -e EXPECTED_EFFECTIVE_POLICY_FINGERPRINT='${{ inputs.expected_effective_policy_fingerprint }}' \
            -i "$CONTAINER" python - <<'PY'
          import json
          import os

          from app.admin_search_strategy_api import _execution_policy_observation
          from app.models import HuntRequest
          from app.search_strategy_settings import get_search_strategy_settings_repository

          record = get_search_strategy_settings_repository().get()
          settings = record.settings
          global_settings = settings.global_settings
          profile = settings.active_profile()
          observation = _execution_policy_observation(record)
          projected = observation['projected_admin_gateway_policy']
          actual = observation['actual_gateway_policy']
          selected = observation['selected_gateway_policy']
          gateway_effective = observation['gateway_effective_policy']
          admin_candidate = observation['admin_candidate_gateway_policy']
          lifecycle = observation['provider_lifecycle']
          by_provider = {item['provider']: item for item in lifecycle}
          effective_hunt = settings.apply_hunt_request(
              HuntRequest(region='runtime-inspection', industries=['runtime-inspection'])
          )

          expected_tariff = os.environ['EXPECTED_TARIFF'].strip()
          expected_strategy = os.environ['EXPECTED_STRATEGY'].strip()
          expected_order = [
              item.strip()
              for item in os.environ['EXPECTED_PROVIDER_ORDER'].split(',')
              if item.strip()
          ]
          expected_fingerprint = os.environ['EXPECTED_EFFECTIVE_POLICY_FINGERPRINT'].strip()

          assert global_settings.active_tariff == expected_tariff
          assert projected['strategy'] == expected_strategy
          assert projected['provider_order'] == expected_order
          assert projected['fingerprint'] == expected_fingerprint

          # Persisted ADMIN settings are the one canonical Hunter routing authority.
          assert observation['runtime_authority'] == 'admin'
          assert observation['runtime_callsite_uses_admin_projection'] is True
          assert selected == projected
          assert observation['selected_policy_fingerprint'] == projected['fingerprint']

          # TracedSearchGateway is provenance-only. It must not mutate policy after
          # canonical resolution, and the provider-effective fingerprint must remain
          # exactly the pre-migration Stage fingerprint.
          assert observation['legacy_hunter_admin_projection_applied'] is False
          assert observation['gateway_policy_changed_after_authority_resolution'] is False
          assert gateway_effective == selected
          assert observation['gateway_effective_policy_fingerprint'] == observation['selected_policy_fingerprint']
          assert observation['gateway_effective_policy_fingerprint'] == expected_fingerprint

          assert observation['admin_candidate_available'] is True
          assert observation['admin_candidate_matches_projection'] is True
          assert admin_candidate == selected
          assert observation['admin_candidate_policy_fingerprint'] == expected_fingerprint

          # The ENV-derived policy is still observed as the capability/budget base,
          # but it is no longer a competing routing authority on this Stage state.
          assert actual['fingerprint'].startswith('sha256:')
          assert observation['policy_equivalent'] is False
          assert actual['fingerprint'] != expected_fingerprint

          # Provider lifecycle follows the single effective policy. Tavily stays
          # integrated and configured, but is deliberately disabled/inactive by
          # current ADMIN settings; acceptance performs no provider calls.
          assert set(by_provider) == {'searxng', 'yandex', 'tavily'}
          assert all(item['registered'] is True for item in lifecycle)
          assert all(item['availability'] == 'unknown' for item in lifecycle)
          assert all(item['availability_evidence'] == 'not_observed' for item in lifecycle)
          assert by_provider['tavily']['configured'] is True
          assert by_provider['tavily']['admin_enabled'] is False
          assert by_provider['tavily']['enabled'] is False
          assert by_provider['tavily']['active'] is False
          expected_admin_position = (
              profile.provider_order.index('tavily') + 1
              if 'tavily' in profile.provider_order else None
          )
          assert by_provider['tavily']['admin_position'] == expected_admin_position
          assert by_provider['tavily']['runtime_position'] is None

          assert observation['routing_changed_by_observation'] is False
          assert observation['configured_admin_policy_fingerprint'].startswith('sha256:')
          assert observation['quality_policy_fingerprint'].startswith('sha256:')

          safe = {
              'active_tariff': global_settings.active_tariff,
              'profile_strategy': str(profile.strategy) if profile.strategy is not None else None,
              'runtime_authority': observation['runtime_authority'],
              'selected_gateway_policy': selected,
              'selected_policy_fingerprint': observation['selected_policy_fingerprint'],
              'gateway_effective_policy': gateway_effective,
              'gateway_effective_policy_fingerprint': observation['gateway_effective_policy_fingerprint'],
              'expected_pre_migration_effective_policy_fingerprint': expected_fingerprint,
              'legacy_hunter_admin_projection_applied': observation['legacy_hunter_admin_projection_applied'],
              'gateway_policy_changed_after_authority_resolution': observation['gateway_policy_changed_after_authority_resolution'],
              'actual_gateway_policy': actual,
              'projected_admin_gateway_policy': projected,
              'admin_candidate_available': observation['admin_candidate_available'],
              'admin_candidate_gateway_policy': admin_candidate,
              'admin_candidate_policy_fingerprint': observation['admin_candidate_policy_fingerprint'],
              'admin_candidate_matches_projection': observation['admin_candidate_matches_projection'],
              'provider_lifecycle': lifecycle,
              'policy_equivalent': observation['policy_equivalent'],
              'runtime_callsite_uses_admin_projection': observation['runtime_callsite_uses_admin_projection'],
              'routing_changed_by_observation': observation['routing_changed_by_observation'],
              'configured_admin_policy_fingerprint': observation['configured_admin_policy_fingerprint'],
              'quality_policy_fingerprint': observation['quality_policy_fingerprint'],
              'hunter_limits_after_admin_settings': {
                  'max_queries': effective_hunt.max_queries,
                  'results_per_query': effective_hunt.results_per_query,
                  'max_candidates': effective_hunt.max_candidates,
                  'output_limit': effective_hunt.output_limit,
                  'minimum_pre_score': effective_hunt.minimum_pre_score,
                  'deep_audit_score': effective_hunt.deep_audit_score,
                  'concurrency': effective_hunt.concurrency,
              },
              'settings_updated_at': record.updated_at,
              'settings_reason': record.reason,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY
          )"
          {
            echo
            echo '### Hunter single policy authority and provider lifecycle'
            echo
            echo '```json'
            echo "$result"
            echo '```'
            echo
            echo '- provider calls: `0`'
            echo '- canonical resolver authority: `admin` ✅'
            echo '- resolver-selected policy equals persisted admin projection: ✅'
            echo '- TracedSearchGateway policy mutation after resolver: `false` ✅'
            echo '- provider-effective fingerprint preserved across migration: ✅'
            echo '- all canonical providers remain registered: ✅'
            echo '- Tavily remains configured but admin-disabled/inactive: ✅'
            echo '- network availability not guessed without evidence: ✅'
            echo '- routing changed by acceptance: `false`'
          } | tee -a "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Preserve sanitized evidence in job summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f "$REPORT" ]]; then
            {
              echo
              echo '### Durable acceptance report'
              echo
              cat "$REPORT"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish evidence to P1-501 without marketplace actions
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          payload="$(mktemp)"
          REPORT_PATH="$REPORT" python3 - <<'PY' > "$payload"
          import json
          import os

          path = os.environ['REPORT_PATH']
          if os.path.exists(path):
              with open(path, encoding='utf-8') as handle:
                  body = handle.read()
          else:
              body = (
                  '## Hunter runtime Stage acceptance\n\n'
                  f"Workflow {os.environ.get('GITHUB_RUN_ID', 'unknown')} failed before sanitized evidence was produced."
              )
          print(json.dumps({'body': body[:60000]}, ensure_ascii=False))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/501/comments" \
            --data-binary "@$payload"
          rm -f "$payload"
