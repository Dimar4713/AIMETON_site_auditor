name: Force Cancel BIS Ghost Run

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cancel-bis-ghost-run.yml'

permissions:
  contents: read

jobs:
  cancel:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 5
    env:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      TARGET_RUN_ID: '31870572999'
    steps:
      - name: Force-cancel superseded BIS CI run
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTOR}" = "Dimar4713"
          test -n "${PROJECTS_TOKEN}"
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${PROJECTS_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/Dimar4713/BIS-N-EC/actions/runs/${TARGET_RUN_ID}/force-cancel")"
          echo "force_cancel_http_status=${code}"
          case "${code}" in
            202|409) ;;
            *) exit 1 ;;
          esac
