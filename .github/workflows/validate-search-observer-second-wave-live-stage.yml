name: Validate Search Observer Second-Wave Live Stage

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed commit SHA
        required: true
        type: string
      allow_paid_calls:
        description: Explicit owner authorization for bounded live provider calls
        required: true
        default: false
        type: boolean
      owner_spend_authorized:
        description: Owner explicitly authorized this bounded spend mission
        required: true
        default: false
        type: boolean
      max_budget_rub:
        description: Hard total measured search budget cap, never above 100 RUB
        required: true
        default: '100'
        type: string

permissions:
  contents: read

concurrency:
  group: search-observer-live-second-wave-stage
  cancel-in-progress: false

jobs:
  live-second-wave:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 30
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EVIDENCE_DIR: /tmp/search-observer-live-second-wave
    steps:
      - name: Require exact SHA and owner spend authorization
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ inputs.expected_sha }}'
          budget='${{ inputs.max_budget_rub }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          [[ '${{ inputs.allow_paid_calls }}' == 'true' ]]
          [[ '${{ inputs.owner_spend_authorized }}' == 'true' ]]
          cd "$STACK_DIR"
          [[ "$(cat app-source-sha.txt)" == "$expected" ]]
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$status" == healthy ]]
          docker exec -i -w /app -e PYTHONPATH=/app -e BUDGET="$budget" "$CONTAINER" python - <<'PY'
          import os
          from decimal import Decimal
          from scripts.search_observer_live_second_wave import parse_budget_rub
          value = parse_budget_rub(os.environ['BUDGET'])
          if value > Decimal('100'):
              raise SystemExit('authorized_budget_exceeds_owner_cap')
          print(f'authorized_budget_rub={value}')
          PY

      - name: Execute bounded live shadow counterfactual validation
        shell: bash
        run: |
          set -Eeuo pipefail
          budget='${{ inputs.max_budget_rub }}'
          docker exec "$CONTAINER" sh -lc "rm -rf '$EVIDENCE_DIR' && mkdir -p '$EVIDENCE_DIR'"
          docker exec \
            -w /app \
            -e PYTHONPATH=/app \
            -e HUNTER_SEARCH_OBSERVER_SHADOW_ENABLED=true \
            "$CONTAINER" \
            python -m scripts.search_observer_live_second_wave \
              --budget-rub "$budget" \
              --output "$EVIDENCE_DIR/evidence.json"

      - name: Capture sanitized Observer diagnostics
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i -w /app -e PYTHONPATH=/app "$CONTAINER" python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          db_path = os.getenv('AIMETON_RUNTIME_DB', 'data/runtime-core.sqlite3')
          db = sqlite3.connect(db_path, timeout=30)
          db.row_factory = sqlite3.Row
          try:
              rows = db.execute(
                  '''
                  SELECT mission_id, attempt_id, metadata_json
                  FROM mission_trace_events
                  WHERE component = 'hunter'
                    AND operation = 'hunt_search_wave_shadow_observer'
                  ORDER BY rowid DESC
                  LIMIT 2
                  '''
              ).fetchall()
          finally:
              db.close()

          keys = (
              'observer_outcome', 'schema_valid', 'observer_recommendation_count',
              'action_counts', 'recommendations', 'sufficient_evidence',
              'observer_latency_ms', 'profile_name', 'provider', 'model', 'tier',
              'routing_changed', 'later_observation_state',
          )
          payload = []
          for row in rows:
              metadata = json.loads(row['metadata_json'])
              payload.append({
                  'mission_id': row['mission_id'],
                  'attempt_id': row['attempt_id'],
                  **{key: metadata.get(key) for key in keys},
              })
          path = Path('/tmp/search-observer-live-second-wave/observer-diagnostics.json')
          path.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2), encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

      - name: Verify scored evidence and budget invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          budget='${{ inputs.max_budget_rub }}'
          docker exec -i -w /app -e PYTHONPATH=/app -e BUDGET="$budget" "$CONTAINER" python - <<'PY'
          import json
          import os
          from decimal import Decimal
          from pathlib import Path

          path = Path('/tmp/search-observer-live-second-wave/evidence.json')
          evidence = json.loads(path.read_text(encoding='utf-8'))
          authorized = Decimal(os.environ['BUDGET'])
          actual = Decimal(evidence['measured_search_cost_rub'])

          checks = {
              'authorized_budget_within_owner_cap': authorized <= Decimal('100'),
              'actual_cost_within_authorized_budget': actual <= authorized,
              'incremental_query_bound': evidence.get('max_incremental_queries', 999) <= 4,
              'observer_has_no_routing_authority': evidence.get('observer_routing_authority') is False,
              'premium_escalation_disabled': evidence.get('premium_escalation') is False,
              'routing_unchanged': evidence.get('routing_changed_any') is False,
              'validation_scored': evidence.get('validation_state') == 'scored',
          }
          outcomes = [
              outcome
              for scenario in evidence.get('scenarios', [])
              for outcome in scenario.get('outcomes', [])
          ]
          checks['outcome_count_bounded'] = 1 <= len(outcomes) <= 4
          checks['all_outcomes_routing_unchanged'] = all(
              item.get('score', {}).get('routing_changed') is False for item in outcomes
          )

          failed = [name for name, ok in checks.items() if not ok]
          summary = {
              'validation_state': evidence.get('validation_state'),
              'outcome_count': len(outcomes),
              'actual_search_cost_rub': str(actual),
              'authorized_budget_rub': str(authorized),
              'failed_checks': failed,
          }
          print(json.dumps(summary, sort_keys=True))
          if failed:
              raise SystemExit('live_validation_fail_closed:' + ','.join(failed))
          PY

      - name: Collect live evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/search-observer-live-second-wave"
          mkdir -p "$RUNNER_TEMP/search-observer-live-second-wave"
          for name in evidence.json observer-diagnostics.json; do
            if docker exec "$CONTAINER" test -f "$EVIDENCE_DIR/$name"; then
              docker cp "$CONTAINER:$EVIDENCE_DIR/$name" "$RUNNER_TEMP/search-observer-live-second-wave/$name"
            fi
          done

      - name: Upload live second-wave evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-observer-live-second-wave-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/search-observer-live-second-wave/*.json
          if-no-files-found: warn
          retention-days: 30
