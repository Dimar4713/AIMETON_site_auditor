name: Stage Mission Diagnostics

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA to diagnose
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-stage-mission-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      STAGE_URL: https://stage-auditor.aimeton.ru

    steps:
      - name: Collect sanitized Stage admission diagnostics
        id: diagnostics
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set +e
          report="$RUNNER_TEMP/stage-mission-diagnostics.md"
          expected="$EXPECTED_SHA"
          expected_valid=no
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] && expected_valid=yes

          deployed_sha="$(tr -d '[:space:]' < "$STACK_DIR/app-source-sha.txt" 2>/dev/null || echo unavailable)"
          container_state="$(docker inspect --format '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo unavailable)"
          health_state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' "$CONTAINER" 2>/dev/null || echo unavailable)"
          exact_sha_match=no
          [[ "$expected_valid" == yes && "$deployed_sha" == "$expected" ]] && exact_sha_match=yes

          convergence_raw="$(curl --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence" 2>/dev/null || true)"
          convergence_safe="$(python3 - "$convergence_raw" "$expected" <<'PY'
          import json, re, sys
          raw, expected = sys.argv[1], sys.argv[2]
          try:
              payload = json.loads(raw)
          except Exception:
              print('readable=no;state=unavailable;deployment_sha_match=no;marker_sha_match=no;runtime_instance_match=no;secrets_exposed=unknown;marker_error=unknown;checks=0')
              raise SystemExit(0)
          runtime_id = str(payload.get('runtime_instance_id') or '')
          marker_runtime_id = str(payload.get('marker_runtime_instance_id') or '')
          checks = payload.get('checks')
          fields = {
              'readable': 'yes',
              'state': re.sub(r'[^A-Za-z0-9_.:+-]', '_', str(payload.get('state') or 'none'))[:64],
              'deployment_sha_match': 'yes' if payload.get('deployment_sha') == expected else 'no',
              'marker_sha_match': 'yes' if payload.get('marker_deployment_sha') == expected else 'no',
              'runtime_instance_match': 'yes' if runtime_id and runtime_id == marker_runtime_id else 'no',
              'secrets_exposed': str(payload.get('secrets_exposed')).lower(),
              'marker_error': 'none' if payload.get('marker_error') is None else 'present',
              'checks': str(len(checks) if isinstance(checks, list) else 0),
          }
          print(';'.join(f'{k}={v}' for k, v in fields.items()))
          PY
          )"

          routerai_trace="$(docker exec -i "$CONTAINER" python - <<'PY' 2>/dev/null
          import json, os, re, sqlite3
          from pathlib import Path
          def safe(value, limit=128):
              text = '' if value is None else str(value)
              return re.sub(r'[^A-Za-z0-9_.:+-]', '_', text)[:limit] or 'none'
          path = Path(os.environ.get('AIMETON_TRACE_DB', os.environ.get('AIMETON_RUNTIME_DB', '/app/data/runtime-core.sqlite3')))
          if not path.exists():
              print('present=no;reason=trace_db_missing')
              raise SystemExit(0)
          try:
              with sqlite3.connect(f'file:{path}?mode=ro', uri=True) as db:
                  db.row_factory = sqlite3.Row
                  rows = db.execute("""
                      SELECT duration_ms, metadata_json, created_at
                      FROM mission_trace_events
                      WHERE component='llm_synthesis' AND operation='llm_finished' AND state='failed'
                      ORDER BY created_at DESC LIMIT 50
                  """).fetchall()
          except Exception as exc:
              print(f'present=no;reason=trace_read_{safe(type(exc).__name__)}')
              raise SystemExit(0)
          for row in rows:
              try:
                  metadata = json.loads(row['metadata_json'] or '{}')
              except Exception:
                  continue
              if isinstance(metadata, dict) and metadata.get('failed_phase'):
                  print(';'.join([
                      'present=yes',
                      f"created_at={safe(row['created_at'],64)}",
                      f"duration_ms={safe(row['duration_ms'],32)}",
                      f"failed_phase={safe(metadata.get('failed_phase'))}",
                      f"phase_error_type={safe(metadata.get('phase_error_type'))}",
                      f"synthesis_mode={safe(metadata.get('synthesis_mode'))}",
                  ]))
                  raise SystemExit(0)
          print('present=no;reason=no_failed_phase_event')
          PY
          )"

          {
            echo '## Stage mission diagnostics'
            echo
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- expected SHA valid: \`$expected_valid\`"
            echo "- expected SHA: \`$expected\`"
            echo "- deployed source SHA: \`$deployed_sha\`"
            echo "- exact SHA match: \`$exact_sha_match\`"
            echo "- container state: \`$container_state\`"
            echo "- health state: \`$health_state\`"
            echo "- convergence: \`${convergence_safe:-unavailable}\`"
            echo "- latest failed RouterAI phase trace: \`${routerai_trace:-unavailable}\`"
            echo '- provider/LLM calls performed: `no`'
            echo '- prompt/response/source payloads collected: `no`'
            echo '- credentials/tokens collected: `no`'
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized diagnostics to issue 177 without Marketplace actions
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.diagnostics.outputs.report }}
        run: |
          set -Eeuo pipefail
          test -f "$REPORT_PATH"
          payload="$(python3 -c 'import json,sys; print(json.dumps({"body": open(sys.argv[1], encoding="utf-8").read()}))' "$REPORT_PATH")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/177/comments" \
            -d "$payload"
