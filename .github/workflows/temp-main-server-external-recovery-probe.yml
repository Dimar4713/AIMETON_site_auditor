name: TEMP Main Server External Recovery Probe

on:
  pull_request:
    paths:
      - ".github/workflows/temp-main-server-external-recovery-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAIN_SERVER_IP: "195.209.215.159"
      EXPECTED_CLIENT_FP: "SHA256:I8bLulMQeitgZVghJe3MJwEVQvvsqtJt4O3aZbOQZLg"
      RECOVERY_KEY: ${{ secrets.AIMETON_WORKSTATION_SSH_PRIVATE_KEY }}
    steps:
      - name: Probe external reachability and recovery credential metadata only
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "execution_lane=github-hosted"
          echo "main_server_ip=$MAIN_SERVER_IP"
          for host in github.com api.github.com codeload.github.com api.immers.cloud; do
            if getent ahostsv4 "$host" >/tmp/dns.$$ 2>/dev/null; then
              echo "dns=$host status=resolved first_ipv4=$(awk 'NR==1{print $1}' /tmp/dns.$$)"
            else
              echo "dns=$host status=failed"
            fi
          done
          rm -f /tmp/dns.$$
          if timeout 8 bash -c "</dev/tcp/$MAIN_SERVER_IP/22" 2>/dev/null; then echo "ssh_tcp_22=reachable"; else echo "ssh_tcp_22=unreachable"; fi
          hostscan="$(mktemp)"
          ssh-keyscan -T 8 -t ed25519,rsa "$MAIN_SERVER_IP" >"$hostscan" 2>/dev/null || true
          if [[ -s "$hostscan" ]]; then
            ssh-keygen -lf "$hostscan" -E sha256 | awk '{print "observed_hostkey_bits="$1" observed_hostkey_fp="$2" observed_hostkey_type="$4}'
          else
            echo "observed_hostkey=none"
          fi
          rm -f "$hostscan"
          secret_present=false; client_fp=""; client_fp_match=false
          if [[ -n "${RECOVERY_KEY:-}" ]]; then
            secret_present=true; keyfile="$(mktemp)"; trap 'rm -f "$keyfile"' EXIT; umask 077
            printf '%s\n' "$RECOVERY_KEY" >"$keyfile"; unset RECOVERY_KEY
            pub="$(ssh-keygen -y -P '' -f "$keyfile" 2>/dev/null || true)"
            if [[ -n "$pub" ]]; then client_fp="$(printf '%s\n' "$pub" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"; [[ "$client_fp" == "$EXPECTED_CLIENT_FP" ]] && client_fp_match=true; fi
            rm -f "$keyfile"; trap - EXIT
          fi
          echo "recovery_secret_present=$secret_present"
          echo "recovery_client_fp=${client_fp:-none}"
          echo "recovery_client_fp_match=$client_fp_match"
          echo "ssh_auth_attempted=false"
          echo "server_mutation=false"
          echo "provider_mutation=false"

  provider-recovery:
    runs-on: ubuntu-latest
    environment: stage
    timeout-minutes: 12
    env:
      MAIN_SERVER_IP: "195.209.215.159"
      EXPECTED_SERVER_ID: "b880085c-a31f-4cd5-9ed5-e009000179e7"
      OS_AUTH_URL: ${{ secrets.OS_AUTH_URL || vars.OS_AUTH_URL || 'https://api.immers.cloud:5000/v3' }}
      OS_APPLICATION_CREDENTIAL_ID: ${{ secrets.OS_APPLICATION_CREDENTIAL_ID || vars.OS_APPLICATION_CREDENTIAL_ID }}
      OS_APPLICATION_CREDENTIAL_SECRET: ${{ secrets.OS_APPLICATION_CREDENTIAL_SECRET }}
    steps:
      - name: Guard one bounded owner recovery execution
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.repository }}" = "Dimar4713/AIMETON_site_auditor"
          test "${{ github.event.pull_request.number }}" = "845"
          test "${{ github.event.pull_request.head.ref }}" = "ops/temp-main-server-external-recovery-probe-20260827"
          test "${{ github.actor }}" = "Dimar4713"
          test "${{ github.run_attempt }}" = "1"
          test -n "${OS_APPLICATION_CREDENTIAL_ID:-}"
          test -n "${OS_APPLICATION_CREDENTIAL_SECRET:-}"
          echo "bounded_recovery_guard=pass"

      - name: Install read/write provider client
        shell: bash
        run: python3 -m pip install --disable-pip-version-check -q 'openstacksdk>=4,<5'

      - name: Read exact server pre-state and issue one SOFT reboot
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          from openstack.connection import Connection

          conn = Connection(
              auth_url=os.environ['OS_AUTH_URL'],
              auth_type='v3applicationcredential',
              application_credential_id=os.environ['OS_APPLICATION_CREDENTIAL_ID'],
              application_credential_secret=os.environ['OS_APPLICATION_CREDENTIAL_SECRET'],
          )
          expected_id=os.environ['EXPECTED_SERVER_ID']
          expected_ip=os.environ['MAIN_SERVER_IP']
          srv=conn.compute.get_server(expected_id)
          raw=srv.to_dict()
          addresses=raw.get('addresses') or {}
          ips=sorted({e.get('addr') for entries in addresses.values() for e in (entries or []) if isinstance(e,dict) and e.get('addr')})
          pre={
              'id':raw.get('id'),'name':raw.get('name'),'status':raw.get('status'),
              'task_state':raw.get('task_state') or raw.get('OS-EXT-STS:task_state'),
              'vm_state':raw.get('vm_state') or raw.get('OS-EXT-STS:vm_state'),
              'power_state':raw.get('power_state') or raw.get('OS-EXT-STS:power_state'),
              'ips':ips,'updated_at':str(raw.get('updated_at') or raw.get('updated') or ''),
          }
          print('pre_state='+json.dumps(pre,sort_keys=True))
          assert pre['id']==expected_id
          assert pre['name']=='aimeton-main-server'
          assert expected_ip in ips
          assert pre['status']=='ACTIVE'
          assert pre['task_state'] in (None,'None','')
          assert str(pre['vm_state']).lower()=='active'
          receipt={'pre':pre,'write_attempted':True,'write_kind':'SOFT_REBOOT','write_result':None,'write_error_class':None}
          try:
              conn.compute.reboot_server(srv, reboot_type='SOFT')
              receipt['write_result']='request_returned'
          except Exception as exc:
              receipt['write_result']='exception_ambiguous_no_retry'
              receipt['write_error_class']=type(exc).__name__
          pathlib.Path('/tmp/main-server-soft-reboot-receipt.json').write_text(json.dumps(receipt,sort_keys=True),encoding='utf-8')
          print('soft_reboot_write_attempted=true')
          print('soft_reboot_write_result='+str(receipt['write_result']))
          print('write_retry_performed=false')
          PY

      - name: Authoritative provider and SSH readback only
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, socket, time
          from openstack.connection import Connection

          conn=Connection(
              auth_url=os.environ['OS_AUTH_URL'],
              auth_type='v3applicationcredential',
              application_credential_id=os.environ['OS_APPLICATION_CREDENTIAL_ID'],
              application_credential_secret=os.environ['OS_APPLICATION_CREDENTIAL_SECRET'],
          )
          server_id=os.environ['EXPECTED_SERVER_ID']; ip=os.environ['MAIN_SERVER_IP']
          receipt_path=pathlib.Path('/tmp/main-server-soft-reboot-receipt.json')
          receipt=json.loads(receipt_path.read_text()) if receipt_path.exists() else {'write_result':'receipt_missing'}
          pre_updated=(receipt.get('pre') or {}).get('updated_at')
          observed=[]; active=False
          deadline=time.time()+300
          while time.time()<deadline:
              srv=conn.compute.get_server(server_id); raw=srv.to_dict()
              state={
                  'status':raw.get('status'),
                  'task_state':raw.get('task_state') or raw.get('OS-EXT-STS:task_state'),
                  'vm_state':raw.get('vm_state') or raw.get('OS-EXT-STS:vm_state'),
                  'power_state':raw.get('power_state') or raw.get('OS-EXT-STS:power_state'),
                  'updated_at':str(raw.get('updated_at') or raw.get('updated') or ''),
              }
              observed.append(state)
              if state['status']=='ACTIVE' and state['task_state'] in (None,'None','') and str(state['vm_state']).lower()=='active':
                  active=True
                  if len(observed)>1 or (pre_updated and state['updated_at']!=pre_updated):
                      break
              time.sleep(5)
          print('provider_post_active='+str(active).lower())
          print('provider_observation_count='+str(len(observed)))
          print('provider_last_state='+json.dumps(observed[-1] if observed else {},sort_keys=True))
          print('provider_updated_changed='+str(bool(observed and pre_updated and observed[-1].get('updated_at')!=pre_updated)).lower())

          ssh_ok=False
          for attempt in range(1,61):
              s=socket.socket(); s.settimeout(3)
              try:
                  s.connect((ip,22)); ssh_ok=True; s.close(); break
              except OSError:
                  try: s.close()
                  except Exception: pass
                  time.sleep(5)
          print('ssh_tcp_22_post_recovery='+('reachable' if ssh_ok else 'unreachable'))
          print('additional_provider_write=false')
          print('provider_recreate=false')
          print('provider_shelve=false')
          PY
