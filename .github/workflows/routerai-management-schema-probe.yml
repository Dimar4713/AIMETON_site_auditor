name: RouterAI Management Schema Probe

on:
  push:
    branches:
      - ops/routerai-input-observe-20260816
    paths:
      - .github/workflows/routerai-management-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 3
    steps:
      - name: Compare Pro headroom and GPT-4o-mini extraction on strict ManagementSlice
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i aimeton-auditor python - <<'PY'
          import asyncio
          import json
          import os
          import time
          import httpx

          from app.routerai_profile_extraction import ManagementSlice

          VARIANTS = [
              ("pro_600", "deepseek/deepseek-v4-pro", 600, True),
              ("pro_1200", "deepseek/deepseek-v4-pro", 1200, True),
              ("gpt4o_mini_600", "openai/gpt-4o-mini", 600, False),
          ]

          def synthetic_context():
              sources = []
              for idx in range(1, 31):
                  if idx % 7 == 0:
                      snippet = "Registry note: founder Ivan Example; executive Petr Example."
                  elif idx % 5 == 0:
                      snippet = "Search mention about a similarly named company; identity is unverified."
                  else:
                      snippet = "General company search snippet without management facts."
                  sources.append({
                      "id": f"E{idx}",
                      "title": f"Synthetic source {idx}",
                      "query_kind": "ownership" if idx % 2 else "registry",
                      "source_class": "registry" if idx % 2 == 0 else "ownership",
                      "evidence_level": "unverified_mention",
                      "snippet": snippet,
                  })
              official = (
                  "Example engineering company. Official site describes products and services. "
                  "Management details are not listed on the public landing page. "
              ) * 35
              return official[:3550], json.dumps(sources, ensure_ascii=False, separators=(",", ":"))[:10000]

          async def probe(label, model, max_tokens, include_reasoning, client, official, sources):
              key = os.getenv("ROUTERAI_API_KEY")
              if not key:
                  raise RuntimeError("routerai_key_not_configured")
              base = os.getenv("ROUTERAI_BASE_URL", "https://routerai.ru/api/v1")
              schema = ManagementSlice.model_json_schema()
              prompt = f"""Extract only formal management facts.
          Allowed fields: founders, executives. Return at most one compact fact per field.
          Do not invent facts. Search snippets are discovery hints only.
          OFFICIAL PAGE TEXT:\n{official}\nRELEVANT SOURCES:\n{sources}
          """
              payload = {
                  "model": model,
                  "temperature": 0,
                  "max_tokens": max_tokens,
                  "structured_outputs": True,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "aimeton_management_slice",
                          "strict": True,
                          "schema": schema,
                      },
                  },
                  "messages": [
                      {"role": "system", "content": "Return only the requested structured object."},
                      {"role": "user", "content": prompt},
                  ],
              }
              if include_reasoning:
                  payload["include_reasoning"] = True

              started = time.perf_counter()
              try:
                  response = await client.post(
                      f"{base}/chat/completions",
                      headers={"Authorization": f"Bearer {key}"},
                      json=payload,
                  )
              except Exception as exc:
                  return {
                      "variant": label,
                      "model": model,
                      "max_tokens": max_tokens,
                      "http_status": None,
                      "elapsed_seconds": round(time.perf_counter() - started, 3),
                      "error_type": type(exc).__name__,
                      "schema_valid": False,
                      "response_content_exposed": False,
                      "secret_values_exposed": False,
                  }

              elapsed = time.perf_counter() - started
              result = {
                  "variant": label,
                  "model": model,
                  "http_status": response.status_code,
                  "elapsed_seconds": round(elapsed, 3),
                  "input_chars": len(official) + len(sources),
                  "max_tokens": max_tokens,
                  "finish_reason": None,
                  "schema_valid": False,
                  "fact_count": None,
                  "prompt_tokens": None,
                  "completion_tokens": None,
                  "reasoning_tokens": None,
                  "response_bytes": len(response.content),
                  "response_content_exposed": False,
                  "secret_values_exposed": False,
              }
              if response.status_code == 200:
                  body = response.json()
                  choice = body.get("choices", [{}])[0]
                  result["finish_reason"] = choice.get("finish_reason")
                  content = choice.get("message", {}).get("content", "")
                  try:
                      parsed = ManagementSlice.model_validate(json.loads(content))
                      result["schema_valid"] = True
                      result["fact_count"] = len(parsed.company_facts)
                  except Exception:
                      pass
                  usage = body.get("usage") or {}
                  details = usage.get("completion_tokens_details") or {}
                  result["prompt_tokens"] = usage.get("prompt_tokens")
                  result["completion_tokens"] = usage.get("completion_tokens")
                  result["reasoning_tokens"] = (
                      details.get("reasoning_tokens")
                      if isinstance(details, dict)
                      else None
                  )
                  if result["reasoning_tokens"] is None:
                      result["reasoning_tokens"] = usage.get("reasoning_tokens")
              return result

          async def main():
              official, sources = synthetic_context()
              async with httpx.AsyncClient(timeout=45) as client:
                  results = await asyncio.gather(*(
                      probe(label, model, max_tokens, include_reasoning, client, official, sources)
                      for label, model, max_tokens, include_reasoning in VARIANTS
                  ))
              for result in results:
                  print(json.dumps(result, ensure_ascii=False, sort_keys=True))
              if not any(result.get("schema_valid") for result in results):
                  raise SystemExit("no_candidate_produced_valid_management_schema")

          asyncio.run(main())
          PY
