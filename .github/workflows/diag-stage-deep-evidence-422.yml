name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 18
    steps:
      - name: Benchmark independent SearXNG fallbacks on broad entity queries
        shell: bash
        run: |
          set -euo pipefail
          searx_container="$(docker ps --format '{{.Names}}' | grep -Ei 'searx' | head -n 1)"
          test -n "$searx_container"
          docker exec -i "$searx_container" python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import time

          base = 'http://127.0.0.1:8080/search'
          engines = [
              'bing', 'presearch', 'yahoo', 'mwmbl', 'tusksearch',
              'stract', 'marginalia', 'crowdview', 'right dao',
          ]
          cases = [
              ('stomadv', 'Стоматология для вас Красноярск', ('stomadv.ru', 'краснояр', 'железногор')),
              ('dns', 'DNS интернет магазин электроники Россия', ('dns-shop.ru', 'dns')),
              ('timeweb', 'Timeweb Cloud российское облако', ('timeweb.cloud', 'timeweb')),
              ('reputation', 'Reputation.ru управление репутацией', ('reputation.ru', 'reputation')),
          ]

          def search(engine, query):
              params = urllib.parse.urlencode({
                  'q': query,
                  'format': 'json',
                  'language': 'ru',
                  'safesearch': 1,
                  'engines': engine,
              })
              try:
                  with urllib.request.urlopen(f'{base}?{params}', timeout=25) as response:
                      payload = json.load(response)
              except Exception as exc:
                  return [], [[engine, type(exc).__name__]]
              return payload.get('results') or [], payload.get('unresponsive_engines') or []

          for round_no in range(1, 3):
              print(f'ROUND {round_no}')
              for engine in engines:
                  case_hits = 0
                  relevant_total = 0
                  result_total = 0
                  failures = []
                  host_samples = []
                  for case_name, query, markers in cases:
                      results, blocked = search(engine, query)
                      failures.extend(blocked)
                      result_total += len(results)
                      relevant = []
                      for item in results:
                          url = str(item.get('url') or '')
                          host = urllib.parse.urlparse(url).hostname or ''
                          text = f"{url} {item.get('title','')} {item.get('content','')}".casefold()
                          if any(marker.casefold() in text for marker in markers):
                              relevant.append(url)
                          if len(host_samples) < 10 and host:
                              host_samples.append(host)
                      case_hits += int(bool(relevant))
                      relevant_total += len(relevant)
                      print(
                          f'CASE engine={engine} name={case_name} results={len(results)} '
                          f'relevant={len(relevant)} sample={relevant[:3]}'
                      )
                      time.sleep(0.35)
                  precision = relevant_total / result_total if result_total else 0.0
                  print(
                      f'ENGINE_SUMMARY engine={engine} hits={case_hits}/{len(cases)} '
                      f'results={result_total} relevant={relevant_total} precision={precision:.3f} '
                      f'failures={failures[:10]} hosts={host_samples}'
                  )
              time.sleep(2)
          PY
