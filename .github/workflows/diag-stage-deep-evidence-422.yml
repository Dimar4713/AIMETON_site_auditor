name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Inspect active SearXNG engine pool without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          echo 'containers:'
          docker ps --format '{{.Names}}|{{.Status}}' | grep -Ei 'searx|auditor' || true
          searx_container="$(docker ps --format '{{.Names}}' | grep -Ei 'searx' | head -n 1)"
          test -n "$searx_container"
          echo "searx_container=$searx_container"
          docker inspect "$searx_container" --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
          docker exec -i "$searx_container" python - <<'PY'
          from pathlib import Path
          import yaml

          candidates = [
              Path('/etc/searxng/settings.yml'),
              Path('/etc/searxng/settings.yaml'),
          ]
          path = next((item for item in candidates if item.exists()), None)
          print(f'settings_present={bool(path)}')
          if path is None:
              raise SystemExit(2)
          data = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
          engines = data.get('engines') or []
          print(f'configured_engine_entries={len(engines)}')
          enabled = []
          disabled = []
          for item in engines:
              if not isinstance(item, dict):
                  continue
              name = str(item.get('name') or item.get('engine') or 'unknown')
              state = bool(item.get('disabled', False))
              shortcut = str(item.get('shortcut') or '')
              categories = item.get('categories') or item.get('category') or ''
              record = f'name={name} shortcut={shortcut} categories={categories}'
              (disabled if state else enabled).append(record)
          print(f'enabled_entries={len(enabled)}')
          for record in enabled:
              print(f'ENABLED {record}')
          print(f'disabled_entries={len(disabled)}')
          for record in disabled[:60]:
              print(f'DISABLED {record}')
          outgoing = data.get('outgoing') or {}
          safe_keys = ('request_timeout', 'max_request_timeout', 'pool_connections', 'pool_maxsize', 'enable_http2')
          print('OUTGOING ' + ' '.join(f'{key}={outgoing.get(key)}' for key in safe_keys if key in outgoing))
          PY
