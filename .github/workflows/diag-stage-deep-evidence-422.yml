name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 15
    steps:
      - name: Benchmark resilient SearXNG pools and second-line engines
        shell: bash
        run: |
          set -euo pipefail
          searx_container="$(docker ps --format '{{.Names}}' | grep -Ei 'searx' | head -n 1)"
          test -n "$searx_container"
          docker exec -i "$searx_container" python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import time

          base = 'http://127.0.0.1:8080/search'
          cases = [
              ('default_core', 'brave,duckduckgo,google cse,startpage'),
              ('core_plus_bing', 'brave,duckduckgo,google cse,startpage,bing'),
              ('core_plus_bing_seznam', 'brave,duckduckgo,google cse,startpage,bing,seznam'),
              ('bing_only', 'bing'),
              ('yep_only', 'yep'),
              ('privacywall_only', 'privacywall'),
              ('vuhuv_only', 'vuhuv'),
              ('reloado_only', 'reloado'),
              ('resulthunter_only', 'resulthunter'),
              ('searchch_only', 'searchch'),
              ('wiby_only', 'wiby'),
              ('gmx_only', 'gmx'),
              ('fireball_only', 'fireball'),
          ]
          queries = [
              'site:stomadv.ru "Стоматология для вас"',
              'Стоматология для вас Красноярск',
              'site:stomadv.ru врачи',
          ]

          def request(engines, query):
              params = urllib.parse.urlencode({
                  'q': query,
                  'format': 'json',
                  'language': 'ru',
                  'safesearch': 1,
                  'engines': engines,
              })
              try:
                  with urllib.request.urlopen(f'{base}?{params}', timeout=25) as response:
                      payload = json.load(response)
              except Exception as exc:
                  return [], [[engines, type(exc).__name__]]
              return payload.get('results') or [], payload.get('unresponsive_engines') or []

          for round_no in range(1, 3):
              print(f'ROUND {round_no}')
              for label, engines in cases:
                  unique = {}
                  failures = []
                  for query in queries:
                      results, blocked = request(engines, query)
                      failures.extend(blocked)
                      for item in results:
                          url = str(item.get('url') or '')
                          if url:
                              unique.setdefault(url, item)
                      time.sleep(0.25)
                  relevant = []
                  unrelated = []
                  for url, item in unique.items():
                      text = f"{url} {item.get('title','')} {item.get('content','')}".casefold()
                      row = (
                          (urllib.parse.urlparse(url).hostname or ''),
                          url,
                          item.get('engine'),
                          item.get('engines'),
                      )
                      if 'stomadv.ru' in text or 'краснояр' in text or 'железногор' in text:
                          relevant.append(row)
                      else:
                          unrelated.append(row)
                  precision = (len(relevant) / len(unique)) if unique else 0.0
                  print(
                      f'POOL label={label} engines={engines} unique={len(unique)} '
                      f'relevant={len(relevant)} precision={precision:.3f} failures={failures[:8]}'
                  )
                  for row in relevant[:8]:
                      print(f'RELEVANT label={label} host={row[0]} engine={row[2]} engines={row[3]} url={row[1]}')
                  for row in unrelated[:4]:
                      print(f'NOISE label={label} host={row[0]} engine={row[2]} url={row[1]}')
              time.sleep(2)
          PY
