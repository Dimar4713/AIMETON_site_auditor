name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Inspect SearXNG raw JSON and upstream engine state
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i aimeton-auditor python - <<'PY'
          import asyncio
          import os
          import httpx

          async def main():
              base = (os.getenv('SEARXNG_BASE_URL') or '').rstrip('/')
              print(f'searxng_configured={bool(base)}')
              if not base:
                  raise SystemExit(2)
              queries = [
                  'site:stomadv.ru "Стоматология для вас"',
                  'Стоматология для вас Красноярск',
              ]
              async with httpx.AsyncClient(timeout=30, follow_redirects=True) as client:
                  for round_no in range(1, 4):
                      for query in queries:
                          response = await client.get(
                              f'{base}/search',
                              params={
                                  'q': query,
                                  'format': 'json',
                                  'language': 'ru',
                                  'safesearch': 1,
                              },
                          )
                          print(f'RAW round={round_no} status={response.status_code} query={query}')
                          response.raise_for_status()
                          payload = response.json()
                          results = payload.get('results') or []
                          engines = payload.get('unresponsive_engines') or []
                          suggestions = payload.get('suggestions') or []
                          print(f'RAW_RESULT round={round_no} results={len(results)} unresponsive={len(engines)} suggestions={len(suggestions)}')
                          for item in engines[:30]:
                              print(f'UNRESPONSIVE {item}')
                          for item in results[:10]:
                              print(f'FOUND engine={item.get("engine")} engines={item.get("engines")} url={item.get("url")}')
                      await asyncio.sleep(1)

          asyncio.run(main())
          PY
