name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
      YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
      TAVILY_TOKEN: ${{ secrets.TAVILY_TOKEN }}
    steps:
      - name: Capture sanitized provider authorization diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YANDEX_SEARCH_API_KEY"
          test -n "$YANDEX_CLOUD_FOLDER_ID"
          test -n "$TAVILY_TOKEN"
          docker exec -i \
            -e YANDEX_SEARCH_API_KEY="$YANDEX_SEARCH_API_KEY" \
            -e YANDEX_CLOUD_FOLDER_ID="$YANDEX_CLOUD_FOLDER_ID" \
            -e TAVILY_TOKEN="$TAVILY_TOKEN" \
            aimeton-auditor python - <<'PY'
          import asyncio
          import json
          import os
          import httpx

          SAFE_KEYS = {"code", "message", "error", "detail", "status", "type", "description"}

          def safe_payload(response):
              content_type = response.headers.get("content-type", "").split(";")[0]
              payload = {}
              try:
                  raw = response.json()
                  if isinstance(raw, dict):
                      for key, value in raw.items():
                          if key.lower() in SAFE_KEYS and isinstance(value, (str, int, float, bool, type(None))):
                              payload[key] = value
              except Exception:
                  pass
              return content_type, payload

          async def main():
              async with httpx.AsyncClient(timeout=30, follow_redirects=True) as client:
                  tavily = await client.get(
                      "https://api.tavily.com/usage",
                      headers={"Authorization": f"Bearer {os.environ['TAVILY_TOKEN']}"},
                  )
                  content_type, payload = safe_payload(tavily)
                  print(f"TAVILY_USAGE status={tavily.status_code} content_type={content_type} safe={json.dumps(payload, ensure_ascii=False, sort_keys=True)}")

                  yandex = await client.post(
                      "https://searchapi.api.cloud.yandex.net/v2/web/search",
                      headers={"Authorization": f"Api-Key {os.environ['YANDEX_SEARCH_API_KEY']}"},
                      json={
                          "query": {
                              "searchType": "SEARCH_TYPE_RU",
                              "queryText": 'site:stomadv.ru "Стоматология для вас"',
                              "familyMode": "FAMILY_MODE_MODERATE",
                              "page": "0",
                              "fixTypoMode": "FIX_TYPO_MODE_ON",
                          },
                          "groupSpec": {
                              "groupMode": "GROUP_MODE_FLAT",
                              "groupsOnPage": "5",
                              "docsInGroup": "1",
                          },
                          "maxPassages": "1",
                          "l10N": "LOCALIZATION_RU",
                          "folderId": os.environ["YANDEX_CLOUD_FOLDER_ID"],
                          "responseFormat": "FORMAT_XML",
                      },
                  )
                  content_type, payload = safe_payload(yandex)
                  print(f"YANDEX_SEARCH status={yandex.status_code} content_type={content_type} safe={json.dumps(payload, ensure_ascii=False, sort_keys=True)}")

          asyncio.run(main())
          PY
