name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 18
    steps:
      - name: Compare fresh five-engine pool with Yahoo fallback
        shell: bash
        run: |
          set -euo pipefail
          searx_container="$(docker ps --format '{{.Names}}' | grep -Ei 'searx' | head -n 1)"
          test -n "$searx_container"
          docker exec -i "$searx_container" python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          base = 'http://127.0.0.1:8080/search'
          pools = {
              'five': 'brave,duckduckgo,google cse,startpage,bing',
              'five_plus_yahoo': 'brave,duckduckgo,google cse,startpage,bing,yahoo',
              'bing': 'bing',
              'yahoo': 'yahoo',
          }
          cases = [
              ('stomadv', 'Стоматология для вас Красноярск', ('stomadv.ru', 'краснояр', 'железногор')),
              ('dns', 'DNS интернет магазин электроники Россия', ('dns-shop.ru', 'dns')),
              ('timeweb', 'Timeweb Cloud российское облако', ('timeweb.cloud', 'timeweb')),
              ('reputation', 'Reputation.ru управление репутацией', ('reputation.ru', 'reputation')),
          ]

          def search(engines, query, nonce):
              # A harmless negative nonce prevents SearXNG/gateway query cache from
              # turning repeated rounds into the same response while preserving
              # entity intent. The nonce is deliberately not a domain or identity token.
              fresh_query = f'{query} -aimeton_diag_{nonce}'
              params = urllib.parse.urlencode({
                  'q': fresh_query,
                  'format': 'json',
                  'language': 'ru',
                  'safesearch': 1,
                  'engines': engines,
              })
              try:
                  with urllib.request.urlopen(f'{base}?{params}', timeout=25) as response:
                      payload = json.load(response)
              except Exception as exc:
                  return [], [[engines, type(exc).__name__]]
              return payload.get('results') or [], payload.get('unresponsive_engines') or []

          for round_no in range(1, 4):
              print(f'ROUND {round_no}')
              for pool_name, engines in pools.items():
                  case_hits = 0
                  total = 0
                  relevant_total = 0
                  failures = []
                  for case_idx, (case_name, query, markers) in enumerate(cases):
                      results, blocked = search(engines, query, f'{round_no}_{pool_name}_{case_idx}')
                      failures.extend(blocked)
                      total += len(results)
                      relevant = []
                      for item in results:
                          url = str(item.get('url') or '')
                          text = f"{url} {item.get('title','')} {item.get('content','')}".casefold()
                          if any(marker.casefold() in text for marker in markers):
                              relevant.append(url)
                      case_hits += int(bool(relevant))
                      relevant_total += len(relevant)
                      print(
                          f'CASE round={round_no} pool={pool_name} name={case_name} '
                          f'results={len(results)} relevant={len(relevant)} failures={blocked[:6]} '
                          f'sample={relevant[:3]}'
                      )
                      time.sleep(0.45)
                  precision = relevant_total / total if total else 0.0
                  print(
                      f'POOL_SUMMARY round={round_no} pool={pool_name} hits={case_hits}/{len(cases)} '
                      f'results={total} relevant={relevant_total} precision={precision:.3f} '
                      f'failures={failures[:16]}'
                  )
              time.sleep(2)
          PY
