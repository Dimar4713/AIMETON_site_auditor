name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 15
    steps:
      - name: Cross-check core plus Bing pool on unrelated domains
        shell: bash
        run: |
          set -euo pipefail
          searx_container="$(docker ps --format '{{.Names}}' | grep -Ei 'searx' | head -n 1)"
          test -n "$searx_container"
          docker exec -i "$searx_container" python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import time

          base = 'http://127.0.0.1:8080/search'
          pools = {
              'core': 'brave,duckduckgo,google cse,startpage',
              'core_plus_bing': 'brave,duckduckgo,google cse,startpage,bing',
              'bing': 'bing',
          }
          cases = [
              ('dns', 'site:dns-shop.ru DNS', 'dns-shop.ru'),
              ('timeweb', 'site:timeweb.cloud "Timeweb Cloud"', 'timeweb.cloud'),
              ('reputation', 'site:reputation.ru reputation', 'reputation.ru'),
          ]

          def search(engines, query):
              params = urllib.parse.urlencode({
                  'q': query,
                  'format': 'json',
                  'language': 'ru',
                  'safesearch': 1,
                  'engines': engines,
              })
              try:
                  with urllib.request.urlopen(f'{base}?{params}', timeout=25) as response:
                      payload = json.load(response)
              except Exception as exc:
                  return [], [[engines, type(exc).__name__]]
              return payload.get('results') or [], payload.get('unresponsive_engines') or []

          for round_no in range(1, 3):
              print(f'ROUND {round_no}')
              for pool_name, engines in pools.items():
                  hits = 0
                  total_results = 0
                  failures = []
                  for case_name, query, expected_domain in cases:
                      results, blocked = search(engines, query)
                      failures.extend(blocked)
                      total_results += len(results)
                      domain_hits = [
                          str(item.get('url') or '')
                          for item in results
                          if expected_domain in (urllib.parse.urlparse(str(item.get('url') or '')).hostname or '')
                      ]
                      hits += int(bool(domain_hits))
                      print(
                          f'CASE pool={pool_name} name={case_name} results={len(results)} '
                          f'domain_hit={bool(domain_hits)} sample={domain_hits[:3]}'
                      )
                      time.sleep(0.35)
                  print(
                      f'POOL_SUMMARY pool={pool_name} case_hits={hits}/{len(cases)} '
                      f'total_results={total_results} failures={failures[:12]}'
                  )
              time.sleep(2)
          PY
