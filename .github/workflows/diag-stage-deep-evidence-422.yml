name: Diag Stage Deep Evidence 422

on:
  push:
    branches:
      - diag/stage-deep-evidence-422
    paths:
      - .github/workflows/diag-stage-deep-evidence-422.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Inspect effective SearXNG runtime engine pool without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          searx_container="$(docker ps --format '{{.Names}}' | grep -Ei 'searx' | head -n 1)"
          test -n "$searx_container"
          docker exec -i "$searx_container" python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          import re

          settings = Path('/etc/searxng/settings.yml')
          text = settings.read_text(encoding='utf-8') if settings.exists() else ''
          print(f'use_default_settings={bool(re.search(r"^use_default_settings\s*:", text, re.MULTILINE))}')
          print(f'explicit_engines_block={bool(re.search(r"^engines\s*:", text, re.MULTILINE))}')

          for url in ('http://127.0.0.1:8080/config', 'http://127.0.0.1:8080/config.json'):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      payload = json.load(response)
                  print(f'CONFIG_URL {url} status=ok')
                  engines = payload.get('engines') or []
                  print(f'runtime_engines={len(engines)}')
                  for item in engines:
                      if not isinstance(item, dict):
                          continue
                      print(
                          'ENGINE '
                          f"name={item.get('name','')} "
                          f"shortcut={item.get('shortcut','')} "
                          f"categories={item.get('categories','')} "
                          f"enabled={item.get('enabled', item.get('disabled', 'unknown'))}"
                      )
                  break
              except Exception as exc:
                  print(f'CONFIG_URL {url} status=failed error={type(exc).__name__}')
          else:
              raise SystemExit('SearXNG runtime config endpoint unavailable')
          PY
