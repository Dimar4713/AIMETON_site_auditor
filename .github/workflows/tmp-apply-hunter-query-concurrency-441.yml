name: Temporary apply Hunter query concurrency 441

on:
  push:
    branches:
      - perf/hunter-query-concurrency-441

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/hunter-query-concurrency-441
          fetch-depth: 0

      - name: Apply narrow Hunter query concurrency patch
        run: python scripts/patch_hunter_query_concurrency_441.py

      - name: Validate syntax
        run: python -m compileall -q app/discovery.py

      - name: Run focused Hunter tests
        run: |
          python -m pytest -q \
            tests/test_hunter_quality_gates.py \
            tests/test_hunt_pre_score.py \
            tests/test_hunter_forensic_trace.py

      - name: Commit generated production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/discovery.py
          git diff --cached --quiet && exit 0
          git commit -m "Parallelize Hunter query orchestration within provider limits"
          git push origin HEAD:perf/hunter-query-concurrency-441
