name: ACCB OpenRouter Proxy No-Paid Preflight
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      evidence_issue:
        required: true
        default: "820"
        type: string
permissions:
  contents: read
  issues: write
jobs:
  preflight:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      OPENROUTER_PROXY_URL: ${{ secrets.OPENROUTER_PROXY_URL }}
    steps:
      - name: Materialize exact main
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$$EXPECTED_SHA" =~ ^[0-9a-f]{40}$$ ]]
          cd "$$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$$GH_TOKEN@github.com/$$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$$EXPECTED_SHA"
      - name: Probe proxy egress and public OpenRouter metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          env -u OPENROUTER_API_KEY python3 - <<'PY'
          import ipaddress,json,os,pathlib,urllib.error,urllib.request
          proxy=os.environ.get("OPENROUTER_PROXY_URL","").strip()
          r={"schema_version":"1.0","status":"OPENROUTER_PROXY_PREFLIGHT_FAILED","proxy_configured":bool(proxy),"proxy_value_retained":False,"openrouter_api_key_present_in_environment":False,"authorization_header_sent":False,"model_generation_requests":0,"paid_spend_authorized_rub":0}
          if not proxy.startswith(("http://","https://")):
              r["failure_class"]="proxy_url_missing_or_invalid"
          else:
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({"http":proxy,"https":proxy}))
              def get(url):
                  try:
                      with opener.open(urllib.request.Request(url,headers={"User-Agent":"aimeton-accb-no-paid-proxy-preflight"}),timeout=25) as x: return int(x.status),x.read(512).decode("utf-8","replace")
                  except urllib.error.HTTPError as x: return int(x.code),""
                  except Exception as x: return "ERROR:"+type(x).__name__,""
              ip_status,ip_body=get("https://api.ipify.org")
              try: ip=str(ipaddress.ip_address(ip_body.strip())) if ip_status==200 else None
              except ValueError: ip=None
              models_status,_=get("https://openrouter.ai/api/v1/models")
              r.update({"ip_echo_http_status":ip_status,"effective_public_egress_ip":ip,"openrouter_public_models_http_status":models_status})
              if ip and isinstance(models_status,int) and 200 <= models_status < 500: r["status"]="OPENROUTER_PROXY_PREFLIGHT_COMPLETE"
              else: r["failure_class"]="proxy_or_public_metadata_unavailable"
          pathlib.Path("/tmp/accb-openrouter-proxy-preflight.json").write_text(json.dumps(r,sort_keys=True),encoding="utf-8")
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Publish sanitized receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          p=pathlib.Path("/tmp/accb-openrouter-proxy-preflight.json")
          r=json.loads(p.read_text()) if p.exists() else {"status":"PREFLIGHT_DID_NOT_EMIT_RECEIPT"}
          body="\\n".join(["## ACCB OpenRouter proxy no-paid preflight","",f"- exact Site Auditor SHA: \`{os.environ['EXPECTED_SHA']}\`",f"- runner: \`{os.environ.get('RUNNER_NAME')}\`",f"- status: **{r.get('status')}**",f"- proxy configured: \`{r.get('proxy_configured')}\`","- proxy value retained: \`false\`",f"- effective public egress IP: \`{r.get('effective_public_egress_ip')}\`",f"- IP echo HTTP status: \`{r.get('ip_echo_http_status')}\`",f"- OpenRouter public models HTTP status: \`{r.get('openrouter_public_models_http_status')}\`","- API key present in probe environment: \`false\`","- Authorization header sent: \`false\`","- model generation requests: \`0\`","- paid spend authorized: \`0 RUB\`",f"- failure class: \`{r.get('failure_class')}\`"])
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",data=json.dumps({"body":body}).encode(),method="POST",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json","Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as x:
              if x.status not in (200,201): raise SystemExit(x.status)
          PY
      - name: Enforce result
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("/tmp/accb-openrouter-proxy-preflight.json").read_text())
          assert r["model_generation_requests"] == 0
          assert r["paid_spend_authorized_rub"] == 0
          if r["status"] != "OPENROUTER_PROXY_PREFLIGHT_COMPLETE": raise SystemExit(r["status"])
          PY
