name: Open Agent PR
on:
  push:
    branches:
      - fix/search-regime-explicit-ui-contract
permissions:
  contents: read
  pull-requests: write
jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open PR if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh pr view --head "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh pr create --base main --head "$GITHUB_REF_NAME" --title "Test offline Search Observer promotion readiness" --body "Adds regression coverage for the retained-evidence-only promotion readiness CLI. Tests only; no provider calls, routing changes, steering activation, or budget changes. Part of #587."
          fi
