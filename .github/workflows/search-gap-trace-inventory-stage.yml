name: Search Gap Trace Inventory Stage

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA to inventory
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aimeton-search-gap-trace-inventory-stage
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      TRACE_DB: /app/data/runtime-core.sqlite3

    steps:
      - name: Resolve exact expected SHA
        id: expected
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ inputs.expected_sha }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Verify exact deployed SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          [[ "$deployed" == "${{ steps.expected.outputs.sha }}" ]]
          docker inspect "$CONTAINER" >/dev/null

      - name: Build sanitized read-only trace inventory
        id: inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/search-gap-trace-inventory.json"
          summary="$RUNNER_TEMP/search-gap-trace-inventory.md"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

          docker exec "$CONTAINER" test -f /app/scripts/search_gap_trace_match_inventory.py
          docker exec "$CONTAINER" test -f "$TRACE_DB"
          docker exec -w /app -e PYTHONPATH=/app "$CONTAINER" \
            python -c 'import app.search_gap_trace_match_inventory, app.search_gap_shadow_action_inventory, app.search_provider_attribution'
          docker exec -w /app -e PYTHONPATH=/app "$CONTAINER" \
            python scripts/search_gap_trace_match_inventory.py "$TRACE_DB" \
            > "$report"

          python_bin="$(command -v python3 || command -v python)"
          "$python_bin" - "$report" "$summary" '${{ steps.expected.outputs.sha }}' <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path, summary_path, expected_sha = sys.argv[1:]
          data = json.loads(Path(report_path).read_text(encoding="utf-8"))
          required = {
              "evidence_kind",
              "hunter_event_count",
              "hunter_attempt_count",
              "hunter_plan_count",
              "hunter_search_wave_count",
              "hunter_funnel_complete_count",
              "hunter_first_at",
              "hunter_latest_at",
              "query_planned_count",
              "search_gateway_attempt_count",
              "query_first_at",
              "query_latest_at",
              "refinement_observation_count",
              "refinement_observation_attempt_count",
              "refinement_first_at",
              "refinement_latest_at",
              "observed_gap_count",
              "observed_suggestion_count",
              "persisted_suggestion_count",
              "suggestion_persistence_complete",
              "suggestion_attempt_count",
              "suggestion_first_at",
              "suggestion_latest_at",
              "corpus_state",
              "corpus_ready_for_match_evaluation",
              "suggestion_count",
              "matched_suggestion_count",
              "unmatched_suggestion_count",
              "same_attempt_causal_candidate_count",
              "historical_noncausal_candidate_count",
              "same_attempt_prior_collision_count",
              "buckets",
              "provider_attribution",
              "shadow_action_inventory",
              "routing_changed",
              "steering_enabled",
              "promotion_activated",
          }
          assert required <= set(data)
          assert data["evidence_kind"] == "search_gap_shadow_query_match_inventory"
          assert data["routing_changed"] is False
          assert data["steering_enabled"] is False
          assert data["promotion_activated"] is False

          attribution = data["provider_attribution"]
          attribution_required = {
              "evidence_kind",
              "qualifying_attempt_found",
              "minimum_query_count",
              "query_count",
              "provider_call_count",
              "provider_raw_result_count",
              "provider_cost_by_currency",
              "retained_result_item_count",
              "retained_unique_domain_count",
              "retained_primary_provider_domain_count",
              "retained_provider_support_domain_count",
              "retained_corroborated_domain_count",
              "routing_changed",
          }
          assert attribution_required <= set(attribution)
          assert attribution["evidence_kind"] == "search_provider_attribution_inventory"
          assert attribution["routing_changed"] is False

          actions = data["shadow_action_inventory"]
          action_required = {
              "shadow_action_observation_count",
              "shadow_action_counts",
              "latest_shadow_action",
              "latest_shadow_action_reason",
              "latest_shadow_effective_regime",
              "routing_changed",
              "steering_enabled",
              "promotion_activated",
          }
          assert action_required <= set(actions)
          assert actions["routing_changed"] is False
          assert actions["steering_enabled"] is False
          assert actions["promotion_activated"] is False

          forbidden = {
              "query_text", "result_url", "mission_id", "attempt_id", "query_digest"
          }

          def walk(value):
              if isinstance(value, dict):
                  assert forbidden.isdisjoint(value)
                  for item in value.values():
                      walk(item)
              elif isinstance(value, list):
                  for item in value:
                      walk(item)

          walk(data)
          lines = [
              "## Search gap trace inventory — Stage",
              "",
              f"- exact deployed SHA: `{expected_sha}`",
              f"- corpus state: {data['corpus_state']}",
              f"- match-evaluation ready: {str(data['corpus_ready_for_match_evaluation']).lower()}",
              f"- Hunter events: {data['hunter_event_count']}",
              f"- Hunter attempts: {data['hunter_attempt_count']}",
              f"- Hunter plans: {data['hunter_plan_count']}",
              f"- Hunter first/latest: {data['hunter_first_at']} / {data['hunter_latest_at']}",
              f"- observed search waves: {data['hunter_search_wave_count']}",
              f"- completed funnels: {data['hunter_funnel_complete_count']}",
              f"- planned queries: {data['query_planned_count']}",
              f"- search-gateway attempts: {data['search_gateway_attempt_count']}",
              f"- query first/latest: {data['query_first_at']} / {data['query_latest_at']}",
              f"- refinement observations: {data['refinement_observation_count']}",
              f"- refinement observation attempts: {data['refinement_observation_attempt_count']}",
              f"- refinement first/latest: {data['refinement_first_at']} / {data['refinement_latest_at']}",
              f"- observed gaps: {data['observed_gap_count']}",
              f"- observed suggestions: {data['observed_suggestion_count']}",
              f"- persisted suggestions: {data['persisted_suggestion_count']}",
              f"- suggestion persistence complete: {data['suggestion_persistence_complete']}",
              f"- suggestion attempts: {data['suggestion_attempt_count']}",
              f"- suggestion first/latest: {data['suggestion_first_at']} / {data['suggestion_latest_at']}",
              f"- suggestions: {data['suggestion_count']}",
              f"- matched suggestions: {data['matched_suggestion_count']}",
              f"- unmatched suggestions: {data['unmatched_suggestion_count']}",
              f"- same-attempt causal candidates: {data['same_attempt_causal_candidate_count']}",
              f"- historical noncausal candidates: {data['historical_noncausal_candidate_count']}",
              f"- same-attempt prior collisions: {data['same_attempt_prior_collision_count']}",
              "",
              "### Runtime shadow second-wave decision",
              f"- retained decisions: {actions['shadow_action_observation_count']}",
              f"- action counts: {actions['shadow_action_counts']}",
              f"- latest action: {actions['latest_shadow_action']}",
              f"- latest reason: {actions['latest_shadow_action_reason']}",
              f"- latest effective regime: {actions['latest_shadow_effective_regime']}",
              "- routing changed: no",
              "- steering enabled: no",
              "- promotion activated: no",
              "",
              "### Latest substantial Hunter provider attribution",
              f"- qualifying attempt found: {str(attribution['qualifying_attempt_found']).lower()}",
              f"- query count: {attribution['query_count']}",
              f"- provider calls: {attribution['provider_call_count']}",
              f"- provider raw results: {attribution['provider_raw_result_count']}",
              f"- provider cost by currency: {attribution['provider_cost_by_currency']}",
              f"- retained result items: {attribution['retained_result_item_count']}",
              f"- retained unique domains: {attribution['retained_unique_domain_count']}",
              f"- retained primary-provider domains: {attribution['retained_primary_provider_domain_count']}",
              f"- retained provider-support domains: {attribution['retained_provider_support_domain_count']}",
              f"- retained corroborated domains: {attribution['retained_corroborated_domain_count']}",
              "- raw query text exported: no",
              "- result URLs/domains exported: no",
              "- trace identifiers exported: no",
          ]
          Path(summary_path).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: search-gap-trace-inventory-${{ github.run_id }}
          path: |
            ${{ steps.inventory.outputs.report }}
            ${{ steps.inventory.outputs.summary }}
          if-no-files-found: error
          retention-days: 30
