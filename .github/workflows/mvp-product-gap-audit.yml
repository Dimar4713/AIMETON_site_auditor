name: MVP Product Gap Audit

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-mvp-product-gap-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 161 && github.event.comment.body == '/audit-mvp-gap' && github.event.comment.user.login == 'Dimar4713') }}
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect sanitised live product gap evidence
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/mvp-product-gap-audit.md"
          python3 scripts/mvp_gap_audit.py --output "$report"
          test -s "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: mvp-product-gap-audit-${{ github.run_id }}
          path: ${{ steps.audit.outputs.report }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence to SA-MVP-01A
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.audit.outputs.report }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 161,
              body: report.slice(0, 60000),
            });
