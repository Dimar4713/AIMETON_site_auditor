name: Temporary apply compact Search Observer trace 544

on:
  push:
    branches:
      - fix/compact-search-observer-trace-544

permissions:
  contents: write

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-search-observer-trace-544
          fetch-depth: 0

      - name: Apply compact observer trace patch
        run: python scripts/patch_compact_search_observer_trace_544.py

      - name: Validate syntax
        run: python -m compileall -q app/discovery.py

      - name: Commit generated production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/discovery.py
          git diff --cached --quiet && exit 0
          git commit -m "Keep Search Observer trace metadata within ledger bounds"
          git push origin HEAD:fix/compact-search-observer-trace-544
