name: ACCB OpenRouter Sol Bounded Microprobe
on:
  workflow_dispatch:
    inputs:
      expected_sha: { required: true, type: string }
      evidence_issue: { required: true, default: "820", type: string }
      owner_spend_authorized: { required: true, type: string }
      max_budget_rub: { required: true, type: string }
permissions:
  contents: read
  issues: write
jobs:
  probe:
    environment: stage
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      OWNER_SPEND_AUTHORIZED: ${{ inputs.owner_spend_authorized }}
      MAX_BUDGET_RUB: ${{ inputs.max_budget_rub }}
      OPENROUTER_PROXY_URL: ${{ vars.OPENROUTER_PROXY_URL }}
      OPENROUTER_SOCKS_URL: ${{ vars.OPENROUTER_SOCKS_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Guard budget and materialize exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OWNER_SPEND_AUTHORIZED" == "true" ]]
          [[ "$MAX_BUDGET_RUB" == "1" ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: One pinned Sol request through proxy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.parse
          import sys

          sys.path.insert(0, "scripts")
          import openrouter_proxy_client as client

          receipt = {
              "status": "OPENROUTER_SOL_MICROPROBE_FAILED",
              "model_requested": "openai/gpt-5.6-sol",
              "provider_only": "openai",
              "allow_fallbacks": False,
              "store": False,
              "raw_model_output_retained": False,
              "proxy_value_retained": False,
              "proxy_transport": "socks5h",
              "api_key_value_retained": False,
              "max_budget_rub": 1,
              "submission_attempts": 0,
              "model_generation_requests": 0,
              "automatic_retries": 0,
          }
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          try:
              socks_endpoint = os.environ.get("OPENROUTER_SOCKS_URL", "").strip()
              if socks_endpoint.startswith(("http://", "https://")):
                  parsed = urllib.parse.urlsplit(socks_endpoint)
                  if not parsed.hostname or parsed.username or parsed.password:
                      raise RuntimeError("openrouter_socks_endpoint_invalid")
                  host = f"[{parsed.hostname}]" if ":" in parsed.hostname else parsed.hostname
                  socks_endpoint = f"socks5h://{host}:{parsed.port or 50101}"
              proxy = client.resolve_proxy(
                  os.environ.get("OPENROUTER_PROXY_URL", "").strip(),
                  socks_endpoint,
              )
              client.validate_proxy_and_key(proxy, key)
              request_body = client.build_response_body(
                  "Reply exactly: AIMETON_SOL_PROXY_OK", max_output_tokens=32
              )
              receipt.update(
                  {
                      "request_body_bytes": len(request_body),
                      "request_body_sha256": hashlib.sha256(request_body).hexdigest(),
                      "submission_attempts": 1,
                  }
              )
              result = client.post_response(
                  proxy=proxy,
                  api_key=key,
                  body=request_body,
                  total_timeout_seconds=120,
              )
              receipt.update(
                  {
                      "http_status": result.http_status,
                      "transport_metrics": result.metrics,
                      "diagnostic_headers": result.diagnostic_headers,
                  }
              )
              if not 200 <= result.http_status < 300:
                  raise RuntimeError(f"openrouter_http_{result.http_status}")
              data = json.loads(result.body.decode("utf-8"))
              receipt.update(
                  {
                      "status": "OPENROUTER_SOL_MICROPROBE_COMPLETE",
                      "response_id": str(data.get("id") or "")[:128],
                      "dashboard_generation_id": client.find_generation_id(data)
                      or client.find_generation_id(result.diagnostic_headers),
                      "response_model": str(data.get("model") or "")[:128],
                      "usage": data.get("usage") if isinstance(data.get("usage"), dict) else {},
                      "response_sha256": hashlib.sha256(result.body).hexdigest(),
                      "model_generation_requests": 1,
                  }
              )
          except client.CurlTransportError as exc:
              receipt["failure_class"] = exc.failure_class
              receipt["transport_metrics"] = exc.metrics
          except Exception as exc:
              receipt["failure_class"] = str(exc)[:160]

          pathlib.Path("/tmp/accb-openrouter-sol-microprobe.json").write_text(
              json.dumps(receipt, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Publish sanitized receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path("/tmp/accb-openrouter-sol-microprobe.json")
          receipt = json.loads(path.read_text()) if path.exists() else {"status": "MICROPROBE_DID_NOT_EMIT_RECEIPT"}
          body = "\n".join(
              [
                  "## ACCB OpenRouter GPT-5.6 Sol bounded microprobe",
                  "",
                  f"- exact SHA: `{os.environ['EXPECTED_SHA']}`",
                  f"- runner: `{os.environ.get('RUNNER_NAME')}`",
                  f"- status: **{receipt.get('status')}**",
                  f"- model requested: `{receipt.get('model_requested')}`",
                  f"- response model: `{receipt.get('response_model')}`",
                  f"- provider pinned: `{receipt.get('provider_only')}`",
                  "- fallback: `false`",
                  "- storage: `false`",
                  "- raw output retained: `false`",
                  f"- HTTP status: `{receipt.get('http_status')}`",
                  f"- response ID: `{receipt.get('response_id')}`",
                  f"- dashboard generation ID: `{receipt.get('dashboard_generation_id')}`",
                  f"- response digest: `{receipt.get('response_sha256')}`",
                  f"- usage: `{json.dumps(receipt.get('usage') or {}, sort_keys=True)}`",
                  f"- transport: `{json.dumps(receipt.get('transport_metrics') or {}, sort_keys=True)}`",
                  "- authorized hard ceiling: `1 RUB`",
                  f"- submission attempts: `{receipt.get('submission_attempts')}`",
                  f"- confirmed generation requests: `{receipt.get('model_generation_requests')}`",
                  "- automatic retries: `0`",
                  f"- failure class: `{receipt.get('failure_class')}`",
              ]
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY
      - name: Enforce bounded result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          receipt = json.loads(pathlib.Path("/tmp/accb-openrouter-sol-microprobe.json").read_text())
          assert receipt["max_budget_rub"] == 1
          assert receipt["submission_attempts"] <= 1
          assert receipt["model_generation_requests"] <= 1
          assert receipt["automatic_retries"] == 0
          assert receipt["store"] is False and receipt["allow_fallbacks"] is False
          if receipt["status"] != "OPENROUTER_SOL_MICROPROBE_COMPLETE":
              raise SystemExit(receipt["status"])
          PY
