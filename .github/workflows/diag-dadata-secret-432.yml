name: Diag DaData Secret 432

on:
  push:
    branches:
      - fix/dadata-owned-report-432
    paths:
      - .github/workflows/diag-dadata-secret-432.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: DADATA
    env:
      DADATA_API_SECRET: ${{ secrets.DADATA_API }}
      DADATA_SECRET_VALUE: ${{ secrets.DADATA_SECRET }}
    steps:
      - name: Check secret-only migration readiness
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DADATA_API_SECRET:-}" ]; then
            echo 'dadata_api_secret_configured=true'
          else
            echo 'dadata_api_secret_configured=false'
          fi
          if [ -n "${DADATA_SECRET_VALUE:-}" ]; then
            echo 'dadata_secret_configured=true'
          else
            echo 'dadata_secret_configured=false'
          fi
