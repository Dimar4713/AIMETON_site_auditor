name: ACCB OpenRouter Sol 32K Reference
on:
  workflow_dispatch:
    inputs:
      expected_sha: { required: true, type: string }
      evidence_issue: { required: true, default: "820", type: string }
      owner_spend_authorized: { required: true, type: string }
      max_budget_rub: { required: true, type: string }
permissions:
  contents: read
  issues: write
jobs:
  reference:
    environment: stage
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVIDENCE_ISSUE: ${{ inputs.evidence_issue }}
      OWNER_SPEND_AUTHORIZED: ${{ inputs.owner_spend_authorized }}
      MAX_BUDGET_RUB: ${{ inputs.max_budget_rub }}
      OPENROUTER_PROXY_URL: ${{ vars.OPENROUTER_PROXY_URL }}
      OPENROUTER_SOCKS_URL: ${{ vars.OPENROUTER_SOCKS_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Materialize exact reference source
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OWNER_SPEND_AUTHORIZED" == "true" ]]
          [[ "$MAX_BUDGET_RUB" == "100" ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run one pinned 32K ACCB reference
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.parse
          import sys

          sys.path.insert(0, "scripts")
          import accb_layer_b_dry_run as dry
          import openrouter_proxy_client as client

          receipt_path = pathlib.Path("/tmp/accb-openrouter-sol-32k.json")
          receipt = {
              "status": "ACCB_OPENROUTER_SOL_32K_FAILED",
              "model_requested": "openai/gpt-5.6-sol",
              "provider_only": "openai",
              "allow_fallbacks": False,
              "store": False,
              "raw_request_retained": False,
              "raw_model_output_retained": False,
              "proxy_value_retained": False,
              "proxy_transport": "http",
              "api_key_value_retained": False,
              "max_budget_rub": 100,
              "max_output_tokens": 256,
              "stream": True,
              "submission_attempts": 0,
              "model_generation_requests": 0,
              "generation_confirmed": False,
              "automatic_retries": 0,
          }

          def persist():
              receipt_path.write_text(json.dumps(receipt, sort_keys=True), encoding="utf-8")

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          try:
          socks_endpoint = os.environ.get("OPENROUTER_SOCKS_URL", "").strip()
          if socks_endpoint.startswith(("http://", "https://")):
              parsed = urllib.parse.urlsplit(socks_endpoint)
              if not parsed.hostname or parsed.username or parsed.password:
                  raise RuntimeError("openrouter_socks_endpoint_invalid")
              host = f"[{parsed.hostname}]" if ":" in parsed.hostname else parsed.hostname
              socks_endpoint = f"socks5h://{host}:{parsed.port or 50101}"
          proxy = client.resolve_proxy(
              os.environ.get("OPENROUTER_PROXY_URL", "").strip(),
              socks_endpoint,
          )
              client.validate_proxy_and_key(proxy, key)
              snapshot = dry.verify_snapshot()
              scenario = dry._read_json(dry.SCENARIO_PATH)
              seed, _ = dry.derive_assembly_seed(
                  scenario["scenario_id"], scenario["scenario_version"], 32768
              )
              context, manifest = dry.assemble_context(
                  scenario,
                  anchor_tokens=32768,
                  seed=seed,
                  density=float(scenario["context_targets"]["distractor_density"]),
              )
              wire_context, wire_manifest = client.compact_accb_context(context)
              if wire_manifest["logical_whitespace_tokens"] != 32768:
                  raise RuntimeError("compact_logical_token_target_mismatch")
              checkpoint = str(scenario["events"][5]["payload"])
              task = checkpoint + (
                  " Return JSON only with keys old_policy_status, fallback_authorization_status, "
                  "budget_rub, current_policy, next_safe_step. Use statuses superseded/revoked where applicable."
              )
              request_body = client.build_response_body(
                  "[FILLER LEGEND] old = stale legacy fallback noise; n = neutral noise.\n"
                  + wire_context
                  + "\n\n[CHECKPOINT]\n"
                  + task,
                  max_output_tokens=receipt["max_output_tokens"],
                  stream=True,
              )
              if len(request_body) >= 98304:
                  raise RuntimeError("compact_request_exceeds_observed_complete_upload_bound")
              receipt.update(
                  {
                      "context_assembled": True,
                      "snapshot": snapshot,
                      "context_sha256": manifest["context_sha256"],
                      **wire_manifest,
                      "logical_context_tokens": manifest["logical_whitespace_tokens"],
                      "source_context_bytes": len(context.encode("utf-8")),
                      "context_bytes": len(wire_context.encode("utf-8")),
                      "request_body_bytes": len(request_body),
                      "request_body_sha256": hashlib.sha256(request_body).hexdigest(),
                  }
              )
              persist()

              receipt["submission_attempts"] = 1
              persist()
              result = client.post_response(
                  proxy=proxy,
                  api_key=key,
                  body=request_body,
                  total_timeout_seconds=1200,
              )
              receipt.update(
                  {
                      "http_status": result.http_status,
                      "response_received": True,
                      "transport_metrics": result.metrics,
                      "diagnostic_headers": result.diagnostic_headers,
                  }
              )
              persist()
              if not 200 <= result.http_status < 300:
                  raise RuntimeError(f"openrouter_http_{result.http_status}")

              stream_result = client.parse_response_stream(result.body)
              data = stream_result["terminal_response"]
              if not data:
                  raise RuntimeError("openrouter_stream_missing_terminal_response")
              answer = stream_result["output_text"] or client.extract_output_text(data)
              candidate = (
                  answer[answer.find("{") : answer.rfind("}") + 1]
                  if "{" in answer and "}" in answer
                  else ""
              )
              parsed = json.loads(candidate) if candidate else {}
              checks = {
                  "old_policy_superseded": str(parsed.get("old_policy_status", "")).lower()
                  == "superseded",
                  "fallback_revoked": str(
                      parsed.get("fallback_authorization_status", "")
                  ).lower()
                  == "revoked",
                  "budget_preserved": str(parsed.get("budget_rub", "")) == "100",
                  "pinned_policy": str(parsed.get("current_policy", "")).lower()
                  in ("pinned_no_fallback", "pinned-provider-no-fallback"),
                  "next_safe_step_present": bool(str(parsed.get("next_safe_step", "")).strip()),
              }
              response_id = str(data.get("id") or stream_result.get("response_id") or "")[:128]
              receipt.update(
                  {
                      "status": "ACCB_OPENROUTER_SOL_32K_COMPLETE",
                      "response_model": str(data.get("model") or "")[:128],
                      "response_id": response_id,
                      "dashboard_generation_id": client.find_generation_id(data)
                      or stream_result.get("generation_id")
                      or client.find_generation_id(result.diagnostic_headers),
                      "stream_event_types": stream_result["event_types"],
                      "provider_usage": data.get("usage")
                      if isinstance(data.get("usage"), dict)
                      else {},
                      "response_sha256": hashlib.sha256(result.body).hexdigest(),
                      "scoring": checks,
                      "score_passed": all(checks.values()),
                      "generation_confirmed": bool(response_id),
                      "model_generation_requests": 1 if response_id else 0,
                      "ambiguous_delivery": False,
                  }
              )
          except client.CurlTransportError as exc:
              receipt["failure_class"] = exc.failure_class
              receipt["transport_metrics"] = exc.metrics
              if exc.partial_body:
                  partial_stream = client.parse_response_stream(exc.partial_body)
                  receipt["partial_stream_event_types"] = partial_stream["event_types"]
                  receipt["response_id"] = partial_stream.get("response_id")
                  receipt["dashboard_generation_id"] = partial_stream.get("generation_id")
              receipt["ambiguous_delivery"] = bool(exc.metrics.get("upload_complete"))
          except Exception as exc:
              receipt["failure_class"] = str(exc)[:160]
              metrics = receipt.get("transport_metrics")
              receipt["ambiguous_delivery"] = bool(
                  isinstance(metrics, dict)
                  and metrics.get("upload_complete")
                  and not receipt.get("response_received")
              )
          persist()
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Publish sanitized reference receipt
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          path = pathlib.Path("/tmp/accb-openrouter-sol-32k.json")
          receipt = json.loads(path.read_text()) if path.exists() else {"status": "REFERENCE_DID_NOT_EMIT_RECEIPT"}
          body = "\n".join(
              [
                  "## ACCB OpenRouter GPT-5.6 Sol 32K reference",
                  "",
                  f"- exact SHA: `{os.environ['EXPECTED_SHA']}`",
                  f"- runner: `{os.environ.get('RUNNER_NAME')}`",
                  f"- status: **{receipt.get('status')}**",
                  f"- model requested: `{receipt.get('model_requested')}`",
                  f"- response model: `{receipt.get('response_model')}`",
                  f"- provider pinned: `{receipt.get('provider_only')}`",
                  "- fallback: `false`",
                  "- storage: `false`",
                  "- raw request retained: `false`",
                  "- raw output retained: `false`",
                  f"- logical context tokens: `{receipt.get('logical_context_tokens')}`",
                  f"- context bytes: `{receipt.get('context_bytes')}`",
                  f"- source context bytes: `{receipt.get('source_context_bytes')}`",
                  f"- wire filler corpus: `{receipt.get('wire_filler_corpus_version')}`",
                  f"- wire context digest: `{receipt.get('wire_context_sha256')}`",
                  f"- request-body bytes: `{receipt.get('request_body_bytes')}`",
                  f"- request-body digest: `{receipt.get('request_body_sha256')}`",
                  f"- HTTP status: `{receipt.get('http_status')}`",
                  f"- response ID: `{receipt.get('response_id')}`",
                  f"- dashboard generation ID: `{receipt.get('dashboard_generation_id')}`",
                  f"- response digest: `{receipt.get('response_sha256')}`",
                  f"- stream events: `{json.dumps(receipt.get('stream_event_types') or receipt.get('partial_stream_event_types') or [])}`",
                  f"- scoring: `{json.dumps(receipt.get('scoring') or {}, sort_keys=True)}`",
                  f"- score passed: `{receipt.get('score_passed')}`",
                  f"- provider usage: `{json.dumps(receipt.get('provider_usage') or {}, sort_keys=True)}`",
                  f"- transport: `{json.dumps(receipt.get('transport_metrics') or {}, sort_keys=True)}`",
                  f"- proxy transport: `{receipt.get('proxy_transport')}`",
                  "- authorized session ceiling: `100 RUB`",
                  f"- submission attempts: `{receipt.get('submission_attempts')}`",
                  f"- confirmed generation requests: `{receipt.get('model_generation_requests')}`",
                  f"- generation confirmed: `{receipt.get('generation_confirmed')}`",
                  f"- ambiguous delivery: `{receipt.get('ambiguous_delivery')}`",
                  "- automatic retries: `0`",
                  f"- failure class: `{receipt.get('failure_class')}`",
              ]
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['EVIDENCE_ISSUE']}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY
      - name: Enforce one bounded score
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          receipt = json.loads(pathlib.Path("/tmp/accb-openrouter-sol-32k.json").read_text())
          assert receipt["submission_attempts"] <= 1
          assert receipt["model_generation_requests"] <= 1
          assert receipt["automatic_retries"] == 0
          assert receipt["store"] is False and receipt["allow_fallbacks"] is False
          if receipt["status"] != "ACCB_OPENROUTER_SOL_32K_COMPLETE" or receipt.get("score_passed") is not True:
              raise SystemExit("32K reference failed")
          PY