name: Compare Stage Provider Egress

on:
  push:
    branches:
      - diag/stage-search-egress
    paths:
      - .github/workflows/compare-stage-provider-egress.yml

permissions:
  contents: read

jobs:
  yandex-stage-identical-collector:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: YANDEX_SEARCH
    timeout-minutes: 10
    steps:
      - name: Checkout exact successful collector
        uses: actions/checkout@v4
        with:
          ref: bench/krasnoyarsk-dentistry-search-strategies
      - name: Run identical Yandex collector inside Stage app container
        shell: bash
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          set -Eeuo pipefail
          docker cp scripts/collect_search_snapshot.py aimeton-auditor:/tmp/collect_search_snapshot.py
          docker exec \
            -w /app \
            -e YANDEX_SEARCH_API_KEY="$YANDEX_SEARCH_API_KEY" \
            -e YANDEX_CLOUD_FOLDER_ID="$YANDEX_CLOUD_FOLDER_ID" \
            -e SNAPSHOT_PROVIDER=yandex \
            -e SNAPSHOT_LIMIT=20 \
            -e SNAPSHOT_OUT=/tmp/stage-yandex-identical.json \
            aimeton-auditor python /tmp/collect_search_snapshot.py
          docker exec aimeton-auditor rm -f /tmp/collect_search_snapshot.py /tmp/stage-yandex-identical.json

  tavily-stage-identical-collector:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    steps:
      - name: Checkout exact successful collector
        uses: actions/checkout@v4
        with:
          ref: bench/krasnoyarsk-dentistry-search-strategies
      - name: Run identical Tavily collector inside Stage app container
        shell: bash
        env:
          TAVILY_TOKEN: ${{ secrets.TAVILY_TOKEN }}
        run: |
          set -Eeuo pipefail
          docker cp scripts/collect_search_snapshot.py aimeton-auditor:/tmp/collect_search_snapshot.py
          docker exec \
            -w /app \
            -e TAVILY_TOKEN="$TAVILY_TOKEN" \
            -e SNAPSHOT_PROVIDER=tavily \
            -e SNAPSHOT_LIMIT=20 \
            -e SNAPSHOT_OUT=/tmp/stage-tavily-identical.json \
            aimeton-auditor python /tmp/collect_search_snapshot.py
          docker exec aimeton-auditor rm -f /tmp/collect_search_snapshot.py /tmp/stage-tavily-identical.json
