name: Audit Stage Environment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/agent-triggers/audit-stage-environment
      - .github/workflows/audit-stage-environment.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: stage
    env:
      GH_ADMIN_TOKEN: ${{ secrets.AIMETON_ENVIRONMENT_ADMIN_TOKEN }}
      REPO: ${{ github.repository }}
      ENVIRONMENT_NAME: stage
    steps:
      - name: Validate audit token is available
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${GH_ADMIN_TOKEN:-}" ]]; then
            echo "AIMETON_ENVIRONMENT_ADMIN_TOKEN is not available to this workflow" >&2
            exit 1
          fi

      - name: Read sanitized environment inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/${REPO}/environments/${ENVIRONMENT_NAME}"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/secrets?per_page=100" > secrets.json

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_ADMIN_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/variables?per_page=100" > variables.json

      - name: Publish names-only contract check
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          secrets_data = json.loads(Path('secrets.json').read_text())
          variables_data = json.loads(Path('variables.json').read_text())

          secret_names = sorted(item['name'] for item in secrets_data.get('secrets', []))
          variable_names = sorted(item['name'] for item in variables_data.get('variables', []))

          expected_secrets = {
              'AIMETON_BOOTSTRAP_ADMIN_PASSWORD',
              'OS_APPLICATION_CREDENTIAL_SECRET',
              'ROUTERAI_API_KEY',
              'TAVILY_TOKEN',
          }
          expected_variables = {
              'AIMETON_BOOTSTRAP_ADMIN_USERNAME',
              'AIMETON_COOKIE_SECURE',
          }
          legacy_names = {
              'AUDITOR_BOOTSTRAP_ADMIN_PASSWORD',
              'AUDITOR_BOOTSTRAP_ADMIN_USERNAME',
              'AUDITOR_COOKIE_SECURE',
              'AUDITOR_ROUTERAI_API_KEY',
          }

          all_names = set(secret_names) | set(variable_names)
          failures = []

          print('## Stage environment sanitized inventory')
          print('\n### Secrets — names only')
          for name in secret_names:
              print(f'- `{name}`')
          print('\n### Variables — names only')
          for name in variable_names:
              print(f'- `{name}`')
          print('\n### Contract check')

          for name in sorted(expected_secrets):
              ok = name in secret_names
              print(f"- {'✅' if ok else '❌'} secret `{name}`")
              if not ok:
                  failures.append(f'missing secret {name}')

          for name in sorted(expected_variables):
              ok = name in variable_names
              print(f"- {'✅' if ok else '❌'} variable `{name}`")
              if not ok:
                  failures.append(f'missing variable {name}')

          for name in sorted(legacy_names):
              ok = name not in all_names
              print(f"- {'✅' if ok else '❌'} legacy absent `{name}`")
              if not ok:
                  failures.append(f'legacy name still present {name}')

          if failures:
              raise SystemExit('; '.join(failures))
          PY
