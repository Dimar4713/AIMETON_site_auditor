name: ACCB RouterAI Live Pilot

on:
  pull_request:
    paths:
      - 'scripts/accb_routerai_live_pilot.py'
      - 'scripts/accb_routerai_live_entrypoint.py'
      - 'scripts/accb_routerai_retry_entrypoint.py'
      - 'scripts/accb_routerai_free_slow_entrypoint.py'
      - 'scripts/accb_publish_evidence.py'
      - '.github/workflows/accb-routerai-live-pilot.yml'
      - 'docs/research/accb_snapshot/**'
      - 'docs/research/ACCB_ROUTERAI_LIVE_TRIGGER_2026-08-22.json'
  push:
    branches:
      - main
    paths:
      - 'docs/research/ACCB_ROUTERAI_LIVE_TRIGGER_2026-08-22.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: accb-routerai-live-pilot-${{ github.ref }}
  cancel-in-progress: false

env:
  ACCB_ARCHITECTURE_SHA: db18fcbc0a50d96af4e747db0ec2df10ca79f64c

jobs:
  validate:
    name: Validate ACCB RouterAI live harness
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Materialize exact Site Auditor commit without Marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: /tmp/aimeton-accb-site-validate-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile \
            scripts/accb_routerai_live_pilot.py \
            scripts/accb_routerai_live_entrypoint.py \
            scripts/accb_routerai_retry_entrypoint.py \
            scripts/accb_routerai_free_slow_entrypoint.py \
            scripts/accb_publish_evidence.py

      - name: Verify immutable ACCB architecture snapshot provenance
        shell: bash
        env:
          WORKDIR: /tmp/aimeton-accb-site-validate-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          cd "$WORKDIR"
          SNAPSHOT_ROOT="docs/research/accb_snapshot/$ACCB_ARCHITECTURE_SHA"
          python3 - "$SNAPSHOT_ROOT" "$ACCB_ARCHITECTURE_SHA" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected_commit = sys.argv[2]
          manifest = json.loads((root / 'SNAPSHOT_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['source_repository'] == 'Dimar4713/aimeton-architecture'
          assert manifest['source_commit'] == expected_commit
          files = manifest.get('files') or {}
          assert len(files) == 4, files
          for rel, expected_blob in files.items():
              path = root / rel
              assert path.is_file(), path
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert actual == expected_blob, (rel, actual, expected_blob)
          print(json.dumps({'snapshot_verified': True, 'source_commit': expected_commit, 'files': len(files)}, sort_keys=True))
          PY

      - name: Cleanup validation workspace
        if: always()
        shell: bash
        run: rm -rf /tmp/aimeton-accb-site-validate-${{ github.run_id }}

  live:
    name: Execute bounded RouterAI ACCB gate
    if: github.event_name == 'push'
    needs: validate
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
      ACCB_MAX_BUDGET_RUB: '100'
      ACCB_SITE_ROOT: /tmp/aimeton-accb-site-live-${{ github.run_id }}
      ACCB_ARCHITECTURE_ROOT: /tmp/aimeton-accb-site-live-${{ github.run_id }}/docs/research/accb_snapshot/db18fcbc0a50d96af4e747db0ec2df10ca79f64c
      ACCB_RESULT_PATH: /tmp/aimeton-accb-live-result-${{ github.run_id }}.json
      EVIDENCE_ISSUE: '798'

    steps:
      - name: Require owner-authorized bounded execution inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${ROUTERAI_API_KEY:-}" ]]
          [[ "$ACCB_ARCHITECTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - <<'PY'
          import os
          ceiling = float(os.environ['ACCB_MAX_BUDGET_RUB'])
          assert 0 < ceiling <= 100.0, ceiling
          PY

      - name: Materialize exact Site Auditor commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ACCB_SITE_ROOT"
          mkdir -p "$ACCB_SITE_ROOT"
          cd "$ACCB_SITE_ROOT"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile \
            scripts/accb_routerai_live_pilot.py \
            scripts/accb_routerai_live_entrypoint.py \
            scripts/accb_routerai_retry_entrypoint.py \
            scripts/accb_publish_evidence.py

      - name: Verify canonical ACCB snapshot before paid calls
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$ACCB_SITE_ROOT"
          python3 - "$ACCB_ARCHITECTURE_ROOT" "$ACCB_ARCHITECTURE_SHA" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          expected_commit = sys.argv[2]
          manifest = json.loads((root / 'SNAPSHOT_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['source_commit'] == expected_commit
          files = manifest.get('files') or {}
          assert len(files) == 4, files
          for rel, expected_blob in files.items():
              path = root / rel
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              assert actual == expected_blob, (rel, actual, expected_blob)
          print('canonical ACCB snapshot verified')
          PY

      - name: Execute bounded RouterAI live gate selected by trigger manifest
        shell: bash
        run: |
          set +e
          cd "$ACCB_SITE_ROOT"
          mode="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/research/ACCB_ROUTERAI_LIVE_TRIGGER_2026-08-22.json')
          print(json.loads(p.read_text(encoding='utf-8')).get('execution_mode', 'full-five'))
          PY
          )"
          case "$mode" in
            retry-failed-three)
              script='scripts/accb_routerai_retry_entrypoint.py'
              expected='3'
              label='ACCB RouterAI retry — DeepSeek/Kimi/GPT-5.6 Sol'
              ;;
            full-five)
              script='scripts/accb_routerai_live_entrypoint.py'
              expected='5'
              label='ACCB RouterAI 5-model paid micro-gate'
              ;;
            *)
              echo "unsupported ACCB execution_mode=$mode" >&2
              echo "ACCB_LIVE_RC=98" >> "$GITHUB_ENV"
              exit 0
              ;;
          esac
          echo "ACCB_EXECUTION_MODE=$mode" >> "$GITHUB_ENV"
          echo "ACCB_EXPECTED_MODELS=$expected" >> "$GITHUB_ENV"
          echo "ACCB_EVIDENCE_LABEL=$label" >> "$GITHUB_ENV"
          python3 "$script"
          rc=$?
          echo "ACCB_LIVE_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Publish sanitized main-model evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$ACCB_SITE_ROOT"
          python3 scripts/accb_publish_evidence.py \
            --result "$ACCB_RESULT_PATH" \
            --label "${ACCB_EVIDENCE_LABEL:-ACCB RouterAI bounded gate}" \
            --expected-models "${ACCB_EXPECTED_MODELS:-0}" \
            --issue "$EVIDENCE_ISSUE"

      - name: Enforce main integration gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rc="${ACCB_LIVE_RC:-99}"
          [[ "$rc" =~ ^[0-9]+$ ]]
          if [[ "$rc" != 0 ]]; then
            echo "ACCB RouterAI main live gate degraded; inspect evidence issue #$EVIDENCE_ISSUE" >&2
            exit "$rc"
          fi

      - name: Cleanup main live state
        if: always()
        shell: bash
        run: rm -rf "$ACCB_SITE_ROOT" "$ACCB_RESULT_PATH"

  free_slow:
    name: Execute non-gating free slow stealth/ox-alpha lane
    if: ${{ always() && github.event_name == 'push' && needs.validate.result == 'success' }}
    needs: [validate, live]
    continue-on-error: true
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
      ACCB_MAX_BUDGET_RUB: '1'
      ACCB_SITE_ROOT: /tmp/aimeton-accb-site-free-${{ github.run_id }}
      ACCB_ARCHITECTURE_ROOT: /tmp/aimeton-accb-site-free-${{ github.run_id }}/docs/research/accb_snapshot/db18fcbc0a50d96af4e747db0ec2df10ca79f64c
      ACCB_RESULT_PATH: /tmp/aimeton-accb-free-result-${{ github.run_id }}.json
      EVIDENCE_ISSUE: '798'

    steps:
      - name: Materialize exact Site Auditor commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ACCB_SITE_ROOT"
          mkdir -p "$ACCB_SITE_ROOT"
          cd "$ACCB_SITE_ROOT"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/accb_routerai_live_pilot.py scripts/accb_routerai_free_slow_entrypoint.py scripts/accb_publish_evidence.py

      - name: Execute free slow lane without gating main result
        shell: bash
        run: |
          set +e
          cd "$ACCB_SITE_ROOT"
          python3 scripts/accb_routerai_free_slow_entrypoint.py
          rc=$?
          echo "ACCB_FREE_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Publish sanitized free slow-lane evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$ACCB_SITE_ROOT"
          python3 scripts/accb_publish_evidence.py \
            --result "$ACCB_RESULT_PATH" \
            --label 'ACCB RouterAI free slow lane — stealth/ox-alpha' \
            --expected-models 1 \
            --issue "$EVIDENCE_ISSUE"

      - name: Record non-gating free-lane outcome
        if: always()
        shell: bash
        run: |
          echo "stealth/ox-alpha non-gating rc=${ACCB_FREE_RC:-99}" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Cleanup free slow state
        if: always()
        shell: bash
        run: rm -rf "$ACCB_SITE_ROOT" "$ACCB_RESULT_PATH"
