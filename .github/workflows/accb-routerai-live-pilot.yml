name: ACCB RouterAI Live Pilot

on:
  pull_request:
    paths:
      - 'scripts/accb_routerai_live_pilot.py'
      - '.github/workflows/accb-routerai-live-pilot.yml'
      - 'docs/research/ACCB_ROUTERAI_LIVE_TRIGGER_2026-08-22.json'
  push:
    branches:
      - main
    paths:
      - 'docs/research/ACCB_ROUTERAI_LIVE_TRIGGER_2026-08-22.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: accb-routerai-live-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ACCB RouterAI live harness
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Materialize exact Site Auditor commit without Marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKDIR: /tmp/aimeton-accb-site-validate-${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/accb_routerai_live_pilot.py

      - name: Cleanup validation workspace
        if: always()
        shell: bash
        run: rm -rf /tmp/aimeton-accb-site-validate-${{ github.run_id }}

  live:
    name: Execute bounded 5-model RouterAI ACCB low-context gate
    if: github.event_name == 'push'
    needs: validate
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
      ACCB_ARCHITECTURE_SHA: db18fcbc0a50d96af4e747db0ec2df10ca79f64c
      ACCB_MAX_BUDGET_RUB: '100'
      ACCB_SITE_ROOT: /tmp/aimeton-accb-site-live-${{ github.run_id }}
      ACCB_ARCHITECTURE_ROOT: /tmp/aimeton-accb-architecture-${{ github.run_id }}
      ACCB_RESULT_PATH: /tmp/aimeton-accb-live-result-${{ github.run_id }}.json
      EVIDENCE_ISSUE: '798'

    steps:
      - name: Require owner-authorized bounded execution inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${ROUTERAI_API_KEY:-}" ]]
          [[ "$ACCB_ARCHITECTURE_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - <<'PY'
          import os
          ceiling = float(os.environ['ACCB_MAX_BUDGET_RUB'])
          assert 0 < ceiling <= 100.0, ceiling
          PY

      - name: Materialize exact Site Auditor commit
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ACCB_SITE_ROOT"
          mkdir -p "$ACCB_SITE_ROOT"
          cd "$ACCB_SITE_ROOT"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile scripts/accb_routerai_live_pilot.py

      - name: Materialize exact ACCB architecture revision
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ACCB_ARCHITECTURE_ROOT"
          mkdir -p "$ACCB_ARCHITECTURE_ROOT"
          cd "$ACCB_ARCHITECTURE_ROOT"
          git init -q
          git remote add origin https://github.com/Dimar4713/aimeton-architecture.git
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch --no-tags --depth=1 origin "$ACCB_ARCHITECTURE_SHA"
          unset AUTH_HEADER
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$ACCB_ARCHITECTURE_SHA"
          python3 scripts/validate_accb.py

      - name: Execute bounded RouterAI live gate
        shell: bash
        run: |
          set +e
          cd "$ACCB_SITE_ROOT"
          python3 scripts/accb_routerai_live_pilot.py
          rc=$?
          echo "ACCB_LIVE_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Publish sanitized evidence summary
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          path = Path(os.environ['ACCB_RESULT_PATH'])
          if path.exists():
              payload = json.loads(path.read_text(encoding='utf-8'))
          else:
              payload = {
                  'experiment_id': 'ACCB-ROUTERAI-CAL-2026-08-22-LOW-001',
                  'models_scored': 0,
                  'estimated_spend_rub': 0,
                  'integration_errors': ['result file missing'],
                  'rows': [],
              }
          compact_rows = []
          for row in payload.get('rows') or []:
              score = row.get('score') or {}
              endpoint = row.get('endpoint') or {}
              usage = row.get('usage') or {}
              compact_rows.append({
                  'model': row.get('model_identifier'),
                  'status': row.get('status'),
                  'endpoint_tag': endpoint.get('tag'),
                  'context_length': endpoint.get('context_length'),
                  'prompt_tokens': usage.get('prompt_tokens'),
                  'completion_tokens': usage.get('completion_tokens'),
                  'estimated_cost_rub': row.get('estimated_cost_rub'),
                  'ACI': score.get('ACI'),
                  'ACI_min': score.get('ACI_min'),
                  'critical_failure_count': score.get('critical_failure_count'),
                  'critical_failures': score.get('critical_failures'),
                  'error': row.get('error'),
              })
          evidence = {
              'experiment_id': payload.get('experiment_id'),
              'architecture_sha': payload.get('architecture_sha'),
              'site_auditor_sha': payload.get('site_auditor_sha'),
              'budget_ceiling_rub': payload.get('budget_ceiling_rub'),
              'estimated_spend_rub': payload.get('estimated_spend_rub'),
              'models_scored': payload.get('models_scored'),
              'integration_errors': payload.get('integration_errors'),
              'rows': compact_rows,
              'scientific_claim_boundary': payload.get('scientific_claim_boundary'),
          }
          body = (
              '## ACCB RouterAI first live low-context gate\n\n'
              f'- workflow run: `{os.environ["GITHUB_RUN_ID"]}`\n'
              f'- owner-authorized micro-ceiling: `{os.environ["ACCB_MAX_BUDGET_RUB"]} RUB`\n'
              f'- architecture SHA: `{os.environ["ACCB_ARCHITECTURE_SHA"]}`\n'
              '- raw provider reasoning retained: `no`\n'
              '- scientific scope: integration/calibration gate, not threshold evidence\n\n'
              '```json\n' + json.dumps(evidence, ensure_ascii=False, sort_keys=True, indent=2) + '\n```\n'
          )
          repo = os.environ['GITHUB_REPOSITORY']
          issue = os.environ['EVIDENCE_ISSUE']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue}/comments',
              data=json.dumps({'body': body}, ensure_ascii=False).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              assert response.status == 201, response.status
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## ACCB RouterAI live gate\n\n')
                  handle.write(f'- models scored: `{evidence.get("models_scored")}` / `5`\n')
                  handle.write(f'- estimated spend: `{evidence.get("estimated_spend_rub")} RUB`\n')
                  handle.write(f'- integration errors: `{len(evidence.get("integration_errors") or [])}`\n')
          PY

      - name: Enforce integration gate
        shell: bash
        run: |
          set -Eeuo pipefail
          rc="${ACCB_LIVE_RC:-99}"
          [[ "$rc" =~ ^[0-9]+$ ]]
          if [[ "$rc" != 0 ]]; then
            echo "ACCB RouterAI live gate degraded; inspect evidence issue #$EVIDENCE_ISSUE" >&2
            exit "$rc"
          fi

      - name: Cleanup live state
        if: always()
        shell: bash
        run: |
          rm -rf "$ACCB_SITE_ROOT" "$ACCB_ARCHITECTURE_ROOT" "$ACCB_RESULT_PATH"
