name: Server Auth Persistence Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/agent-triggers/server-auth-persistence-audit"
      - ".github/workflows/server-auth-persistence-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Audit auth database persistence without secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /opt/aimeton/auditor-stack

          report="$RUNNER_TEMP/auth-persistence-report.md"
          : > "$report"

          echo "## Auth persistence audit" >> "$report"
          echo >> "$report"

          if ! docker ps --format '{{.Names}}' | grep -Fxq aimeton-auditor; then
            echo "- ❌ container aimeton-auditor is not running" >> "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          configured_user="$(docker inspect aimeton-auditor --format '{{if .Config.User}}{{.Config.User}}{{else}}<default-root>{{end}}')"
          runtime_user="$(docker exec aimeton-auditor sh -lc 'id -u 2>/dev/null || true')"
          auth_db="$(docker exec aimeton-auditor sh -lc 'printf %s "${AIMETON_AUTH_DB:-/app/data/runtime-core.sqlite3}"')"
          mount_count="$(docker inspect aimeton-auditor --format '{{len .Mounts}}')"
          data_mount="$(docker inspect aimeton-auditor --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}|{{.Source}}|{{.Destination}}{{end}}{{end}}')"

          echo "- container: ✅ running" >> "$report"
          echo "- configured user: \`$configured_user\`" >> "$report"
          echo "- runtime uid: \`$runtime_user\`" >> "$report"
          echo "- auth DB path: \`$auth_db\`" >> "$report"
          echo "- total mounts: \`$mount_count\`" >> "$report"

          if docker exec aimeton-auditor sh -lc "test -f '$auth_db'"; then
            echo "- auth DB exists: ✅" >> "$report"
          else
            echo "- auth DB exists: ❌" >> "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ -n "$data_mount" ]]; then
            echo "- /app/data persistence: ✅ \`$data_mount\`" >> "$report"
          else
            echo "- /app/data persistence: ❌ no bind/volume mount" >> "$report"
          fi

          backup="$(ls -1t backups/auth/runtime-core.sqlite3.*.bak 2>/dev/null | head -n1 || true)"
          if [[ -n "$backup" ]]; then
            integrity="$(python3 - "$backup" <<'PY'
import sqlite3, sys
p=sys.argv[1]
con=sqlite3.connect(f"file:{p}?mode=ro", uri=True)
print(con.execute("PRAGMA integrity_check").fetchone()[0])
con.close()
PY
)"
            echo "- latest backup: ✅ present" >> "$report"
            echo "- backup integrity: \`$integrity\`" >> "$report"
          else
            echo "- latest backup: ❌ absent" >> "$report"
            integrity="missing"
          fi

          echo >> "$report"
          if [[ -z "$data_mount" ]]; then
            echo "### Verdict" >> "$report"
            echo "❌ Auth DB is still inside the container filesystem; container recreation is unsafe." >> "$report"
          elif [[ "$integrity" != "ok" ]]; then
            echo "### Verdict" >> "$report"
            echo "❌ Persistence exists, but no verified backup is available." >> "$report"
          else
            echo "### Verdict" >> "$report"
            echo "✅ Auth DB is persistent and a verified backup exists." >> "$report"
          fi

          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          [[ -n "$data_mount" && "$integrity" == "ok" ]]
