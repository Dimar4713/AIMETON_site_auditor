name: Server Auth Persistence Audit

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-server-auth-persistence-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && github.event.issue.number == 159 && github.event.comment.body == '/audit-auth-persistence' && github.event.comment.user.login == 'Dimar4713') }}
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Audit auth database persistence without secrets
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /opt/aimeton/auditor-stack

          report="$RUNNER_TEMP/auth-persistence-report.md"
          : > "$report"
          verdict=fail

          echo "## Automated auth persistence evidence" >> "$report"
          echo >> "$report"
          echo "- workflow run: $GITHUB_RUN_ID" >> "$report"
          echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$report"
          echo "- runner: self-hosted / Linux / X64 / stage / auditor" >> "$report"
          echo "- mode: read-only" >> "$report"
          echo >> "$report"

          if ! docker ps --format '{{.Names}}' | grep -Fxq aimeton-auditor; then
            echo "- container: ❌ aimeton-auditor is not running" >> "$report"
          else
            configured_user="$(docker inspect aimeton-auditor --format '{{if .Config.User}}{{.Config.User}}{{else}}<default-root>{{end}}')"
            runtime_user="$(docker exec aimeton-auditor sh -lc 'id -u 2>/dev/null || true')"
            auth_db="$(docker exec aimeton-auditor sh -lc 'printf %s "${AIMETON_AUTH_DB:-/app/data/runtime-core.sqlite3}"')"
            mount_count="$(docker inspect aimeton-auditor --format '{{len .Mounts}}')"
            data_mount="$(docker inspect aimeton-auditor --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}|{{.Source}}|{{.Destination}}{{end}}{{end}}')"

            echo "- container: ✅ running" >> "$report"
            echo "- configured user: \`$configured_user\`" >> "$report"
            echo "- runtime uid: \`$runtime_user\`" >> "$report"
            echo "- auth DB path: \`$auth_db\`" >> "$report"
            echo "- total mounts: \`$mount_count\`" >> "$report"

            db_exists=no
            if docker exec aimeton-auditor sh -lc "test -f '$auth_db'"; then
              db_exists=yes
              echo "- auth DB exists: ✅" >> "$report"
            else
              echo "- auth DB exists: ❌" >> "$report"
            fi

            if [[ -n "$data_mount" ]]; then
              echo "- /app/data persistence: ✅ \`$data_mount\`" >> "$report"
            else
              echo "- /app/data persistence: ❌ no bind/volume mount" >> "$report"
            fi

            backup="$(ls -1t backups/auth/runtime-core.sqlite3.*.bak 2>/dev/null | head -n1 || true)"
            integrity=missing
            if [[ -n "$backup" ]]; then
              integrity="$(python3 -c 'import sqlite3,sys; con=sqlite3.connect("file:"+sys.argv[1]+"?mode=ro", uri=True); print(con.execute("PRAGMA integrity_check").fetchone()[0]); con.close()' "$backup")"
              echo "- latest backup: ✅ present" >> "$report"
              echo "- backup integrity: \`$integrity\`" >> "$report"
            else
              echo "- latest backup: ❌ absent" >> "$report"
            fi

            echo >> "$report"
            echo "### Verdict" >> "$report"
            if [[ "$db_exists" == yes && -n "$data_mount" && "$integrity" == ok ]]; then
              verdict=pass
              echo "✅ Auth DB is persistent and a verified backup exists." >> "$report"
            elif [[ "$db_exists" == yes && -z "$data_mount" && "$integrity" == ok ]]; then
              verdict=blocked
              echo "⚠️ Migration is ready to plan: DB and verified backup exist, but /app/data is not mounted persistently." >> "$report"
            else
              echo "❌ Preconditions are incomplete; controlled migration must not run." >> "$report"
            fi
          fi

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: auth-persistence-audit-${{ github.run_id }}
          path: ${{ steps.audit.outputs.report }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitized evidence to SA-03.4
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ steps.audit.outputs.report }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 159,
              body: report.slice(0, 60000),
            });

      - name: Enforce persistence gate
        shell: bash
        env:
          VERDICT: ${{ steps.audit.outputs.verdict }}
        run: |
          case "$VERDICT" in
            pass) exit 0 ;;
            blocked)
              echo "Persistence migration is required and has not been applied." >&2
              exit 2
              ;;
            *) exit 1 ;;
          esac
