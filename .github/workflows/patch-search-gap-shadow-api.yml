name: Patch Search Gap Shadow API

on:
  push:
    branches:
      - feat/search-gap-shadow-api-metadata-632

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch API metadata wiring
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit clean result
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/patch-search-gap-shadow-api.yml
          git config user.name "AIMETON Agent"
          git config user.email "127470701+Dimar4713@users.noreply.github.com"
          git add app/main.py tests/test_search_gap_shadow_api.py .github/workflows/patch-search-gap-shadow-api.yml
          git diff --cached --check
          git commit -m "feat: expose shadow search refinement metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
