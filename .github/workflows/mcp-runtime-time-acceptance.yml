name: MCP Runtime Time Acceptance

on:
  push:
    branches: [main]
    paths:
      - "app/mcp_server.py"
      - "app/runtime_time.py"
      - "scripts/accept_mcp_runtime_time.py"
      - ".github/workflows/mcp-runtime-time-acceptance.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact application SHA to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mcp-runtime-time-acceptance
  cancel-in-progress: false

env:
  TARGET_REF: ${{ inputs.ref || github.sha }}

jobs:
  accept:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Validate exact SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact application SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Verify exact SHA is on main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_REF"
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_REF" origin/main

      - name: Install MCP client dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-mcp-acceptance
          .venv-mcp-acceptance/bin/pip install --disable-pip-version-check --quiet 'mcp>=1.0,<2'

      - name: Call runtime.time through live MCP transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/mcp-runtime-time
          .venv-mcp-acceptance/bin/python scripts/accept_mcp_runtime_time.py \
            --url https://stage-auditor.aimeton.ru/mcp/ \
            --evidence evidence/mcp-runtime-time/result.json

      - name: Publish exact-SHA evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-runtime-time-${{ env.TARGET_REF }}
          path: evidence/mcp-runtime-time/result.json
          if-no-files-found: error
          retention-days: 30
