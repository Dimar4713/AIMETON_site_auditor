name: Temporary Regenerate Search Diagnostics Schemas

on:
  push:
    branches:
      - fix/search-singleflight-441

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-singleflight-441
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Regenerate and verify committed schemas
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/export_identity_evidence_schemas.py
          pytest -q tests/test_identity_evidence.py::test_committed_identity_evidence_schemas_are_current_and_valid tests/test_search_singleflight.py
          git config user.name 'AIMETON Contract Sync'
          git config user.email '127470701+Dimar4713@users.noreply.github.com'
          git add schemas/identity-search-v0.1.schema.json schemas/identity-evidence-v0.1.schema.json
          git commit -m 'Sync identity schemas with coalesced search diagnostics'
          git push origin HEAD:fix/search-singleflight-441
