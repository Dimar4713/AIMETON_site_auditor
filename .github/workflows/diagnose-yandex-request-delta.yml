name: Diagnose Yandex Request Delta

on:
  push:
    branches:
      - diag/stage-search-egress
    paths:
      - .github/workflows/diagnose-yandex-request-delta.yml
      - scripts/diagnose_yandex_request_delta.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: YANDEX_SEARCH
    timeout-minutes: 10
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
      - name: Test Yandex payload variants from Stage container
        shell: bash
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_CLOUD_FOLDER_ID: ${{ vars.YANDEX_CLOUD_FOLDER_ID }}
        run: |
          set -Eeuo pipefail
          docker cp scripts/diagnose_yandex_request_delta.py aimeton-auditor:/tmp/diagnose_yandex_request_delta.py
          docker exec \
            -e YANDEX_SEARCH_API_KEY="$YANDEX_SEARCH_API_KEY" \
            -e YANDEX_CLOUD_FOLDER_ID="$YANDEX_CLOUD_FOLDER_ID" \
            aimeton-auditor python /tmp/diagnose_yandex_request_delta.py
          docker exec aimeton-auditor rm -f /tmp/diagnose_yandex_request_delta.py
