name: Server Architecture Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA to audit
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-server-architecture-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      STAGE_URL: https://stage-auditor.aimeton.ru
    steps:
      - name: Verify exact deployed SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ inputs.expected_sha }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          deployed="$(tr -d '[:space:]' < "$STACK_DIR/app-source-sha.txt")"
          [[ "$deployed" == "$expected" ]]

      - uses: actions/checkout@v4

      - name: Collect sanitized read-only evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/server_architecture_audit.sh
          scripts/server_architecture_audit.sh server-audit.md
          test -s server-audit.md

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-server-architecture-audit-${{ github.run_id }}
          path: server-audit.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitized summary to SA-03
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('server-audit.md', 'utf8');
            const header = `## Automated server evidence\n\nWorkflow run: ${context.runId}\n\n`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 36,
              body: header + report.slice(0, 60000),
            });
