name: Temporary Accept SearXNG Cooldown Health 099C

on:
  push:
    branches:
      - diag/accept-searxng-cooldown-health-099c

permissions:
  contents: read

jobs:
  accept:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 5
    steps:
      - name: Verify public health and typed cooldown state without external search calls
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='099c1a29bc27d51be2ac4acda5fecc184e210182'
          deployed="$(cat /opt/aimeton/auditor-stack/app-source-sha.txt)"
          [[ "$deployed" == "$expected" ]]

          health_json="$(curl --fail --silent --show-error https://stage-auditor.aimeton.ru/api/search/health)"
          docker exec -e HEALTH_JSON="$health_json" -i aimeton-auditor python - <<'PY'
          import json, os
          payload = json.loads(os.environ['HEALTH_JSON'])
          assert payload['status'] in {'ok', 'degraded'}
          assert payload['secrets_exposed'] is False
          providers = payload['providers']
          searxng = next(item for item in providers if item['provider'] == 'searxng')
          assert searxng['state'] in {
              'active', 'circuit_open', 'not_configured', 'policy_blocked',
              'contract_blocked', 'quota_blocked', 'budget_blocked', 'pricing_unknown'
          }
          for item in searxng.get('upstream_cooldowns', []):
              assert item['upstream']
              assert item['reason'] in {
                  'captcha', 'rate_limited', 'provider_blocked',
                  'provider_error', 'protocol_error'
              }
              assert isinstance(item['retry_after_seconds'], int)
              assert item['retry_after_seconds'] >= 0
          serialized = json.dumps(payload).lower()
          assert 'secret-' not in serialized
          print(json.dumps({
              'public_health_status': payload['status'],
              'public_searxng_state': searxng['state'],
              'public_cooldown_count': len(searxng.get('upstream_cooldowns', [])),
          }, sort_keys=True))
          PY

          docker exec -i aimeton-auditor python - <<'PY'
          import asyncio
          import json
          import httpx

          from app.search_gateway.gateway import SearchGateway
          from app.search_gateway.models import ProviderReadiness, SearchPolicy, SearchRequest
          from app.search_gateway.providers import SearxngProvider
          from app.search_gateway.scheduler import ScheduledProvider

          class Clock:
              def __init__(self):
                  self.now = 1000.0
              def __call__(self):
                  return self.now

          def req(name):
              return SearchRequest(
                  query=name,
                  limit=3,
                  language='ru-RU',
                  mission_id='accept-cooldown-health-099c',
                  correlation_id=f'accept-{name}',
              )

          async def partial_case():
              clock = Clock()
              mock_calls = 0
              def handler(request: httpx.Request):
                  nonlocal mock_calls
                  mock_calls += 1
                  return httpx.Response(200, json={
                      'results': [{'url': 'https://example.invalid/', 'title': 'ok', 'content': 'ok'}],
                      'unresponsive_engines': [['duckduckgo', 'CAPTCHA']],
                  })
              provider = ScheduledProvider(
                  SearxngProvider(
                      'https://search.invalid',
                      engines=('duckduckgo', 'bing'),
                      engine_fanout=2,
                      engine_block_cooldown_seconds=100.0,
                      clock=clock,
                      transport=httpx.MockTransport(handler),
                  ),
                  max_concurrency=1,
              )
              gateway = SearchGateway([provider])
              policy = SearchPolicy(provider_order=('searxng',), retries=0, cache_ttl_seconds=0)
              await gateway.search(req('partial'), policy)
              health = gateway.health(policy)[0]
              assert health.state is ProviderReadiness.ACTIVE
              assert health.ready is True
              assert health.upstream_cooldowns is not None
              row = health.upstream_cooldowns[0]
              assert row.upstream == 'duckduckgo'
              assert row.reason.value == 'captcha'
              assert row.retry_after_seconds == 100
              return mock_calls

          async def all_case():
              clock = Clock()
              mock_calls = 0
              def handler(request: httpx.Request):
                  nonlocal mock_calls
                  mock_calls += 1
                  engines = request.url.params['engines'].split(',')
                  return httpx.Response(200, json={
                      'results': [{'url': 'https://example.invalid/', 'title': 'ok', 'content': 'ok'}],
                      'unresponsive_engines': [[name, 'HTTP 429 Too Many Requests'] for name in engines],
                  })
              provider = ScheduledProvider(
                  SearxngProvider(
                      'https://search.invalid',
                      engines=('duckduckgo', 'startpage'),
                      engine_fanout=2,
                      engine_rate_limit_cooldown_seconds=20.0,
                      clock=clock,
                      transport=httpx.MockTransport(handler),
                  ),
                  max_concurrency=1,
              )
              gateway = SearchGateway([provider])
              policy = SearchPolicy(provider_order=('searxng',), retries=0, cache_ttl_seconds=0)
              await gateway.search(req('all'), policy)
              health = gateway.health(policy)[0]
              assert health.state is ProviderReadiness.CIRCUIT_OPEN
              assert health.ready is False
              assert health.circuit_state == 'open'
              assert health.upstream_cooldowns is not None
              assert {row.upstream for row in health.upstream_cooldowns} == {'duckduckgo', 'startpage'}
              assert all(row.reason.value == 'rate_limited' for row in health.upstream_cooldowns)
              assert all(row.retry_after_seconds == 20 for row in health.upstream_cooldowns)
              return mock_calls

          async def main():
              return await partial_case(), await all_case()

          partial_calls, all_calls = asyncio.run(main())
          print(json.dumps({
              'deployed_sha': '099c1a29bc27d51be2ac4acda5fecc184e210182',
              'partial_state': 'active',
              'all_engines_state': 'circuit_open',
              'typed_recovery': True,
              'mock_transport_calls': partial_calls + all_calls,
              'external_provider_calls': 0,
          }, sort_keys=True))
          PY
