name: Baseline CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: baseline-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VENV_DIR: /tmp/aimeton-baseline-${{ github.run_id }}

    steps:
      - name: Materialize exact commit without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            git init
          fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cleanup_auth() {
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git" 2>/dev/null || true
          }
          trap cleanup_auth EXIT
          fetched=false
          for attempt in 1 2 3 4 5; do
            if git fetch --no-tags --depth=1 origin "$TARGET_SHA"; then
              fetched=true
              break
            fi
            test "$attempt" -lt 5
            sleep $((attempt * attempt + 1))
          done
          test "$fetched" = true
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          cleanup_auth
          trap - EXIT

      - name: Prove external runner tool cache in job context
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = 'aimeton-site-auditor-stage'
          test "$(hostname)" = 'aimeton-main-server'
          cache_mount=/mnt/aimeton-dependency-cache
          expected="${cache_mount}/toolchains/runners/${RUNNER_NAME}"
          test "${RUNNER_TOOL_CACHE:-}" = "$expected"
          test -d "$expected"
          mountpoint -q "$cache_mount"
          root_source="$(findmnt -n -o SOURCE /)"
          cache_source="$(findmnt -n -o SOURCE "$cache_mount")"
          tool_source="$(findmnt -n -o SOURCE -T "$expected")"
          test -n "$cache_source"
          test "$cache_source" != "$root_source"
          test "$tool_source" = "$cache_source"
          echo "runner_tool_cache_job_proof=verified runner=$RUNNER_NAME cache=$RUNNER_TOOL_CACHE source=$cache_source"

      - name: Create isolated local Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$VENV_DIR"
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/pip" install -r requirements.txt

      - name: Record environment
        shell: bash
        run: |
          set -Eeuo pipefail
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" freeze | sort | tee baseline-dependencies.txt

      - name: Validate deployment script syntax
        shell: bash
        run: bash -n scripts/deploy_stage.sh

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          "$VENV_DIR/bin/pytest" -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Verify application import
        shell: bash
        run: "$VENV_DIR/bin/python -c \"from app.main import app; assert app.title == 'AIMETON Site Auditor'; print(app.version)\""

      - name: Local API and MCP route smoke
        shell: bash
        run: |
          "$VENV_DIR/bin/python" - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          paths = {
              path
              for route in app.routes
              if (path := getattr(route, "path", None)) is not None
          }
          assert "/api/health" in paths
          assert any(path == "/mcp" or path.startswith("/mcp") for path in paths)

          with TestClient(app) as client:
              response = client.get("/api/health")
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload["status"] == "ok"
              assert payload["version"] == app.version
              print(payload)
          PY

      - name: Record baseline diagnostics without artifact service
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '## Baseline CI evidence'
            echo
            echo "- runner: \`$RUNNER_NAME\`"
            echo "- machine: \`$(hostname)\`"
            echo "- exact SHA: \`$TARGET_SHA\`"
            echo '- GitHub Marketplace actions: `disabled`'
            echo "- runner tool cache: \`${RUNNER_TOOL_CACHE:-MISSING}\`"
            echo "- dependency cache source: \`$(findmnt -n -o SOURCE /mnt/aimeton-dependency-cache 2>/dev/null || echo MISSING)\`"
            echo
            echo '### pytest tail'
            echo '```text'
            tail -n 80 pytest-output.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup isolated Python environment
        if: always()
        shell: bash
        run: rm -rf "$VENV_DIR"
