name: Baseline CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to validate
        required: true
        type: string
      evidence_issue:
        description: Optional Issue number for terminal evidence
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: baseline-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_ISSUE: ${{ github.event.inputs.evidence_issue || '' }}
      VENV_DIR: ${{ runner.temp }}/aimeton-baseline-${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Materialize exact commit without marketplace actions
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then
            git init
          fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$TARGET_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Create isolated local Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$VENV_DIR"
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/pip" install -r requirements.txt

      - name: Record environment
        shell: bash
        run: |
          set -Eeuo pipefail
          "$VENV_DIR/bin/python" --version
          "$VENV_DIR/bin/pip" freeze | sort | tee baseline-dependencies.txt

      - name: Validate deployment script syntax
        shell: bash
        run: bash -n scripts/deploy_stage.sh

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          "$VENV_DIR/bin/pytest" -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Verify application import
        shell: bash
        run: "$VENV_DIR/bin/python -c \"from app.main import app; assert app.title == 'AIMETON Site Auditor'; print(app.version)\""

      - name: Local API and MCP route smoke
        shell: bash
        run: |
          "$VENV_DIR/bin/python" - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          paths = {
              path
              for route in app.routes
              if (path := getattr(route, "path", None)) is not None
          }
          assert "/api/health" in paths
          assert any(path == "/mcp" or path.startswith("/mcp") for path in paths)

          with TestClient(app) as client:
              response = client.get("/api/health")
              assert response.status_code == 200, response.text
              payload = response.json()
              assert payload["status"] == "ok"
              assert payload["version"] == app.version
              print(payload)
          PY

      - name: Record baseline diagnostics without artifact service
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '## Baseline CI evidence'
            echo
            echo "- runner: \`$RUNNER_NAME\`"
            echo "- machine: \`$(hostname)\`"
            echo "- exact SHA: \`$TARGET_SHA\`"
            echo '- GitHub Marketplace actions: `disabled`'
            echo
            echo '### pytest tail'
            echo '```text'
            tail -n 80 pytest-output.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish terminal evidence for owner-dispatched validation
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          try:
              issue_number = int(os.environ['EVIDENCE_ISSUE'])
          except (KeyError, ValueError):
              raise SystemExit(0)
          body = '\n'.join([
              '## Self-hosted Baseline evidence',
              '',
              f"- exact SHA: `{os.environ['TARGET_SHA']}`",
              f"- run: {os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              f"- runner: `{os.environ.get('RUNNER_NAME', 'unknown')}`",
              f"- machine: `{os.uname().nodename}`",
              f"- terminal job status: **{os.environ.get('JOB_STATUS', 'unknown')}**",
              '- GitHub-hosted runner minutes: **0**',
              '- GitHub Marketplace actions: **disabled**',
          ])
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue_number}/comments",
              data=json.dumps({'body': body}).encode('utf-8'),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(response.status)
          PY

      - name: Cleanup isolated Python environment
        if: always()
        shell: bash
        run: rm -rf "$VENV_DIR"
