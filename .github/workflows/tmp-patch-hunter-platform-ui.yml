name: Temporary Patch Hunter Platform Source UI

on:
  push:
    branches:
      - fix/hunter-platform-sources

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[platform-ui-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hunter-platform-sources
          fetch-depth: 1

      - name: Patch UI supporting platform hosts and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('static/service-catalog.js')
          text=path.read_text(encoding='utf-8')
          old="    'poidata.io', 'barb.pro', '1dentist.ru', 'yp.ru', 'yandex.com',\n"
          new="    'poidata.io', 'barb.pro', '1dentist.ru', 'yp.ru', '2gis.ru', 'vk.com', 'vk.ru', 'yandex.com', 'yandex.ru',\n"
          if text.count(old) != 1:
              raise SystemExit('supporting platform host block drifted')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/tmp-patch-hunter-platform-ui.yml
          git config user.name 'AIMETON Quality Patch'
          git config user.email '127470701+Dimar4713@users.noreply.github.com'
          git add static/service-catalog.js .github/workflows/tmp-patch-hunter-platform-ui.yml
          git commit -m 'Align Hunter UI platform supporting sources [platform-ui-patched]'
          git push origin HEAD:fix/hunter-platform-sources
