name: One-shot RouterAI commercial reasoning envelope

on:
  pull_request:
    paths:
      - ".github/workflows/one-shot-routerai-commercial-envelope.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/routerai-commercial-envelope-700
          fetch-depth: 0
      - name: Prepare focused test environment
        run: |
          python -m venv .venv-one-shot
          . .venv-one-shot/bin/activate
          python -m pip install -q pytest pytest-asyncio pydantic httpx
      - name: Apply commercial envelope patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/routerai_split_v2.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from datetime import datetime, timezone\n\nfrom app.models import SiteAnalysis\n',
              'from datetime import datetime, timezone\nfrom typing import Annotated, Literal\n\nfrom pydantic import BaseModel, Field\n\nfrom app.models import SiteAnalysis\n',
              1,
          )
          anchor = 'from app.routerai_strict_request import request_json_strict\n\n\n'
          insert = '''from app.routerai_strict_request import request_json_strict\n\n\nCompactText80 = Annotated[str, Field(max_length=80)]\nCompactText140 = Annotated[str, Field(max_length=140)]\nCompactText220 = Annotated[str, Field(max_length=220)]\n\n\nclass CompactCommercialOpportunity(BaseModel):\n    opportunity_type: CompactText80\n    problem_hypothesis: CompactText220\n    recommended_solution: CompactText220\n    expected_value: CompactText180 = Field(max_length=180)\n    score: int = Field(ge=0, le=100)\n    qualification: Literal["Приоритетная", "Перспективная", "Наблюдение", "Недостаточно данных"]\n\n\nclass CompactAgentRecommendation(BaseModel):\n    name: CompactText80\n    purpose: CompactText140\n    benefit: CompactText140\n    priority: Literal["Высокий", "Средний", "Низкий"] = "Средний"\n\n\nclass CompactActionPackage(BaseModel):\n    decision_maker_hypothesis: CompactText140\n    contact_reason: CompactText180 = Field(max_length=180)\n    demo_scenario: list[CompactText140] = Field(default_factory=list, max_length=3)\n    first_message: CompactText220\n    next_action: CompactText140\n\n\nclass CompactCommercialSynthesis(BaseModel):\n    commercial_opportunity: CompactCommercialOpportunity\n    agents: list[CompactAgentRecommendation] = Field(min_length=3, max_length=5)\n    action_package: CompactActionPackage\n\n\ndef _expand_commercial(compact: CompactCommercialSynthesis) -> CommercialSynthesis:\n    return CommercialSynthesis.model_validate(compact.model_dump(mode="python"))\n\n\n'''
          # Avoid an alias typo by defining the 180 type before classes.
          insert = insert.replace(
              'CompactText220 = Annotated[str, Field(max_length=220)]\\n\\n\\nclass CompactCommercialOpportunity',
              'CompactText220 = Annotated[str, Field(max_length=220)]\\nCompactText180 = Annotated[str, Field(max_length=180)]\\n\\n\\nclass CompactCommercialOpportunity',
          )
          if anchor not in text:
              raise SystemExit('import anchor not found')
          text = text.replace(anchor, insert, 1)
          text = text.replace(
              'реалистичное решение, 3–10 AI-агентов/инструментов и пакет первого контакта.',
              'реалистичное решение, 3–5 AI-агентов/инструментов и компактный пакет первого контакта.',
              1,
          )
          old = '''        _request_json(\n            "commercial_reasoning",\n            CommercialSynthesis,\n            system="Возвращай только компактный валидный JSON по схеме. Главный результат — доказанная коммерческая возможность.",\n            prompt=commercial_prompt,\n            max_tokens=1500,\n            timeout_seconds=25.0,\n        ),'''
          new = '''        request_json_strict(\n            "commercial_reasoning",\n            CompactCommercialSynthesis,\n            system="Возвращай только компактный валидный JSON по схеме. Главный результат — доказанная коммерческая возможность.",\n            prompt=commercial_prompt,\n            max_tokens=1500,\n            timeout_seconds=25.0,\n        ),'''
          if old not in text:
              raise SystemExit('commercial call anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        commercial=commercial_result,\n',
              '        commercial=_expand_commercial(commercial_result),\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_routerai_split_v2.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '    async def fake_request(phase, model_type, **kwargs):\n',
              '    async def fake_request(phase, model_type, **kwargs):\n',
              1,
          )
          tests = tests.replace(
              '        if model_type is CommercialSynthesis:\n            return CommercialSynthesis(\n                commercial_opportunity=CommercialOpportunity(\n',
              '        raise AssertionError(model_type)\n\n    async def fake_strict_request(phase, model_type, **kwargs):\n        phases.append(phase)\n        if model_type is split_v2.CompactCommercialSynthesis:\n            return split_v2.CompactCommercialSynthesis(\n                commercial_opportunity=split_v2.CompactCommercialOpportunity(\n',
              1,
          )
          tests = tests.replace('                agents=[\n                    AgentRecommendation(', '                agents=[\n                    split_v2.CompactAgentRecommendation(', 1)
          tests = tests.replace('                    AgentRecommendation(name="A2"', '                    split_v2.CompactAgentRecommendation(name="A2"', 1)
          tests = tests.replace('                    AgentRecommendation(name="A3"', '                    split_v2.CompactAgentRecommendation(name="A3"', 1)
          tests = tests.replace('                action_package=ActionPackage(', '                action_package=split_v2.CompactActionPackage(', 1)
          # Remove the now-extra old raise following the commercial branch.
          tests = tests.replace('            )\n        raise AssertionError(model_type)\n\n    monkeypatch.setattr(split_v2, "extract_profile_parallel", fake_profile)', '            )\n        raise AssertionError(model_type)\n\n    monkeypatch.setattr(split_v2, "extract_profile_parallel", fake_profile)', 1)
          tests = tests.replace(
              '    monkeypatch.setattr(split_v2, "_request_json", fake_request)\n',
              '    monkeypatch.setattr(split_v2, "_request_json", fake_request)\n    monkeypatch.setattr(split_v2, "request_json_strict", fake_strict_request)\n',
              1,
          )
          tests += '''\n\ndef test_split_v2_commercial_envelope_is_bounded_without_changing_public_models() -> None:\n    schema = split_v2.CompactCommercialSynthesis.model_json_schema()\n    assert schema["properties"]["agents"]["minItems"] == 3\n    assert schema["properties"]["agents"]["maxItems"] == 5\n    action_ref = schema["properties"]["action_package"]["$ref"].split("/")[-1]\n    action_schema = schema["$defs"][action_ref]\n    assert action_schema["properties"]["demo_scenario"]["maxItems"] == 3\n\n    compact = split_v2.CompactCommercialSynthesis(\n        commercial_opportunity=split_v2.CompactCommercialOpportunity(\n            opportunity_type="AI audit", problem_hypothesis="Manual review",\n            recommended_solution="Pilot", expected_value="Faster evidence",\n            score=70, qualification="Перспективная",\n        ),\n        agents=[\n            split_v2.CompactAgentRecommendation(name="A1", purpose="Search", benefit="Speed"),\n            split_v2.CompactAgentRecommendation(name="A2", purpose="Analyze", benefit="Evidence"),\n            split_v2.CompactAgentRecommendation(name="A3", purpose="Report", benefit="Structure"),\n        ],\n        action_package=split_v2.CompactActionPackage(\n            decision_maker_hypothesis="Digital lead", contact_reason="Pilot",\n            demo_scenario=["Run audit"], first_message="Pilot proposal", next_action="Demo",\n        ),\n    )\n    expanded = split_v2._expand_commercial(compact)\n    assert isinstance(expanded, CommercialSynthesis)\n    assert len(expanded.agents) == 3\n    assert expanded.commercial_opportunity.score == 70\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Run focused tests and invariants
        shell: bash
        run: |
          . .venv-one-shot/bin/activate
          pytest -q tests/test_routerai_split_v2.py tests/test_routerai_strict_request.py tests/test_routerai_profile_extraction.py
          grep -q 'max_tokens=1500' app/routerai_split_v2.py
          grep -q 'timeout_seconds=25.0' app/routerai_split_v2.py
          grep -q '"km_reasoning"' app/routerai_split_v2.py
          grep -q 'request_json_strict(' app/routerai_split_v2.py
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/one-shot-routerai-commercial-envelope.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/routerai_split_v2.py tests/test_routerai_split_v2.py .github/workflows/one-shot-routerai-commercial-envelope.yml
          git commit -m 'fix: bound split-v2 commercial reasoning output'
          git push origin HEAD:fix/routerai-commercial-envelope-700
