name: AIMETON Command Router

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: aimeton-command-router-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  route:
    if: >-
      github.event.comment.user.login == 'Dimar4713' &&
      startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse, authorize and dispatch one command
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = (process.env.COMMENT_BODY || '').trim();
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const match = body.match(/^\/(deploy-stage|accept-admin-trace-stage|accept-aimeton-self-audit-stage|accept-checkpoint-stage|accept-mobile-ui-stage|accept-service-catalog-stage|accept-logging-pressure-stage|accept-live-analysis-stage|accept-interface-audit-stage|accept-ui-stage|accept-user-workspace-stage|accept-admin-workspace-stage|accept-mission-stage-v2|accept-integrated-stage-continuity|accept-integrated-stage-core|audit-server-architecture|accept-integrated-stage-companies-bootstrap|audit-auth-persistence|diagnose-mission-stage|reconcile-stage-data-mount)\s+([0-9a-f]{40})$/);

            if (!match) {
              core.notice('Ignored unsupported slash command; no downstream workflow dispatched.');
              await core.summary
                .addHeading('AIMETON command router')
                .addList([
                  `issue: ${issueNumber}`,
                  'result: ignored',
                  'reason: unsupported_or_invalid_command',
                ])
                .write();
              return;
            }

            const [, command, sha] = match;
            const routes = {
              'deploy-stage': {
                issue_number: 337,
                workflow_id: 'deploy-stage.yml',
                inputs: {commit_sha: sha},
              },
              'accept-admin-trace-stage': {
                issue_number: 293,
                workflow_id: 'accept-admin-trace-stage.yml',
                inputs: {expected_sha: sha},
              },
              'accept-aimeton-self-audit-stage': {
                issue_number: 293,
                workflow_id: 'accept-aimeton-self-audit-stage.yml',
                inputs: {expected_sha: sha},
              },
              'accept-checkpoint-stage': {
                issue_number: 88,
                workflow_id: 'accept-checkpoint-stage.yml',
                inputs: {expected_sha: sha},
              },
              'accept-mobile-ui-stage': {
                issue_number: 223,
                workflow_id: 'accept-mobile-ui-stage.yml',
                inputs: {expected_sha: sha},
              },
              'accept-service-catalog-stage': {
                issue_number: 274,
                workflow_id: 'accept-service-catalog-stage.yml',
                inputs: {expected_sha: sha},
              },
              'accept-logging-pressure-stage': {
                issue_number: 293,
                workflow_id: 'accept-logging-pressure-stage.yml',
                inputs: {expected_sha: sha},
              },
              'accept-live-analysis-stage': {
                issue_number: 270,
                workflow_id: 'accept-live-analysis-stage.yml',
                inputs: {expected_sha: sha},
              },
              'accept-interface-audit-stage': {
                issue_number: 291,
                workflow_id: 'interface-audit-stage-acceptance.yml',
                inputs: {expected_sha: sha},
              },
              'accept-ui-stage': {
                issue_number: 262,
                workflow_id: 'ui-stage-visual-audit.yml',
                inputs: {expected_sha: sha},
              },
              'accept-user-workspace-stage': {
                issue_number: 192,
                workflow_id: 'stage-user-workspace-acceptance.yml',
                inputs: {expected_sha: sha},
              },
              'accept-admin-workspace-stage': {
                issue_number: 197,
                workflow_id: 'stage-admin-workspace-acceptance.yml',
                inputs: {expected_sha: sha},
              },
              'accept-mission-stage-v2': {
                issue_number: 177,
                workflow_id: 'stage-mission-ownership-acceptance-v2.yml',
                inputs: {expected_sha: sha},
              },
              'accept-integrated-stage-continuity': {
                issue_number: 203,
                workflow_id: 'stage-integrated-continuity.yml',
                inputs: {expected_sha: sha},
              },
              'accept-integrated-stage-core': {
                issue_number: 203,
                workflow_id: 'stage-integrated-acceptance.yml',
                inputs: {expected_sha: sha},
              },
              'audit-server-architecture': {
                issue_number: 36,
                workflow_id: 'server-architecture-audit.yml',
                inputs: {expected_sha: sha},
              },
              'accept-integrated-stage-companies-bootstrap': {
                issue_number: 203,
                workflow_id: 'stage-real-company-bootstrap-acceptance.yml',
                inputs: {expected_sha: sha},
              },
              'audit-auth-persistence': {
                issue_number: 159,
                workflow_id: 'server-auth-persistence-audit.yml',
                inputs: {expected_sha: sha},
              },
              'diagnose-mission-stage': {
                issue_number: 177,
                workflow_id: 'stage-mission-diagnostics.yml',
                inputs: {expected_sha: sha},
              },
              'reconcile-stage-data-mount': {
                issue_number: 177,
                workflow_id: 'stage-data-mount-reconcile.yml',
                inputs: {expected_sha: sha},
              },
            };

            const route = routes[command];
            if (issueNumber !== route.issue_number) {
              core.setFailed(`Command ${command} is not authorised on issue ${issueNumber}.`);
              return;
            }

            await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: route.workflow_id,
              ref: 'main',
              inputs: route.inputs,
            });

            await core.summary
              .addHeading('AIMETON command dispatch ledger')
              .addList([
                `command: ${command}`,
                `target_workflow: ${route.workflow_id}`,
                `issue: ${issueNumber}`,
                `actor: ${context.actor}`,
                `exact_sha: ${sha}`,
                'result: dispatched',
              ])
              .write();
            core.info(`Dispatched ${route.workflow_id} for exact SHA ${sha}`);
