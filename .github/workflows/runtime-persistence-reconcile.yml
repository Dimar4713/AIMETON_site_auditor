name: Runtime Persistence Reconcile

on:
  workflow_run:
    workflows:
      - Configure DaData Stage
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-runtime-persistence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 15
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      STAGE_URL: https://stage-auditor.aimeton.ru
      SERVICE: auditor
      CONTAINER: aimeton-auditor
      DATA_DIR: /opt/aimeton/auditor-stack/data/runtime-core
      RUNTIME_COMPOSE: /opt/aimeton/auditor-stack/docker-compose.runtime-secrets.yml

    steps:
      - name: Resolve exact deployed source SHA
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(tr -d '[:space:]' < app-source-sha.txt)"
          [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$deployed" >> "$GITHUB_OUTPUT"
          echo "Persistence deployed source SHA: $deployed"

      - name: Reconcile persistent runtime storage
        id: reconcile
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          report="$RUNNER_TEMP/runtime-persistence-reconcile.md"
          backup="$RUNTIME_COMPOSE.before-persistence.$(date -u +%Y%m%dT%H%M%SZ).bak"
          expected_volume='./data/runtime-core:/app/data'
          : > "$report"

          test -f docker-compose.yml
          test -f "$RUNTIME_COMPOSE"
          docker ps --format '{{.Names}}' | grep -Fxq "$CONTAINER"
          install -d -m 0700 "$DATA_DIR"
          expected_source="$(readlink -f "$DATA_DIR")"

          compose_correct=no
          grep -Fq "$expected_volume" "$RUNTIME_COMPOSE" && compose_correct=yes
          live_mount="$(docker inspect "$CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}|{{.Source}}|{{.Destination}}{{end}}{{end}}' 2>/dev/null || true)"
          live_type=''; live_source=''; live_destination=''
          [[ -z "$live_mount" ]] || IFS='|' read -r live_type live_source live_destination <<< "$live_mount"
          mount_correct=no
          if [[ "$live_type" == bind && "$live_destination" == '/app/data' && "$(readlink -f "${live_source:-/nonexistent}" 2>/dev/null || true)" == "$expected_source" ]]; then
            mount_correct=yes
          fi

          mutation_required=no
          if [[ "$compose_correct" != yes || "$mount_correct" != yes ]]; then
            mutation_required=yes
            cp -a "$RUNTIME_COMPOSE" "$backup"
            if [[ "$compose_correct" != yes ]]; then
              if grep -Fq '/app/data' "$RUNTIME_COMPOSE"; then
                sed -i -E 's#^([[:space:]]*)- .*:/app/data[[:space:]]*$#\1- ./data/runtime-core:/app/data#' "$RUNTIME_COMPOSE"
              else
                printf '%s\n' '    volumes:' '      - ./data/runtime-core:/app/data' >> "$RUNTIME_COMPOSE"
              fi
            fi
          fi

          docker compose -f docker-compose.yml -f docker-compose.runtime-secrets.yml config --quiet
          if [[ "$mutation_required" == yes ]]; then
            docker compose -f docker-compose.yml -f docker-compose.runtime-secrets.yml up -d --force-recreate "$SERVICE"
          fi

          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER" 2>/dev/null || true)"
            [[ "$status" != healthy ]] || break
            [[ "$status" != unhealthy && "$status" != exited && "$status" != dead ]] || exit 1
            sleep 5
          done
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$status" == healthy ]]

          mount="$(docker inspect "$CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}|{{.Source}}|{{.Destination}}{{end}}{{end}}')"
          IFS='|' read -r mount_type mount_source mount_destination <<< "$mount"
          [[ "$mount_type" == bind && "$mount_destination" == '/app/data' ]]
          [[ "$(readlink -f "$mount_source")" == "$expected_source" ]]

          health="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/health")"
          python3 -c 'import json,sys; p=json.loads(sys.argv[1]); assert p.get("status")=="ok", p' "$health"

          docker exec -i "$CONTAINER" python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          path=Path(os.environ.get('AIMETON_RUNTIME_DB','/app/data/runtime-core.sqlite3'))
          assert path.exists(), path
          with sqlite3.connect(f'file:{path}?mode=ro', uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'runtime_meta','runtime_records','runtime_tasks'} <= tables
          PY

          {
            echo '## Runtime persistence reconcile evidence'
            echo
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- deployed SHA: \`${{ steps.source.outputs.sha }}\`"
            echo "- mutation required: \`$mutation_required\`"
            echo "- container health: \`$status\`"
            echo "- persistent mount: \`$mount\`"
            echo '- marketplace actions: `disabled`'
            echo '- hosted runner: `disabled`'
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          install -d -m 0700 "$STACK_DIR/deployment-evidence"
          cp "$report" "$STACK_DIR/deployment-evidence/runtime-persistence-reconcile-${GITHUB_RUN_ID}.md"
          chmod 0600 "$STACK_DIR/deployment-evidence/runtime-persistence-reconcile-${GITHUB_RUN_ID}.md"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Publish evidence to SA-03.4 without marketplace actions
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ steps.reconcile.outputs.report }}
        run: |
          set -Eeuo pipefail
          payload="$(REPORT_PATH="$REPORT_PATH" python3 - <<'PY'
          import json, os
          print(json.dumps({'body': open(os.environ['REPORT_PATH'], encoding='utf-8').read()[:60000]}, ensure_ascii=False))
          PY
          )"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/159/comments" -d "$payload"
