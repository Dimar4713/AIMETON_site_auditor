name: Temporary Second Honest Hunter Stage E2E

on:
  push:
    branches:
      - diag/hunter-second-honest-e2e

permissions:
  contents: read
  issues: write

concurrency:
  group: second-honest-hunter-stage-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 35
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EXPECTED_SHA: 30b355293ec4aa02a5a2414bf9dfd2fe0954fe13
      E2E_REGION: Красноярск
      E2E_INDUSTRY: Стоматология
      EXPECTED_PROVIDERS: searxng,yandex
      REPORT: /tmp/second-honest-hunter-e2e-${{ github.run_id }}.md

    steps:
      - name: Record owner authorization and exact target
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Second honest Hunter Stage E2E after quality fixes'
            echo
            echo '- authorization: continuation of the owner-approved honest Stage testing mission in ChatGPT on 2026-08-09'
            echo '- paid search calls: explicitly permitted for this verification path'
            echo "- exact target SHA: \`$EXPECTED_SHA\`"
            echo "- payload: region=\`$E2E_REGION\`, industries=[\`$E2E_INDUSTRY\`]"
            echo "- expected live providers: \`$EXPECTED_PROVIDERS\`"
            echo '- baseline comparison: first honest run 31311244838 = 692 raw → 168 unique → 104 qualified → 100 returned; 0.20 RUB Yandex'
          } > "$REPORT"

      - name: Verify exact deployed SHA health and runtime policy
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$EXPECTED_SHA" ]]
          [[ "$status" == healthy ]]

          runtime="$(docker exec -i "$CONTAINER" python - <<'PY'
          import json
          from app.search_gateway import search_policy_from_env
          from app.search_strategy_settings import get_search_strategy_settings_repository
          settings=get_search_strategy_settings_repository().get().settings
          policy=settings.apply_search_policy(search_policy_from_env())
          profile=settings.active_profile()
          safe={
              'active_tariff':settings.global_settings.active_tariff,
              'strategy':str(policy.strategy),
              'provider_order':list(policy.provider_order),
              'allowed_providers':sorted(policy.allowed_providers or []),
              'allow_paid_fallback':policy.allow_paid_fallback,
              'allow_paid_fanout':policy.allow_paid_fanout,
              'max_queries':profile.max_queries,
              'results_per_query':profile.results_per_query,
              'max_candidates':profile.max_candidates,
              'output_limit':profile.output_limit,
          }
          assert safe['active_tariff']=='max', safe
          assert safe['strategy']=='exhaustive_coverage', safe
          assert safe['provider_order']==['searxng','yandex'], safe
          assert safe['allow_paid_fanout'] is True, safe
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
          )"
          {
            echo "- exact deployed SHA: \`$deployed\` ✅"
            echo "- Stage health: \`$status\` ✅"
            echo '- runtime policy before paid request:'
            echo '```json'
            echo "$runtime"
            echo '```'
          } | tee -a "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Execute real public Hunter route and compare quality
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(docker exec \
            -e E2E_REGION="$E2E_REGION" \
            -e E2E_INDUSTRY="$E2E_INDUSTRY" \
            -e EXPECTED_PROVIDERS="$EXPECTED_PROVIDERS" \
            -i "$CONTAINER" python - <<'PY'
          import json, os, sqlite3, time
          from collections import Counter
          from urllib.parse import urlsplit
          import httpx

          from app.discovery import _candidate_rank_role
          from app.models import HuntCandidate

          db_path=os.getenv('AIMETON_RUNTIME_DB','data/runtime-core.sqlite3')
          db=sqlite3.connect(db_path,timeout=30)
          before=db.execute('SELECT COALESCE(MAX(rowid),0) FROM mission_trace_events').fetchone()[0]
          db.close()

          payload={'region':os.environ['E2E_REGION'],'industries':[os.environ['E2E_INDUSTRY']]}
          started=time.monotonic()
          response=httpx.post('http://127.0.0.1:5000/api/hunt',json=payload,timeout=1800.0)
          elapsed=round(time.monotonic()-started,3)
          response.raise_for_status()
          data=response.json()

          db=sqlite3.connect(db_path,timeout=30); db.row_factory=sqlite3.Row
          funnel_row=db.execute(
              '''SELECT mission_id,attempt_id,counters_json FROM mission_trace_events
                 WHERE rowid>? AND component='hunter' AND operation='hunt_funnel_complete'
                 ORDER BY rowid DESC LIMIT 1''',(before,)
          ).fetchone()
          assert funnel_row is not None, 'new hunt_funnel_complete event missing'
          mission_id=funnel_row['mission_id']; attempt_id=funnel_row['attempt_id']
          deep_rows=db.execute(
              '''SELECT identity,metadata_json,counters_json FROM mission_trace_events
                 WHERE mission_id=? AND attempt_id=? AND component='hunter'
                   AND operation='candidate_deep_audit_completed' ORDER BY sequence''',
              (mission_id,attempt_id)
          ).fetchall()
          db.close()
          funnel=json.loads(funnel_row['counters_json'] or '{}')

          candidates=[HuntCandidate.model_validate(item) for item in (data.get('candidates') or [])]
          roles=[_candidate_rank_role(c) for c in candidates]
          role_counts=Counter(roles)
          top20=[]
          supporting_deep=[]
          for rank,(candidate,role) in enumerate(zip(candidates,roles),start=1):
              host=(urlsplit(str(candidate.url)).hostname or '').lower().removeprefix('www.')
              item={
                  'rank':rank,
                  'host':host,
                  'company_name':candidate.company_name,
                  'role':role,
                  'final_score':candidate.final_score,
                  'qualification':candidate.qualification,
                  'deep':candidate.deep_analysis_performed,
                  'region_confirmed':candidate.region_confirmed,
              }
              if rank<=20:
                  top20.append(item)
              if role=='supporting_source' and candidate.deep_analysis_performed:
                  supporting_deep.append(item)

          assert len(candidates)==int(funnel.get('returned_candidates',-1)), (len(candidates),funnel)
          assert int(data.get('discovered',-1))==int(funnel.get('unique_candidates',-2)), (data.get('discovered'),funnel)
          assert role_counts.get('direct_candidate',0)>=20, role_counts
          assert all(item['role']=='direct_candidate' for item in top20), top20
          assert not supporting_deep, supporting_deep

          attempts=(data.get('search') or {}).get('attempts') or []
          called_states={'succeeded','empty','failed','cache_hit'}
          participating=sorted({str(a.get('provider')) for a in attempts if a.get('provider') and str(a.get('state')) in called_states})
          expected=sorted(x.strip() for x in os.environ['EXPECTED_PROVIDERS'].split(',') if x.strip())
          missing=sorted(set(expected)-set(participating))
          assert not missing, {'missing_providers':missing,'participating':participating}

          attempt_counts=Counter(f"{a.get('provider')}:{a.get('state')}" for a in attempts)
          provider_costs={}
          for a in attempts:
              provider=str(a.get('provider') or '')
              currency=str(a.get('cost_currency') or '')
              try: amount=float(a.get('cost_amount') or 0)
              except (TypeError,ValueError): amount=0.0
              if provider and currency:
                  provider_costs.setdefault(provider,{})
                  provider_costs[provider][currency]=round(provider_costs[provider].get(currency,0.0)+amount,6)

          deep_hosts=[]
          for row in deep_rows:
              meta=json.loads(row['metadata_json'] or '{}')
              deep_hosts.append({'identity':row['identity'],'source_role':meta.get('source_role'),'qualification':meta.get('qualification')})

          raw=int(funnel.get('raw_results',0)); unique=int(funnel.get('unique_candidates',0)); qualified=int(funnel.get('qualified_candidates',0)); returned=int(funnel.get('returned_candidates',0))
          assert raw>=unique>=qualified>=returned, funnel

          safe={
              'elapsed_seconds':elapsed,
              'funnel':{'raw':raw,'unique':unique,'qualified':qualified,'returned':returned},
              'candidate_role_counts':dict(role_counts),
              'deep_completed_trace_count':len(deep_rows),
              'supporting_sources_with_deep_analysis':len(supporting_deep),
              'top20':top20,
              'participating_providers':participating,
              'provider_attempt_states':dict(attempt_counts),
              'provider_cost_totals':provider_costs,
              'search_total_cost_by_currency':(data.get('search') or {}).get('total_cost_by_currency') or {},
              'mission_id':mission_id,
              'attempt_id':attempt_id,
              'baseline_delta':{
                  'raw':raw-692,
                  'unique':unique-168,
                  'qualified':qualified-104,
                  'returned':returned-100,
                  'deep_completed':len(deep_rows)-71,
              },
          }
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
          )"

          {
            echo
            echo '### Second real `/api/hunt` result'
            echo
            echo '```json'
            echo "$result"
            echo '```'
            echo
            echo '- verdict: ✅ second honest paid Stage E2E passed after quality fixes.'
          } | tee -a "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-honest-hunter-e2e-${{ github.run_id }}
          path: ${{ env.REPORT }}
          if-no-files-found: warn
          retention-days: 30

      - name: Publish evidence to P1-501
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ env.REPORT }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            const path=process.env.REPORT_PATH;
            const body=path && fs.existsSync(path)
              ? fs.readFileSync(path,'utf8')
              : `## Second honest Hunter Stage E2E\n\nWorkflow ${context.runId} failed before sanitized evidence was produced.`;
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:501,body:body.slice(0,60000)});
