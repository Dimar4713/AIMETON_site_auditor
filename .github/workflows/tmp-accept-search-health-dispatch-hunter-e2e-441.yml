name: Temporary Accept Search Health And Dispatch Hunter E2E 441

on:
  push:
    branches:
      - fix/hunter-e2e-router-health-441
    paths:
      - .github/workflows/tmp-accept-search-health-dispatch-hunter-e2e-441.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: tmp-accept-search-health-dispatch-hunter-e2e-441
  cancel-in-progress: false

jobs:
  accept-and-dispatch:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EXPECTED_SHA: 2987e292f7a0b6d12fe2aeb3a3d657cb549a5468

    steps:
      - name: Verify exact deployed SHA and healthy Stage
        shell: bash
        run: |
          set -Eeuo pipefail
          deployed="$(cat "$STACK_DIR/app-source-sha.txt")"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$EXPECTED_SHA" ]]
          [[ "$status" == "healthy" ]]

      - name: Accept effective SearXNG scheduler health without provider calls
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER" python - <<'PY'
          import json
          import httpx

          response = httpx.get('http://127.0.0.1:5000/api/search/health', timeout=30.0)
          response.raise_for_status()
          data = response.json()
          providers = data.get('providers') or []
          searxng = next((row for row in providers if row.get('provider') == 'searxng'), None)
          assert searxng is not None, data
          scheduling = searxng.get('scheduling') or {}
          assert int(scheduling.get('max_concurrency', -1)) == 1, scheduling
          assert float(scheduling.get('jitter_min_seconds', -1)) == 0.2, scheduling
          assert float(scheduling.get('jitter_max_seconds', -1)) == 0.8, scheduling
          safe = {
              'health_status': data.get('status'),
              'searxng_state': searxng.get('state'),
              'max_concurrency': scheduling.get('max_concurrency'),
              'jitter_min_seconds': scheduling.get('jitter_min_seconds'),
              'jitter_max_seconds': scheduling.get('jitter_max_seconds'),
              'provider_calls': 0,
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY

      - name: Dispatch permanent owner-authorized Hunter real E2E
        uses: actions/github-script@v7
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.EXPECTED_SHA;
            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            if (main.data.commit.sha !== sha) {
              core.setFailed(`main moved: expected ${sha}, actual ${main.data.commit.sha}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'accept-hunter-real-e2e-stage.yml',
              ref: 'main',
              inputs: {
                expected_sha: sha,
                region: 'Красноярск',
                industry: 'Стоматология',
                expected_providers: 'searxng,yandex',
                minimum_returned: '10',
                minimum_direct_returned: '10',
                allow_paid_calls: 'true',
              },
            });
            core.info(`Dispatched permanent Hunter real E2E for exact SHA ${sha}`);
