name: UI Stage Visual Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA to audit
        required: true
        type: string
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-stage-visual-audit.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-ui-stage-visual-audit
  cancel-in-progress: false

jobs:
  registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow registration
        run: echo "UI Stage Visual Audit is registered"

  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 262 &&
       startsWith(github.event.comment.body, '/accept-ui-stage ') &&
       github.event.comment.user.login == 'Dimar4713')
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 20
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      STAGE_URL: https://stage-auditor.aimeton.ru
      OUT_DIR: /tmp/ui-262-${{ github.run_id }}

    steps:
      - name: Resolve exact expected SHA
        id: expected
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            expected='${{ inputs.expected_sha }}'
          else
            expected="${{ github.event.comment.body }}"
            expected="${expected#'/accept-ui-stage '}"
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Checkout current audit script
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Capture sanitized full user path
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.expected.outputs.sha }}
        run: bash .github/scripts/ui-stage-visual-audit.sh

      - name: Upload sanitized visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-262-stage-visual-audit-${{ github.run_id }}
          path: ${{ env.OUT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence to UI-262
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ env.OUT_DIR }}/evidence.md
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const fs = require('fs');
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 262,
              body: report.slice(0, 60000),
            });
