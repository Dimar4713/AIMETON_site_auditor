name: Stage Convergence

on:
  workflow_run:
    workflows:
      - Stage Auth Persistence Guard
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact deployed source SHA to converge
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aimeton-stage-convergence
  cancel-in-progress: false

env:
  STACK_DIR: /opt/aimeton/auditor-stack
  STAGE_URL: https://stage-auditor.aimeton.ru
  CONTAINER: aimeton-auditor

jobs:
  resolve-gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      deploy_run_id: ${{ steps.resolve.outputs.deploy_run_id }}
      dadata_run_id: ${{ steps.resolve.outputs.dadata_run_id }}
      persistence_run_id: ${{ steps.resolve.outputs.persistence_run_id }}
      auth_guard_run_id: ${{ steps.resolve.outputs.auth_guard_run_id }}
    steps:
      - name: Resolve exact SHA and wait for required post-deploy gates
        id: resolve
        uses: actions/github-script@v7
        env:
          MANUAL_SHA: ${{ inputs.commit_sha }}
        with:
          script: |
            const targetSha = context.eventName === 'workflow_dispatch'
              ? (process.env.MANUAL_SHA || '').trim()
              : (context.payload.workflow_run?.head_sha || '').trim();
            if (!/^[0-9a-f]{40}$/.test(targetSha)) {
              core.setFailed(`Invalid exact SHA: ${targetSha}`);
              return;
            }
            if (context.eventName !== 'workflow_dispatch') {
              const trigger = context.payload.workflow_run;
              if (!trigger || trigger.conclusion !== 'success' || trigger.head_branch !== 'main') {
                core.setFailed('Automatic convergence requires a successful main Stage Auth Persistence Guard run');
                return;
              }
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deadline = Date.now() + 10 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const latest = runs => runs
              .slice()
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            while (Date.now() < deadline) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                head_sha: targetSha,
                per_page: 100,
              });
              const successful = name => runs.filter(
                run => run.name === name && run.status === 'completed' && run.conclusion === 'success'
              );
              const deploy = latest(successful('Deploy Stage'));
              if (!deploy) {
                core.info(`Waiting for successful Deploy Stage for ${targetSha}`);
                await sleep(10000);
                continue;
              }
              const deployStarted = new Date(deploy.created_at).getTime();
              const afterDeploy = name => successful(name).filter(
                run => new Date(run.created_at).getTime() >= deployStarted
              );
              const dadata = latest(afterDeploy('Configure DaData Stage'));
              const persistence = latest(afterDeploy('Runtime Persistence Reconcile'));
              let auth = latest(afterDeploy('Stage Auth Persistence Guard'));
              if (context.eventName !== 'workflow_dispatch') {
                const trigger = context.payload.workflow_run;
                auth = trigger && trigger.conclusion === 'success' ? trigger : auth;
              }

              if (dadata && persistence && auth) {
                core.setOutput('sha', targetSha);
                core.setOutput('deploy_run_id', String(deploy.id));
                core.setOutput('dadata_run_id', String(dadata.id));
                core.setOutput('persistence_run_id', String(persistence.id));
                core.setOutput('auth_guard_run_id', String(auth.id));
                core.info(`Required gates converged for ${targetSha}: deploy=${deploy.id} dadata=${dadata.id} persistence=${persistence.id} auth=${auth.id}`);
                return;
              }
              core.info(`Waiting for post-deploy gates: dadata=${Boolean(dadata)} persistence=${Boolean(persistence)} auth=${Boolean(auth)}`);
              await sleep(10000);
            }
            core.setFailed(`Timed out waiting for required Stage convergence gates for ${targetSha}`);

  publish-marker:
    needs: resolve-gates
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-gates.outputs.sha }}
          fetch-depth: 1

      - name: Verify live Stage invariants before convergence publication
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-gates.outputs.sha }}
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test "$(cat app-source-sha.txt)" = "$EXPECTED_SHA"

          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          test "$status" = healthy

          mount="$(docker inspect "$CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}|{{.Source}}|{{.Destination}}{{end}}{{end}}')"
          test -n "$mount"
          IFS='|' read -r mount_type mount_source mount_destination <<< "$mount"
          test "$mount_type" = bind
          test "$mount_destination" = /app/data
          test "$(readlink -f "$mount_source")" = "$(readlink -f "$STACK_DIR/data/runtime-core")"

          health="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/health")"
          python3 - "$health" "$EXPECTED_SHA" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('status') == 'ok', payload
          assert payload.get('deployment_sha') == sys.argv[2], payload
          PY

          convergence="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence")"
          python3 - "$convergence" "$EXPECTED_SHA" <<'PY'
          import json, re, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('deployment_sha') == sys.argv[2], payload
          assert re.fullmatch(r'[0-9a-f]{32}', payload.get('runtime_instance_id') or ''), payload
          assert payload.get('secrets_exposed') is False, payload
          PY

          dadata="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/missions/registry-mirror/dadata/health")"
          python3 - "$dadata" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('provider') == 'dadata', payload
          assert payload.get('state') == 'active', payload
          assert payload.get('secrets_exposed') is False, payload
          PY

          docker exec -i "$CONTAINER" python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          runtime=Path(os.environ.get('AIMETON_RUNTIME_DB','data/runtime-core.sqlite3'))
          auth=Path(os.environ.get('AIMETON_AUTH_DB','data/auth.sqlite3'))
          for path in (runtime, auth):
              assert path.exists(), path
              with sqlite3.connect(f'file:{path}?mode=ro', uri=True) as db:
                  assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          with sqlite3.connect(f'file:{auth}?mode=ro', uri=True) as db:
              admins=db.execute("SELECT COUNT(*) FROM users WHERE role='admin' AND is_active=1").fetchone()[0]
              assert admins >= 1
          PY

      - name: Publish restart-aware exact-SHA convergence marker
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-gates.outputs.sha }}
          DEPLOY_RUN_ID: ${{ needs.resolve-gates.outputs.deploy_run_id }}
          DADATA_RUN_ID: ${{ needs.resolve-gates.outputs.dadata_run_id }}
          PERSISTENCE_RUN_ID: ${{ needs.resolve-gates.outputs.persistence_run_id }}
          AUTH_GUARD_RUN_ID: ${{ needs.resolve-gates.outputs.auth_guard_run_id }}
        run: |
          set -Eeuo pipefail
          python3 scripts/write_stage_convergence_marker.py \
            --expected-sha "$EXPECTED_SHA" \
            --deploy-run-id "$DEPLOY_RUN_ID" \
            --dadata-run-id "$DADATA_RUN_ID" \
            --persistence-run-id "$PERSISTENCE_RUN_ID" \
            --auth-guard-run-id "$AUTH_GUARD_RUN_ID"

          snapshot="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence")"
          python3 - "$snapshot" "$EXPECTED_SHA" <<'PY'
          import json, sys
          payload=json.loads(sys.argv[1])
          assert payload.get('state') == 'converged', payload
          assert payload.get('deployment_sha') == sys.argv[2], payload
          assert payload.get('marker_error') is None, payload
          assert payload.get('secrets_exposed') is False, payload
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

      - name: Record sanitized convergence evidence
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-gates.outputs.sha }}
        run: |
          set +e
          mkdir -p convergence-evidence
          curl -sS "$STAGE_URL/api/runtime/convergence" > convergence-evidence/runtime-convergence.json || true
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "timestamp_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "bundle_sha=$(cat "$STACK_DIR/app-source-sha.txt" 2>/dev/null || echo unavailable)"
            docker ps --filter name="$CONTAINER" --format 'container={{.Names}} image={{.Image}} status={{.Status}}'
          } > convergence-evidence/final-state.txt

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-convergence-${{ needs.resolve-gates.outputs.sha }}-${{ github.run_id }}
          path: convergence-evidence/
          if-no-files-found: error
          retention-days: 30
