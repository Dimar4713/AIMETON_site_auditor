name: Stage Convergence

on:
  workflow_run:
    workflows:
      - Stage Auth Persistence Guard
    types:
      - completed
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact deployed source SHA to converge
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: aimeton-stage-convergence
  cancel-in-progress: false

env:
  STACK_DIR: /opt/aimeton/auditor-stack
  STAGE_URL: https://stage-auditor.aimeton.ru
  CONTAINER: aimeton-auditor

jobs:
  converge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      AUTO_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      MANUAL_SHA: ${{ inputs.commit_sha }}

    steps:
      - name: Resolve deployed SHA and completed chain evidence without marketplace actions
        id: gates
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(tr -d '[:space:]' < app-source-sha.txt)"
          [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "${MANUAL_SHA:-}" ]]; then
            [[ "$MANUAL_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$MANUAL_SHA" == "$deployed" ]]
          fi
          echo "sha=$deployed" >> "$GITHUB_OUTPUT"
          run_head_sha="${AUTO_RUN_SHA:-$GITHUB_SHA}"
          [[ "$run_head_sha" =~ ^[0-9a-f]{40}$ ]]
          RUN_HEAD_SHA="$run_head_sha" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.parse, urllib.request

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          sha=os.environ['RUN_HEAD_SHA']
          query=urllib.parse.urlencode({'head_sha': sha, 'per_page': 100})
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs?{query}',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload=json.load(response)
          runs=payload.get('workflow_runs') or []
          required={
              'Deploy Stage': 'deploy_run_id',
              'Configure DaData Stage': 'dadata_run_id',
              'Runtime Persistence Reconcile': 'persistence_run_id',
              'Stage Auth Persistence Guard': 'auth_guard_run_id',
          }
          for name, output in required.items():
              matches=[r for r in runs if r.get('name') == name and r.get('status') == 'completed' and r.get('conclusion') == 'success']
              if not matches:
                  raise SystemExit(f'missing_successful_gate:{name}')
              matches.sort(key=lambda r: r.get('created_at') or '', reverse=True)
              print(f'{output}={matches[0]["id"]}')
          PY

      - name: Materialize exact deployed convergence tooling
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gates.outputs.sha }}
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test "$(tr -d '[:space:]' < app-source-sha.txt)" = "$EXPECTED_SHA"
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init; fi
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git checkout --detach --force FETCH_HEAD
          git reset --hard "$EXPECTED_SHA"
          git clean -ffdx
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f scripts/write_stage_convergence_marker.py

      - name: Verify live Stage invariants before marker publication
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gates.outputs.sha }}
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          test "$(tr -d '[:space:]' < app-source-sha.txt)" = "$EXPECTED_SHA"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          test "$status" = healthy
          mount="$(docker inspect "$CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/app/data"}}{{.Type}}|{{.Source}}|{{.Destination}}{{end}}{{end}}')"
          IFS='|' read -r mount_type mount_source mount_destination <<< "$mount"
          test "$mount_type" = bind
          test "$mount_destination" = /app/data
          test "$(readlink -f "$mount_source")" = "$(readlink -f "$STACK_DIR/data/runtime-core")"

          health="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/health")"
          python3 - "$health" "$EXPECTED_SHA" <<'PY'
          import json, sys
          p=json.loads(sys.argv[1])
          assert p.get('status') == 'ok', p
          assert p.get('deployment_sha') == sys.argv[2], p
          PY

          convergence="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence")"
          python3 - "$convergence" "$EXPECTED_SHA" <<'PY'
          import json, re, sys
          p=json.loads(sys.argv[1])
          assert p.get('deployment_sha') == sys.argv[2], p
          assert re.fullmatch(r'[0-9a-f]{32}', p.get('runtime_instance_id') or ''), p
          assert p.get('secrets_exposed') is False, p
          PY

          dadata="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/missions/registry-mirror/dadata/health")"
          python3 - "$dadata" <<'PY'
          import json, sys
          p=json.loads(sys.argv[1])
          assert p.get('provider') == 'dadata', p
          assert p.get('state') == 'active', p
          assert p.get('secrets_exposed') is False, p
          PY

          docker exec -i "$CONTAINER" python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          runtime=Path(os.environ.get('AIMETON_RUNTIME_DB','/app/data/runtime-core.sqlite3'))
          auth=Path(os.environ.get('AIMETON_AUTH_DB','/app/data/auth.sqlite3'))
          for path in (runtime, auth):
              assert path.exists(), path
              with sqlite3.connect(f'file:{path}?mode=ro', uri=True) as db:
                  assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          with sqlite3.connect(f'file:{auth}?mode=ro', uri=True) as db:
              assert db.execute("SELECT COUNT(*) FROM users WHERE role='admin' AND is_active=1").fetchone()[0] >= 1
          PY

      - name: Publish restart-aware exact-SHA convergence marker
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gates.outputs.sha }}
          DEPLOY_RUN_ID: ${{ steps.gates.outputs.deploy_run_id }}
          DADATA_RUN_ID: ${{ steps.gates.outputs.dadata_run_id }}
          PERSISTENCE_RUN_ID: ${{ steps.gates.outputs.persistence_run_id }}
          AUTH_GUARD_RUN_ID: ${{ steps.gates.outputs.auth_guard_run_id }}
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/write_stage_convergence_marker.py \
            --expected-sha "$EXPECTED_SHA" \
            --deploy-run-id "$DEPLOY_RUN_ID" \
            --dadata-run-id "$DADATA_RUN_ID" \
            --persistence-run-id "$PERSISTENCE_RUN_ID" \
            --auth-guard-run-id "$AUTH_GUARD_RUN_ID"
          snapshot="$(curl --fail --silent --show-error --max-time 30 "$STAGE_URL/api/runtime/convergence")"
          python3 - "$snapshot" "$EXPECTED_SHA" <<'PY'
          import json, sys
          p=json.loads(sys.argv[1])
          assert p.get('state') == 'converged', p
          assert p.get('deployment_sha') == sys.argv[2], p
          assert p.get('marker_error') is None, p
          assert p.get('secrets_exposed') is False, p
          print('stage_convergence=converged')
          PY

      - name: Record sanitized convergence evidence
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gates.outputs.sha }}
        run: |
          set +e
          cd "$STACK_DIR"
          evidence_dir="$STACK_DIR/deployment-evidence/stage-convergence-${GITHUB_RUN_ID}"
          install -d -m 0700 "$evidence_dir"
          curl -sS "$STAGE_URL/api/runtime/convergence" > "$evidence_dir/runtime-convergence.json" || true
          {
            echo "expected_sha=$EXPECTED_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "bundle_sha=$(cat app-source-sha.txt 2>/dev/null || echo unavailable)"
            echo "marketplace_actions=disabled"
            echo "hosted_runner=disabled"
          } > "$evidence_dir/final-state.txt"
          chmod 0600 "$evidence_dir"/* 2>/dev/null || true
          cat "$evidence_dir/final-state.txt" >> "$GITHUB_STEP_SUMMARY"
