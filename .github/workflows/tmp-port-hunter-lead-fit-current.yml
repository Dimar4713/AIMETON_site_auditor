name: Temporary Port Hunter Lead Fit To Current Main

on:
  push:
    branches:
      - fix/hunter-lead-fit-ranking-current

permissions:
  contents: write

jobs:
  port:
    if: ${{ !contains(github.event.head_commit.message, '[lead-fit-current]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hunter-lead-fit-ranking-current
          fetch-depth: 0

      - name: Port reviewed lead-fit files
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin fix/hunter-lead-fit-ranking
          git checkout origin/fix/hunter-lead-fit-ranking -- \
            app/discovery.py \
            app/hunter_lead_fit.py \
            app/models.py \
            tests/test_hunter_lead_fit.py \
            tests/test_hunter_lead_fit_integration.py
          python -m py_compile app/discovery.py app/hunter_lead_fit.py app/models.py
          git config user.name 'AIMETON Hunter Lead Fit'
          git config user.email '127470701+Dimar4713@users.noreply.github.com'
          git add app/discovery.py app/hunter_lead_fit.py app/models.py tests/test_hunter_lead_fit.py tests/test_hunter_lead_fit_integration.py
          git commit -m 'Port Hunter lead-fit ranking onto current main [lead-fit-current]'
          git push origin HEAD:fix/hunter-lead-fit-ranking-current
