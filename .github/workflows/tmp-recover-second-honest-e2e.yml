name: Temporary Recover Second Honest Hunter E2E

on:
  push:
    branches:
      - diag/hunter-second-e2e-recovery

permissions:
  contents: read
  issues: write

jobs:
  recover:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      EXPECTED_SHA: 30b355293ec4aa02a5a2414bf9dfd2fe0954fe13
      REPORT: /tmp/recovered-second-honest-e2e-${{ github.run_id }}.md

    steps:
      - name: Recover completed paid hunt from persistent forensic trace
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          [[ "$deployed" == "$EXPECTED_SHA" ]]
          [[ "$status" == healthy ]]

          result="$(docker exec -i "$CONTAINER" python - <<'PY'
          import json, os, sqlite3
          from collections import Counter, defaultdict
          from urllib.parse import urlsplit

          db_path=os.getenv('AIMETON_RUNTIME_DB','data/runtime-core.sqlite3')
          db=sqlite3.connect(db_path,timeout=30); db.row_factory=sqlite3.Row
          funnel_row=db.execute(
              '''SELECT rowid,mission_id,attempt_id,counters_json,created_at
                 FROM mission_trace_events
                 WHERE component='hunter' AND operation='hunt_funnel_complete'
                   AND created_at >= '2026-08-09T12:15:00'
                 ORDER BY rowid DESC LIMIT 1'''
          ).fetchone()
          assert funnel_row is not None, 'second honest hunt funnel not found'
          mission=funnel_row['mission_id']; attempt=funnel_row['attempt_id']
          funnel=json.loads(funnel_row['counters_json'] or '{}')

          returned_rows=db.execute(
              '''SELECT sequence,counters_json,metadata_json
                 FROM mission_trace_events
                 WHERE mission_id=? AND attempt_id=? AND component='hunter'
                   AND operation='candidate_returned'
                 ORDER BY sequence''',(mission,attempt)
          ).fetchall()
          deep_rows=db.execute(
              '''SELECT sequence,counters_json,metadata_json
                 FROM mission_trace_events
                 WHERE mission_id=? AND attempt_id=? AND component='hunter'
                   AND operation='candidate_deep_audit_completed'
                 ORDER BY sequence''',(mission,attempt)
          ).fetchall()
          provider_rows=db.execute(
              '''SELECT provider,state,duration_ms,counters_json,metadata_json
                 FROM mission_trace_events
                 WHERE mission_id=? AND attempt_id=? AND component='search_gateway'
                   AND operation='response_received'
                 ORDER BY sequence''',(mission,attempt)
          ).fetchall()
          db.close()

          returned=[]; role_counts=Counter(); qual_counts=Counter(); deep_flags=Counter()
          for row in returned_rows:
              c=json.loads(row['counters_json'] or '{}'); m=json.loads(row['metadata_json'] or '{}')
              url=str(m.get('candidate_url') or ''); host=(urlsplit(url).hostname or '').lower().removeprefix('www.')
              role=str(m.get('source_role') or 'unknown')
              item={
                  'rank':int(c.get('output_rank',0)),
                  'host':host,
                  'title':m.get('candidate_title'),
                  'role':role,
                  'final_score':int(c.get('final_score',0)),
                  'qualification':m.get('qualification'),
                  'deep':bool(m.get('deep_analysis_performed')),
              }
              returned.append(item); role_counts[role]+=1; qual_counts[str(item['qualification'])]+=1; deep_flags[str(item['deep']).lower()]+=1
          returned.sort(key=lambda x:x['rank'])

          deep=[]; deep_role_counts=Counter(); region_counts=Counter()
          for row in deep_rows:
              c=json.loads(row['counters_json'] or '{}'); m=json.loads(row['metadata_json'] or '{}')
              url=str(m.get('candidate_url') or ''); host=(urlsplit(url).hostname or '').lower().removeprefix('www.')
              role=str(m.get('source_role') or 'unknown')
              item={'host':host,'title':m.get('candidate_title'),'role':role,'final_score':int(c.get('final_score',0)),'qualification':m.get('qualification'),'region_confirmed':bool(m.get('region_confirmed'))}
              deep.append(item); deep_role_counts[role]+=1; region_counts[str(item['region_confirmed']).lower()]+=1

          provider_attempts=Counter(); provider_costs=defaultdict(lambda:defaultdict(float)); provider_results=Counter(); latencies=defaultdict(list)
          for row in provider_rows:
              provider=str(row['provider'] or 'unknown'); state=str(row['state'] or 'unknown')
              c=json.loads(row['counters_json'] or '{}'); m=json.loads(row['metadata_json'] or '{}')
              provider_attempts[f'{provider}:{state}']+=1
              provider_results[provider]+=int(c.get('results_received',0) or 0)
              if row['duration_ms'] is not None: latencies[provider].append(int(row['duration_ms']))
              currency=str(m.get('cost_currency') or '')
              try: amount=float(m.get('cost_amount') or 0)
              except (TypeError,ValueError): amount=0.0
              if currency: provider_costs[provider][currency]+=amount

          top20=returned[:20]
          non_direct_top20=[x for x in top20 if x['role']!='direct_candidate']
          supporting_deep=[x for x in deep if x['role'] in {'supporting_source','blocked_source'}]
          forbidden_hosts={'2gis.ru','yandex.ru','vk.ru','vk.com','dentistfind.ru','zoon.ru','kp.ru','jsprav.ru','32top.ru','dent-list.ru','vc.ru'}
          forbidden_direct=[x for x in returned if x['host'] in forbidden_hosts and x['role']=='direct_candidate']

          raw=int(funnel.get('raw_results',0)); unique=int(funnel.get('unique_candidates',0)); qualified=int(funnel.get('qualified_candidates',0)); ret=int(funnel.get('returned_candidates',0))
          assert raw>=unique>=qualified>=ret, funnel
          assert ret==len(returned), (ret,len(returned))
          assert not non_direct_top20, non_direct_top20
          assert not supporting_deep, supporting_deep
          assert not forbidden_direct, forbidden_direct
          assert provider_attempts.get('searxng:succeeded',0) >= 1, provider_attempts
          assert provider_attempts.get('yandex:succeeded',0) >= 1, provider_attempts

          safe={
              'mission_id':mission,
              'attempt_id':attempt,
              'created_at':funnel_row['created_at'],
              'funnel':{'raw':raw,'unique':unique,'qualified':qualified,'returned':ret},
              'baseline_delta':{'raw':raw-692,'unique':unique-168,'qualified':qualified-104,'returned':ret-100,'deep_completed':len(deep)-71},
              'returned_role_counts':dict(role_counts),
              'returned_qualification_counts':dict(qual_counts),
              'returned_deep_flags':dict(deep_flags),
              'deep_completed_count':len(deep),
              'deep_role_counts':dict(deep_role_counts),
              'deep_region_confirmed_counts':dict(region_counts),
              'top20':top20,
              'supporting_sources_with_deep_analysis':len(supporting_deep),
              'forbidden_hosts_misclassified_direct':forbidden_direct,
              'provider_attempt_states':dict(provider_attempts),
              'provider_results_received':dict(provider_results),
              'provider_cost_totals':{p:{cur:round(v,6) for cur,v in cs.items()} for p,cs in provider_costs.items()},
              'provider_latency_ms_avg':{p:round(sum(vals)/len(vals),1) for p,vals in latencies.items() if vals},
              'provider_calls_recovery':0,
          }
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          PY
          )"

          {
            echo '## Recovered second honest paid Hunter E2E'
            echo
            echo "- exact deployed SHA: \`$deployed\`"
            echo '- additional provider calls during recovery: `0`'
            echo '- original paid `/api/hunt` completed before the diagnostic SQL error in run `31312817349`.'
            echo
            echo '```json'
            echo "$result"
            echo '```'
            echo
            echo '- verdict: ✅ completed paid hunt recovered from durable forensic trace; quality assertions passed.'
          } | tee "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Upload recovered evidence
        uses: actions/upload-artifact@v4
        with:
          name: recovered-second-honest-e2e-${{ github.run_id }}
          path: ${{ env.REPORT }}
          retention-days: 30

      - name: Publish recovered evidence to P1-501
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ env.REPORT }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs'); const body=fs.readFileSync(process.env.REPORT_PATH,'utf8');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:501,body:body.slice(0,60000)});
