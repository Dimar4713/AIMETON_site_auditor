name: Accept Live Analysis Stage

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed source SHA to accept
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: aimeton-accept-live-analysis-stage
  cancel-in-progress: false

jobs:
  accept:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 15
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      REPORT: /tmp/ui-270-live-analysis-stage-${{ github.run_id }}.md

    steps:
      - name: Resolve exact expected SHA
        id: expected
        shell: bash
        run: |
          set -Eeuo pipefail
          expected='${{ inputs.expected_sha }}'
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Initialize sanitized evidence
        shell: bash
        run: |
          {
            echo '## UI-270 live analysis stage acceptance'
            echo
            echo "- workflow run: $GITHUB_RUN_ID"
            echo "- timestamp UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' '- expected source SHA: `${{ steps.expected.outputs.sha }}`'
          } > "$REPORT"

      - name: Verify exact deployed SHA and healthy auditor
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          deployed="$(cat app-source-sha.txt)"
          status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER")"
          {
            printf '%s\n' "- deployed source SHA: \`$deployed\`"
            printf '%s\n' "- stage auditor status: \`$status\`"
          } | tee -a "$REPORT" "$GITHUB_STEP_SUMMARY"
          [[ "$deployed" == "${{ steps.expected.outputs.sha }}" ]]
          [[ "$status" == healthy ]]

      - name: Verify deployed live reporter contract
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER" python - <<'PY'
          from pathlib import Path

          root = Path('/app/static')
          index = (root / 'index.html').read_text(encoding='utf-8')
          reporter = (root / 'live-analysis.js').read_text(encoding='utf-8')
          assert 'live-analysis.js' in index
          for token in ('/api/analyze/start', 'status_url', 'events_url', 'mission_id'):
              assert token in reporter, token
          for state in ('queued', 'running', 'stalled', 'degraded', 'blocked', 'completed', 'failed'):
              assert state in reporter, state
          for token in ('next_action', 'missionElapsed', 'aimeton_active_analysis_v1'):
              assert token in reporter, token
          forbidden = ('chain-of-thought', 'raw_prompt', 'provider_payload', 'access_token', 'secret_key')
          lowered = reporter.lower()
          for token in forbidden:
              assert token not in lowered, token
          PY
          {
            echo '- deployed main page loads live reporter: ✅'
            echo '- immediate mission/status/events contract bindings: ✅'
            echo '- typed state and reload-resume narration contract: ✅'
            echo '- forbidden internal projection tokens absent: ✅'
          } | tee -a "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Exercise cost-free start to terminal failure path
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec -i "$CONTAINER" python - <<'PY'
          import json
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = 'http://127.0.0.1:5000'

          def request(path, *, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload).encode('utf-8')
              req = Request(
                  base + path,
                  data=body,
                  method=method,
                  headers={'Content-Type': 'application/json'},
              )
              try:
                  with urlopen(req, timeout=10) as response:
                      return response.status, json.loads(response.read().decode('utf-8'))
              except HTTPError as exc:
                  return exc.code, json.loads(exc.read().decode('utf-8'))

          code, started = request(
              '/api/analyze/start',
              method='POST',
              payload={'url': 'https://nonexistent.invalid'},
          )
          assert code == 202, (code, started)
          assert started['mission_id'].startswith('mission_')
          assert started['analysis_id'].startswith('analysis_')
          assert started['status_url'].startswith('/api/analyze/')
          assert started['events_url'].endswith('/events')

          deadline = time.monotonic() + 30
          status = None
          events = []
          while time.monotonic() < deadline:
              status_code, status = request(started['status_url'])
              events_code, events = request(started['events_url'])
              assert status_code == 200
              assert events_code == 200
              if status['state'] in {'failed', 'blocked', 'degraded', 'completed'}:
                  break
              time.sleep(0.5)

          assert status is not None
          assert status['state'] == 'failed', status
          states = [event['state'] for event in events]
          phases = [event['phase'] for event in events]
          assert states[0] == 'queued', states
          assert 'running' in states, states
          assert states[-1] == 'failed', states
          assert phases[0] == 'mission_accepted', phases
          assert phases[-1] == 'failed', phases
          projected = json.dumps(events, ensure_ascii=False).lower()
          for token in ('secret', 'prompt', 'chain-of-thought', 'provider_payload'):
              assert token not in projected, token
          print(json.dumps({
              'mission_id_prefix': started['mission_id'].split('_', 1)[0],
              'event_count': len(events),
              'terminal_state': status['state'],
          }, sort_keys=True))
          PY
          {
            echo '- POST /api/analyze/start returned 202 with immediate identifiers: ✅'
            echo '- polling observed queued → running → terminal failed: ✅'
            echo '- terminal failure used an unreachable reserved domain before provider analysis: ✅'
            echo '- sanitized event projection: ✅'
            echo '- verdict: ✅ Live analysis stage acceptance passed.'
          } | tee -a "$REPORT" "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-270-live-analysis-stage-${{ github.run_id }}
          path: ${{ env.REPORT }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish evidence to UI-270
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ env.REPORT }}
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const fs = require('fs');
            const path = process.env.REPORT_PATH;
            const body = path && fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : `## UI-270 live analysis stage acceptance\n\nWorkflow ${context.runId} failed before sanitized evidence was produced.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 270,
              body: body.slice(0, 60000),
            });
