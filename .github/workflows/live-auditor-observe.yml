name: Live Auditor Observe

on:
  push:
    branches:
      - ops/live-auditor-observe-20260815

permissions:
  contents: read

jobs:
  observe:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - stage
      - auditor
    timeout-minutes: 5
    steps:
      - name: Read-only live Stage snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "snapshot_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "-- containers --"
          docker ps --format 'name={{.Names}} image={{.Image}} status={{.Status}}' | grep -E 'aimeton|auditor|caddy|searx|valkey' || true

          mapfile -t candidates < <(docker ps --filter name=aimeton-auditor --format '{{.Names}}')
          app=""
          for c in "${candidates[@]}"; do
            if docker inspect "$c" --format '{{json .Config.Cmd}} {{json .Config.Entrypoint}}' 2>/dev/null | grep -Eqi 'uvicorn|gunicorn|fastapi'; then
              app="$c"
              break
            fi
          done
          if [[ -z "$app" ]]; then
            for c in "${candidates[@]}"; do
              if [[ "$c" == *app* || "$c" == *api* ]]; then app="$c"; break; fi
            done
          fi
          [[ -n "$app" ]] || { echo 'app_container=not_found'; exit 1; }
          echo "app_container=$app"

          echo "-- resource snapshot --"
          docker stats --no-stream --format 'name={{.Name}} cpu={{.CPUPerc}} mem={{.MemUsage}} net={{.NetIO}} pids={{.PIDs}}' "$app"

          echo "-- socket state summary; no addresses emitted --"
          docker exec "$app" python - <<'PY' || true
          from collections import Counter
          from pathlib import Path

          states = {
              '01': 'ESTABLISHED', '02': 'SYN_SENT', '03': 'SYN_RECV', '04': 'FIN_WAIT1',
              '05': 'FIN_WAIT2', '06': 'TIME_WAIT', '07': 'CLOSE', '08': 'CLOSE_WAIT',
              '09': 'LAST_ACK', '0A': 'LISTEN', '0B': 'CLOSING'
          }
          total = Counter()
          inbound_5000 = Counter()
          outbound_443 = Counter()
          for filename in ('/proc/net/tcp', '/proc/net/tcp6'):
              p = Path(filename)
              if not p.exists():
                  continue
              for line in p.read_text().splitlines()[1:]:
                  parts = line.split()
                  if len(parts) < 4:
                      continue
                  local_port = int(parts[1].split(':')[1], 16)
                  remote_port = int(parts[2].split(':')[1], 16)
                  state = states.get(parts[3], parts[3])
                  total[state] += 1
                  if local_port == 5000:
                      inbound_5000[state] += 1
                  if remote_port == 443:
                      outbound_443[state] += 1
          print('tcp_states=' + ','.join(f'{k}:{v}' for k,v in sorted(total.items())))
          print('local_port_5000=' + ','.join(f'{k}:{v}' for k,v in sorted(inbound_5000.items())))
          print('outbound_remote_443=' + ','.join(f'{k}:{v}' for k,v in sorted(outbound_443.items())))
          PY

          echo "-- process snapshot --"
          docker top "$app" -eo pid,ppid,etime,pcpu,pmem,args 2>/dev/null | head -n 30 || true

          echo "-- health --"
          curl --fail --silent --show-error --max-time 10 https://stage-auditor.aimeton.ru/api/health || true
          echo

          echo "-- sanitized relevant app logs, last 30m --"
          docker logs --since 30m "$app" 2>&1 \
            | tail -n 2000 \
            | grep -Eai 'mcp|analy|aimeton\.ru|routerai|provider|timeout|timed out|error|exception|traceback|POST|GET' \
            | sed -E 's/(Authorization:?[[:space:]]*|Bearer[[:space:]]+)[A-Za-z0-9._~+\/=:-]+/\1[REDACTED]/Ig' \
            | sed -E 's/([?&](token|key|api_key|access_token)=)[^&[:space:]]+/\1[REDACTED]/Ig' \
            | tail -n 160 || true

          echo "-- sqlite runtime file metadata only --"
          docker exec "$app" sh -lc 'find /app/data -maxdepth 1 -type f \( -name "*runtime*.sqlite3" -o -name "*activity*.sqlite3" \) -printf "%f size=%s mtime=%TY-%Tm-%TdT%TH:%TM:%TSZ\n" 2>/dev/null | sort' || true
