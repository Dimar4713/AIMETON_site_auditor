name: Diag Same Domain Reputation 441

on:
  push:
    branches:
      - diag/same-domain-reputation-441
    paths:
      - .github/workflows/diag-same-domain-reputation-441.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Prove deployed same-domain discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          container="$(docker ps --format '{{.Names}}' | grep -E '^aimeton-auditor$' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" python - <<'PY' | tee evidence/reputation-same-domain.txt
          import asyncio
          from app.evidence_crawler.search_discovery import discover_same_domain_urls
          from app.search_gateway.models import AttemptState, FallbackReason

          HARD = {
              FallbackReason.PROVIDER_BLOCKED,
              FallbackReason.RATE_LIMITED,
              FallbackReason.CAPTCHA,
          }

          async def main():
              result = await discover_same_domain_urls(
                  'https://reputation.ru/',
                  company_name='Reputation.ru',
                  mission_id='diag-reputation-same-domain-441-after-448',
                  correlation_id='diag-reputation-same-domain-441-after-448',
                  max_urls=8,
              )
              print(f'state={result.diagnostics.state.value}')
              print(f'selected_provider={result.diagnostics.selected_provider}')
              print(f'url_count={len(result.urls)}')
              for index, url in enumerate(result.urls, 1):
                  print(f'url_{index}={url}')

              hard_network_failures = 0
              circuit_skips = 0
              for attempt in result.diagnostics.attempts:
                  reason = attempt.reason.value if attempt.reason else 'none'
                  print(
                      'attempt='
                      f'{attempt.provider}:{attempt.state.value}:'
                      f'{reason}:{attempt.result_count}:{attempt.latency_ms}'
                  )
                  if attempt.state == AttemptState.FAILED and attempt.reason in HARD:
                      hard_network_failures += 1
                  if attempt.state == AttemptState.SKIPPED and attempt.reason == FallbackReason.CIRCUIT_OPEN:
                      circuit_skips += 1

              print(f'hard_network_failures={hard_network_failures}')
              print(f'circuit_skips={circuit_skips}')
              if hard_network_failures > 3:
                  raise SystemExit('hard-blocked providers were called repeatedly across discovery topics')
              if hard_network_failures and circuit_skips == 0:
                  raise SystemExit('hard upstream failure did not suppress later batch calls')
              if result.urls and not all('reputation.ru' in url for url in result.urls):
                  raise SystemExit('cross-domain URL escaped same-domain filter')

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reputation-same-domain-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
