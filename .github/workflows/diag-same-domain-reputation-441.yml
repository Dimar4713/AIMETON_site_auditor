name: Diag Same Domain Reputation 441

on:
  push:
    branches:
      - diag/same-domain-reputation-441
    paths:
      - .github/workflows/diag-same-domain-reputation-441.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Classify discovered Reputation response body
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          container="$(docker ps --format '{{.Names}}' | grep -E '^aimeton-auditor$' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" python - <<'PY' | tee evidence/reputation-body-classification.txt
          import asyncio
          import binascii
          import httpx

          URL = 'https://reputation.ru/ogrn/1151690002980'
          CANDIDATES = ('utf-8', 'cp1251', 'koi8-r', 'iso-8859-5', 'cp866')

          def quality(content: bytes, encoding: str):
              text = content.decode(encoding, errors='replace')
              replacements = text.count('\ufffd')
              controls = sum(
                  1 for char in text
                  if ord(char) < 32 and char not in {'\t', '\n', '\r', '\f'}
              )
              lower = text[:4096].casefold()
              html_markers = sum(marker in lower for marker in ('<!doctype', '<html', '<head', '<body', '<meta'))
              return replacements, controls, html_markers, len(text)

          async def main():
              async with httpx.AsyncClient(timeout=15, follow_redirects=True) as client:
                  response = await client.get(URL)
              content = response.content
              print(f'status={response.status_code}')
              for header in ('content-type', 'content-encoding', 'content-length', 'transfer-encoding', 'server', 'vary'):
                  print(f'header_{header.replace("-", "_")}={response.headers.get(header, "")}')
              print(f'bytes={len(content)}')
              print(f'first32_hex={binascii.hexlify(content[:32]).decode()}')
              print(f'first16_repr={content[:16]!r}')
              print(f'null_bytes={content.count(bytes([0]))}')
              high = sum(byte >= 128 for byte in content)
              print(f'high_byte_ratio={high / max(1, len(content)):.8f}')
              for encoding in CANDIDATES:
                  replacements, controls, markers, length = quality(content, encoding)
                  print(
                      f'candidate={encoding}|replacements={replacements}|'
                      f'replacement_ratio={replacements / max(1, length):.8f}|'
                      f'control_ratio={controls / max(1, length):.8f}|html_markers={markers}'
                  )

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reputation-body-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
