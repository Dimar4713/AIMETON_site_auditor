name: Diag Same Domain Reputation 441

on:
  push:
    branches:
      - diag/same-domain-reputation-441
    paths:
      - .github/workflows/diag-same-domain-reputation-441.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Prove deployed DocumentPipeline fetch after supported-encoding fix
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          container="$(docker ps --format '{{.Names}}' | grep -E '^aimeton-auditor$' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" python - <<'PY' | tee evidence/reputation-pipeline-after-449.txt
          import asyncio

          from app.document_pipeline import DocumentPipeline, DocumentRequest, FetchPolicy

          URL = 'https://reputation.ru/ogrn/1151690002980'

          async def main():
              fetched = await DocumentPipeline().fetch(
                  DocumentRequest(
                      mission_id='diag-reputation-pipeline-after-449',
                      source_id='source-reputation-after-449',
                      correlation_id='diag-reputation-pipeline-after-449',
                      url=URL,
                  ),
                  FetchPolicy(
                      timeout_seconds=15,
                      allowed_hosts=frozenset({'reputation.ru', 'www.reputation.ru'}),
                      allow_crawl4ai=False,
                      allow_browser=False,
                  ),
              )
              print(f'pipeline_ok=1')
              print(f'url={fetched.document.url}')
              print(f'title={fetched.document.title}')
              print(f'media_type={fetched.document.media_type}')
              print(f'fetch_path={fetched.diagnostics.path.value}')
              print(f'raw_bytes={fetched.diagnostics.raw_bytes}')
              print(f'encoding={fetched.diagnostics.detected_encoding}')
              print(f'encoding_source={fetched.diagnostics.encoding_source}')
              print(f'blocks={len(fetched.blocks)}')
              print(f'links={len(fetched.links)}')
              print(f'document_id={fetched.document.id}')
              if str(fetched.document.url) != URL:
                  raise SystemExit('unexpected final URL')
              if fetched.diagnostics.encoding_source != 'http':
                  raise SystemExit('declared HTTP charset was not used')
              if not fetched.blocks:
                  raise SystemExit('no document blocks extracted')

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reputation-pipeline-after-449-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
