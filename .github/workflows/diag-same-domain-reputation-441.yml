name: Diag Same Domain Reputation 441

on:
  push:
    branches:
      - diag/same-domain-reputation-441
    paths:
      - .github/workflows/diag-same-domain-reputation-441.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Compare singleton DocumentPipeline with crawler path
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          container="$(docker ps --format '{{.Names}}' | grep -E '^aimeton-auditor$' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" python - <<'PY' | tee evidence/reputation-singleton-vs-crawler.txt
          import asyncio

          from app.document_pipeline import DocumentRequest, FetchPolicy, get_document_pipeline
          from app.evidence_crawler import BootstrapCrawlPolicy, get_evidence_crawler
          from app.mission_orchestrator import (
              ActionCandidate,
              ActionType,
              EntryPoint,
              MissionOrchestrator,
              PolicySnapshot,
              default_site_mission_request,
          )

          ROOT = 'https://reputation.ru/'
          DISCOVERED = 'https://reputation.ru/ogrn/1151690002980'

          async def main():
              singleton = get_document_pipeline()
              try:
                  fetched = await singleton.fetch(
                      DocumentRequest(
                          mission_id='diag-reputation-singleton',
                          source_id='source-reputation-singleton',
                          correlation_id='diag-reputation-singleton',
                          url=DISCOVERED,
                      ),
                      FetchPolicy(
                          timeout_seconds=15,
                          allowed_hosts=frozenset({'reputation.ru', 'www.reputation.ru'}),
                          allow_crawl4ai=False,
                          allow_browser=False,
                      ),
                  )
                  print('singleton_ok=1')
                  print(f'singleton_url={fetched.document.url}')
                  print(f'singleton_bytes={fetched.diagnostics.raw_bytes}')
                  print(f'singleton_encoding={fetched.diagnostics.detected_encoding}')
                  print(f'singleton_blocks={len(fetched.blocks)}')
              except Exception as exc:
                  print('singleton_ok=0')
                  print(f'singleton_error_type={type(exc).__name__}')
                  print(f'singleton_error={exc}')

              orchestrator = MissionOrchestrator()
              mission = orchestrator.create_mission(
                  default_site_mission_request(ROOT),
                  entry_point=EntryPoint.REST,
              )
              plan = orchestrator.plan(
                  mission.contract.mission_id,
                  deficits=['company_profile_evidence'],
                  candidates=[
                      ActionCandidate(
                          action_type=ActionType.CRAWL_URL,
                          target=DISCOVERED,
                          deficit_code='search_assisted_same_domain',
                          expected_sufficiency_gain=0.8,
                      )
                  ],
                  policy=PolicySnapshot(
                      allowed_hosts=frozenset({'reputation.ru', 'www.reputation.ru'}),
                      remaining_actions=5,
                  ),
              )
              print(f'plan_target={plan.selected_action.target}')
              result = await get_evidence_crawler().run_mission(
                  orchestrator,
                  mission.contract.mission_id,
                  plan=plan,
                  policy=BootstrapCrawlPolicy(
                      max_pages=1,
                      max_depth=0,
                      max_sitemaps=0,
                      max_duration_seconds=30,
                      timeout_seconds=15,
                      min_request_interval_ms=0,
                      allow_crawl4ai=False,
                      allow_browser=False,
                  ),
              )
              print(f'crawler_root={result.root_url}')
              print(f'crawler_status={result.status.value}')
              print(f'crawler_pages={len(result.pages)}')
              print(f'crawler_failed={list(map(str, result.failed_urls))}')
              print('crawler_reasons=' + ','.join(result.reason_codes))
              if result.pages:
                  page = result.pages[0]
                  print(f'crawler_page={page.final_url}|{page.document_id}|{page.title}')
              if not result.pages:
                  raise SystemExit('crawler still failed after singleton comparison')

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reputation-singleton-vs-crawler-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
