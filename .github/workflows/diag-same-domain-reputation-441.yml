name: Diag Same Domain Reputation 441

on:
  push:
    branches:
      - diag/same-domain-reputation-441
    paths:
      - .github/workflows/diag-same-domain-reputation-441.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Isolate production owned same-domain discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          container="$(docker ps --format '{{.Names}}' | grep -E '^aimeton-auditor$' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" python - <<'PY' | tee evidence/reputation-owned-discovery-after-451.txt
          import asyncio

          from app.evidence_crawler.search_discovery import discover_same_domain_urls

          ROOT = 'https://reputation.ru/'

          async def main():
              result = await discover_same_domain_urls(
                  ROOT,
                  company_name='reputation.ru',
                  mission_id='diag-owned-domain-hint-after-451',
                  correlation_id='diag-owned-domain-hint-after-451',
                  max_urls=4,
              )
              print(f'state={result.diagnostics.state.value}')
              print(f'selected_provider={result.diagnostics.selected_provider}')
              print(f'url_count={len(result.urls)}')
              for index, url in enumerate(result.urls, 1):
                  print(f'url_{index}={url}')
              for index, attempt in enumerate(result.diagnostics.attempts, 1):
                  reason = attempt.reason.value if attempt.reason else 'none'
                  print(
                      f'attempt_{index}={attempt.provider}|{attempt.state.value}|'
                      f'{reason}|{attempt.result_count}|{attempt.latency_ms}'
                  )

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reputation-owned-discovery-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
