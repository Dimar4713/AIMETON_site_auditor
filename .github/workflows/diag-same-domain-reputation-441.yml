name: Diag Same Domain Reputation 441

on:
  push:
    branches:
      - diag/same-domain-reputation-441
    paths:
      - .github/workflows/diag-same-domain-reputation-441.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Measure declared UTF-8 quality for discovered Reputation URL
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          container="$(docker ps --format '{{.Names}}' | grep -E '^aimeton-auditor$' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" python - <<'PY' | tee evidence/reputation-encoding-diagnostic.txt
          import asyncio
          import httpx
          from charset_normalizer import from_bytes

          URL = 'https://reputation.ru/ogrn/1151690002980'

          async def main():
              async with httpx.AsyncClient(timeout=15, follow_redirects=True) as client:
                  response = await client.get(URL)
              content = response.content
              tolerant = content.decode('utf-8', errors='replace')
              replacements = tolerant.count('\ufffd')
              controls = sum(
                  1 for char in tolerant
                  if ord(char) < 32 and char not in {'\t', '\n', '\r', '\f'}
              )
              detected = from_bytes(content).best()
              print(f'status={response.status_code}')
              print(f'content_type={response.headers.get("content-type", "")}')
              print(f'bytes={len(content)}')
              print(f'utf8_replacements={replacements}')
              print(f'utf8_replacement_ratio={replacements / max(1, len(tolerant)):.8f}')
              print(f'control_ratio={controls / max(1, len(tolerant)):.8f}')
              print(f'detector_encoding={getattr(detected, "encoding", None)}')
              print(f'detector_chaos={getattr(detected, "chaos", None)}')
              print(f'detector_coherence={getattr(detected, "coherence", None)}')

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reputation-encoding-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
