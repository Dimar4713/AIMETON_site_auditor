name: Diag Same Domain Reputation 441

on:
  push:
    branches:
      - diag/same-domain-reputation-441
    paths:
      - .github/workflows/diag-same-domain-reputation-441.yml

permissions:
  contents: read

jobs:
  prove:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    timeout-minutes: 10
    steps:
      - name: Diagnose deployed DocumentPipeline fetch for discovered Reputation URL
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          container="$(docker ps --format '{{.Names}}' | grep -E '^aimeton-auditor$' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" python - <<'PY' | tee evidence/reputation-fetch-diagnostic.txt
          import asyncio
          import httpx

          from app.document_pipeline import DocumentPipeline, DocumentRequest, FetchPolicy

          URL = 'https://reputation.ru/ogrn/1151690002980'

          async def main():
              async with httpx.AsyncClient(timeout=15, follow_redirects=True) as client:
                  try:
                      response = await client.get(URL)
                      print(f'raw_http_status={response.status_code}')
                      print(f'raw_http_final_url={response.url}')
                      print(f'raw_http_content_type={response.headers.get("content-type", "")}')
                      print(f'raw_http_bytes={len(response.content)}')
                  except Exception as exc:
                      print(f'raw_http_error_type={type(exc).__name__}')
                      print(f'raw_http_error={exc}')

              pipeline = DocumentPipeline()
              try:
                  fetched = await pipeline.fetch(
                      DocumentRequest(
                          mission_id='diag-reputation-fetch-441',
                          source_id='source-reputation-discovered-441',
                          correlation_id='diag-reputation-fetch-441',
                          url=URL,
                      ),
                      FetchPolicy(
                          timeout_seconds=15,
                          allowed_hosts=frozenset({'reputation.ru', 'www.reputation.ru'}),
                          allow_crawl4ai=False,
                          allow_browser=False,
                      ),
                  )
              except Exception as exc:
                  print(f'pipeline_error_type={type(exc).__name__}')
                  print(f'pipeline_error={exc}')
                  print(f'pipeline_error_repr={exc!r}')
                  return

              print(f'pipeline_ok=1')
              print(f'pipeline_url={fetched.document.url}')
              print(f'pipeline_title={fetched.document.title}')
              print(f'pipeline_media_type={fetched.document.media_type}')
              print(f'pipeline_fetch_path={fetched.diagnostics.path.value}')
              print(f'pipeline_blocks={len(fetched.blocks)}')

          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reputation-fetch-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
