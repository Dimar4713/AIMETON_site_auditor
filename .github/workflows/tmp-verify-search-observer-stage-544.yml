name: Temporary verify Search Observer Stage 544

on:
  push:
    branches:
      - evidence/search-observer-stage-544

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, stage, auditor]
    environment: stage
    timeout-minutes: 10
    env:
      STACK_DIR: /opt/aimeton/auditor-stack
      CONTAINER: aimeton-auditor
      MISSION_ID: hunt-81e46a94-5056-45a9-8447-8dae742b508b
      EXPECTED_SHA: ee1c0dceb50dc976427c85ade1842d51e837dfd3
    steps:
      - name: Verify exact Stage SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$STACK_DIR"
          [[ "$(cat app-source-sha.txt)" == "$EXPECTED_SHA" ]]

      - name: Verify observer trace evidence without new search
        shell: bash
        run: |
          set -Eeuo pipefail
          docker exec \
            -e MISSION_ID="$MISSION_ID" \
            -i "$CONTAINER" python - <<'PY'
          import json
          import os
          import sqlite3

          db_path = os.getenv('AIMETON_RUNTIME_DB', 'data/runtime-core.sqlite3')
          db = sqlite3.connect(db_path, timeout=30)
          db.row_factory = sqlite3.Row
          try:
              row = db.execute(
                  '''
                  SELECT mission_id, attempt_id, counters_json, metadata_json
                  FROM mission_trace_events
                  WHERE mission_id = ?
                    AND component = 'hunter'
                    AND operation = 'hunt_search_wave_observed'
                  ORDER BY rowid DESC
                  LIMIT 1
                  ''',
                  (os.environ['MISSION_ID'],),
              ).fetchone()
          finally:
              db.close()

          assert row is not None, 'hunt_search_wave_observed trace event not found'
          counters = json.loads(row['counters_json'])
          metadata = json.loads(row['metadata_json'])
          assert metadata.get('observer_mode') == 'telemetry_only', metadata
          assert metadata.get('routing_changed') is False, metadata
          directions = metadata.get('directions') or []
          assert counters.get('query_count') == len(directions) == 20, (counters, len(directions))
          assert counters.get('result_count', 0) > 0, counters
          assert counters.get('unique_domain_count', 0) > 0, counters
          assert isinstance(metadata.get('provider_result_counts'), dict), metadata
          assert isinstance(metadata.get('attempt_states'), dict), metadata
          print(json.dumps({
              'mission_id': row['mission_id'],
              'attempt_id': row['attempt_id'],
              'observer_mode': metadata.get('observer_mode'),
              'routing_changed': metadata.get('routing_changed'),
              'query_count': counters.get('query_count'),
              'result_count': counters.get('result_count'),
              'unique_domain_count': counters.get('unique_domain_count'),
              'degraded_attempts': counters.get('degraded_attempts'),
              'duplicate_domain_ratio': metadata.get('duplicate_domain_ratio'),
              'provider_result_counts': metadata.get('provider_result_counts'),
              'attempt_states': metadata.get('attempt_states'),
              'total_cost_by_currency': metadata.get('total_cost_by_currency'),
          }, ensure_ascii=False, sort_keys=True))
          PY
